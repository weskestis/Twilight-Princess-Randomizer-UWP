name: Build Twilight Princess Randomizer Xbox UWP

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-xbox.yml'
      - 'Twilight-Princess-Randomizer-UWP-Checkpoint-*.zip'

permissions:
  contents: read

jobs:
  xbox-uwp-x64:
    name: Xbox UWP x64
    runs-on: windows-2022
    timeout-minutes: 240

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v6

      - name: Find and extract checkpoint
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem "$env:GITHUB_WORKSPACE" -Filter 'Twilight-Princess-Randomizer-UWP-Checkpoint-*.zip' | ForEach-Object {
            if ($_.BaseName -match 'Checkpoint-(\d+)$') {
              [PSCustomObject]@{ File = $_; Number = [int]$Matches[1] }
            }
          } | Sort-Object Number -Descending | Select-Object -First 1
          if (-not $zip) { throw 'Checkpoint ZIP not found in repository root.' }
          $zip = $zip.File
          Write-Host "Using checkpoint: $($zip.Name)"
          $extract = "$env:GITHUB_WORKSPACE\checkpoint"
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive -Path $zip.FullName -DestinationPath $extract -Force
          $kit = Join-Path $extract 'Twilight-Princess-Randomizer-UWP'
          if (-not (Test-Path "$kit\scripts\assemble_port.py")) { throw 'Checkpoint contents are not in the expected layout.' }
          "TPR_KIT=$kit" >> $env:GITHUB_ENV

      - name: Enable long Git paths
        shell: powershell
        run: git config --global core.longpaths true

      - name: Enable MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja and native dependencies
        shell: powershell
        run: |
          choco install ninja -y --no-progress
          if (Test-Path 'C:\vcpkg\vcpkg.exe') {
            C:\vcpkg\vcpkg.exe install freetype:x64-windows-static zstd:x64-windows-static
          }

      - name: Create short Windows build root
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'S:\') {
            subst S: /D 2>$null
          }
          subst S: "$env:GITHUB_WORKSPACE"
          New-Item -ItemType Directory -Force 'S:\tmp' | Out-Null
          "TPR_SRC=S:\s" >> $env:GITHUB_ENV
          "TPR_FEED=S:\b\f" >> $env:GITHUB_ENV
          "TPR_PKG=S:\b\p" >> $env:GITHUB_ENV
          "TMP=S:\tmp" >> $env:GITHUB_ENV
          "TEMP=S:\tmp" >> $env:GITHUB_ENV
          Write-Host 'Short build root: S:\'

      - name: Verify custom identity and artwork
        shell: powershell
        run: python "$env:TPR_KIT\scripts\verify_static.py"

      - name: Assemble pinned randomizer plus UWP source
        shell: powershell
        run: python "$env:TPR_KIT\scripts\assemble_port.py" --output "$env:TPR_SRC"

      - name: Verify assembled source
        shell: powershell
        run: python "$env:TPR_KIT\scripts\verify_static.py" "$env:TPR_SRC"

      - name: Configure randomizer static feed
        shell: powershell
        run: |
          cmake -S "$env:TPR_SRC" -B "$env:TPR_FEED" -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL `
            -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON `
            -DCMAKE_OBJECT_PATH_MAX=180 `
            -DDUSK_UWP=ON `
            -DDUSK_ENABLE_UPDATE_CHECKER=OFF `
            -DDUSK_ENABLE_DISCORD=OFF `
            -DDUSK_ENABLE_SENTRY_NATIVE=OFF `
            -DDUSK_ENABLE_CODE_MODS=OFF `
            -DDUSK_VERSION_OVERRIDE=v1.4.1-627-tpr-uwp

      - name: Build randomizer static feed
        shell: powershell
        run: cmake --build "$env:TPR_FEED" --config RelWithDebInfo --parallel 2

      - name: Configure fresh UWP package project
        shell: powershell
        run: |
          cmake -S "$env:TPR_SRC\platforms\uwp" -B "$env:TPR_PKG" `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_SYSTEM_NAME=WindowsStore `
            -DCMAKE_SYSTEM_VERSION=10.0 `
            -DCMAKE_OBJECT_PATH_MAX=180 `
            -DDUSK_DIR="$env:TPR_FEED"

      - name: Create sideload certificate
        id: cert
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $password = [Guid]::NewGuid().ToString('N')
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject 'CN=TwilightPrincessRandomizer' `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -KeyExportPolicy Exportable `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3')
          Export-PfxCertificate -Cert $cert -FilePath "$env:GITHUB_WORKSPACE\TPR-build-signing.pfx" -Password $securePassword | Out-Null
          Export-Certificate -Cert $cert -FilePath "$env:GITHUB_WORKSPACE\TwilightPrincessRandomizer.cer" | Out-Null
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          "password=$password" >> $env:GITHUB_OUTPUT

      - name: Build signed UWP package
        shell: powershell
        run: |
          cmake --build "$env:TPR_PKG" --config RelWithDebInfo --parallel 2 -- `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile="$env:GITHUB_WORKSPACE\TPR-build-signing.pfx" `
            /p:PackageCertificatePassword="${{ steps.cert.outputs.password }}" `
            /p:PackageCertificateThumbprint="${{ steps.cert.outputs.thumbprint }}" `
            /p:AppxBundle=Never `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:GenerateAppxPackageOnBuild=true

      - name: Collect Xbox install package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $packageDir = "$env:GITHUB_WORKSPACE\TPR-Xbox-Package"
          New-Item -ItemType Directory -Force $packageDir | Out-Null
          $buildRoot = "$env:TPR_PKG"
          $packages = Get-ChildItem $buildRoot -Recurse -File | Where-Object { $_.Extension -in '.appx','.msix','.appxbundle','.msixbundle' }
          if (-not $packages) {
            Get-ChildItem $buildRoot -Recurse | Select-Object FullName
            throw 'UWP build did not produce an AppX/MSIX package.'
          }
          foreach ($pkg in $packages) { Copy-Item $pkg.FullName $packageDir -Force }
          Get-ChildItem $buildRoot -Recurse -File -Include *.cer,*.appxsym | ForEach-Object { Copy-Item $_.FullName $packageDir -Force }
          Copy-Item "$env:GITHUB_WORKSPACE\TwilightPrincessRandomizer.cer" $packageDir -Force
          Copy-Item "$env:TPR_KIT\INSTALL_XBOX.md" $packageDir -Force
          Copy-Item "$env:TPR_KIT\APP_IDENTITY.json" $packageDir -Force
          if (Test-Path "$env:GITHUB_WORKSPACE\TPR-build-signing.pfx") { Remove-Item "$env:GITHUB_WORKSPACE\TPR-build-signing.pfx" -Force }
          Compress-Archive -Path "$packageDir\*" -DestinationPath "$env:GITHUB_WORKSPACE\Twilight-Princess-Randomizer-UWP-1.4.1.627-Xbox.zip" -Force

      - name: Release short build drive
        if: always()
        shell: powershell
        run: |
          if (Test-Path 'S:\') { subst S: /D }

      - name: Upload Xbox package
        uses: actions/upload-artifact@v7
        with:
          name: Twilight-Princess-Randomizer-UWP-1.4.1.627-Xbox
          path: |
            Twilight-Princess-Randomizer-UWP-1.4.1.627-Xbox.zip
            TPR-Xbox-Package/
          if-no-files-found: error
