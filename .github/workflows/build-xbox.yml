name: Build Twilight Princess Randomizer Xbox UWP

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-xbox.yml'
      - 'Twilight-Princess-Randomizer-UWP-Checkpoint-*.zip'

permissions:
  contents: read

jobs:
  xbox-uwp-x64:
    name: Xbox UWP x64
    runs-on: windows-2022
    timeout-minutes: 240

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v6

      - name: Find and extract latest checkpoint
        id: checkpoint
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $picked = Get-ChildItem "$env:GITHUB_WORKSPACE" `
            -Filter 'Twilight-Princess-Randomizer-UWP-Checkpoint-*.zip' |
            ForEach-Object {
              $match = [regex]::Match($_.BaseName, 'Checkpoint-(\d+)')
              if ($match.Success) {
                [PSCustomObject]@{
                  File = $_
                  Number = [int]$match.Groups[1].Value
                }
              }
            } |
            Sort-Object Number -Descending |
            Select-Object -First 1

          if (-not $picked) {
            throw 'No Twilight Princess Randomizer UWP checkpoint ZIP found.'
          }

          $zip = $picked.File
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()

          Write-Host "Using checkpoint: $($zip.Name)"
          Write-Host "Checkpoint number: $($picked.Number)"
          Write-Host "SHA-256: $hash"

          "number=$($picked.Number)" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

          $extract = "$env:GITHUB_WORKSPACE\checkpoint"

          if (Test-Path $extract) {
            Remove-Item $extract -Recurse -Force
          }

          Expand-Archive `
            -Path $zip.FullName `
            -DestinationPath $extract `
            -Force

          $kit = Join-Path $extract 'Twilight-Princess-Randomizer-UWP'

          if (-not (Test-Path "$kit\scripts\assemble_port.py")) {
            throw 'Checkpoint contents are not in the expected layout.'
          }

          "TPR_KIT=$kit" >> $env:GITHUB_ENV

      - name: Enable long Git paths
        shell: powershell
        run: |
          git config --global core.longpaths true

      - name: Enable MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja and native dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          choco install ninja -y --no-progress

          if (Test-Path 'C:\vcpkg\vcpkg.exe') {
            C:\vcpkg\vcpkg.exe install `
              freetype:x64-windows-static `
              zstd:x64-windows-static
          }

      - name: Create short Windows build root
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          if (Test-Path 'S:\') {
            subst S: /D 2>$null
          }

          subst S: "$env:GITHUB_WORKSPACE"

          New-Item -ItemType Directory -Force 'S:\tmp' | Out-Null

          "TPR_SRC=S:\s" >> $env:GITHUB_ENV
          "TPR_FEED=S:\b\f" >> $env:GITHUB_ENV
          "TPR_PKG=S:\b\p" >> $env:GITHUB_ENV
          "TMP=S:\tmp" >> $env:GITHUB_ENV
          "TEMP=S:\tmp" >> $env:GITHUB_ENV

          Write-Host 'Short build root created at S:\'

      - name: Verify port kit
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python "$env:TPR_KIT\scripts\verify_static.py"

      - name: Assemble integrated randomizer UWP source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          if (Test-Path "$env:TPR_SRC") {
            Remove-Item "$env:TPR_SRC" -Recurse -Force
          }

          python "$env:TPR_KIT\scripts\assemble_port.py" `
            --output "$env:TPR_SRC"

      - name: Verify integrated source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          python "$env:TPR_KIT\scripts\verify_static.py" "$env:TPR_SRC"

      - name: Create and validate sideload certificate
        id: cert
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $manifestPath = "$env:TPR_SRC\platforms\uwp\Package.appxmanifest"

          if (-not (Test-Path $manifestPath)) {
            throw "Package manifest not found: $manifestPath"
          }

          [xml]$manifest = Get-Content $manifestPath

          $publisher = [string]$manifest.Package.Identity.Publisher

          if ([string]::IsNullOrWhiteSpace($publisher)) {
            throw 'Could not read Publisher from Package.appxmanifest.'
          }

          Write-Host "Manifest Publisher: $publisher"

          $password = [Guid]::NewGuid().ToString('N')
          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject $publisher `
            -FriendlyName 'Twilight Princess Randomizer Xbox UWP Development Certificate' `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -KeyExportPolicy Exportable `
            -KeyUsage DigitalSignature `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @(
              '2.5.29.37={text}1.3.6.1.5.5.7.3.3',
              '2.5.29.19={text}'
            )

          if (-not $cert) {
            throw 'New-SelfSignedCertificate did not return a certificate.'
          }

          if (-not $cert.HasPrivateKey) {
            throw 'Signing certificate does not contain a private key.'
          }

          if ($cert.Subject -ne $publisher) {
            throw "Certificate Subject '$($cert.Subject)' does not match manifest Publisher '$publisher'."
          }

          $codeSigningOid = '1.3.6.1.5.5.7.3.3'
          $hasCodeSigning = $false
          $hasDigitalSignature = $false

          foreach ($extension in $cert.Extensions) {
            if ($extension -is [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]) {
              foreach ($oid in $extension.EnhancedKeyUsages) {
                if ($oid.Value -eq $codeSigningOid) {
                  $hasCodeSigning = $true
                }
              }
            }

            if ($extension -is [System.Security.Cryptography.X509Certificates.X509KeyUsageExtension]) {
              if (
                ($extension.KeyUsages -band `
                  [System.Security.Cryptography.X509Certificates.X509KeyUsageFlags]::DigitalSignature) `
                -ne 0
              ) {
                $hasDigitalSignature = $true
              }
            }
          }

          if (-not $hasCodeSigning) {
            throw 'Certificate is missing the Code Signing EKU.'
          }

          if (-not $hasDigitalSignature) {
            throw 'Certificate is missing DigitalSignature key usage.'
          }

          $pfx = "$env:GITHUB_WORKSPACE\TPR-build-signing.pfx"
          $cer = "$env:GITHUB_WORKSPACE\TwilightPrincessRandomizer.cer"

          Export-PfxCertificate `
            -Cert $cert `
            -FilePath $pfx `
            -Password $securePassword | Out-Null

          Export-Certificate `
            -Cert $cert `
            -FilePath $cer | Out-Null

          if (-not (Test-Path $pfx)) {
            throw 'PFX export failed.'
          }

          if (-not (Test-Path $cer)) {
            throw 'CER export failed.'
          }

          Write-Host "Certificate Subject: $($cert.Subject)"
          Write-Host "Certificate Thumbprint: $($cert.Thumbprint)"
          Write-Host "Certificate valid from: $($cert.NotBefore)"
          Write-Host "Certificate valid until: $($cert.NotAfter)"
          Write-Host 'Code Signing EKU: PASS'
          Write-Host 'DigitalSignature key usage: PASS'
          Write-Host 'Private key: PASS'

          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          "password=$password" >> $env:GITHUB_OUTPUT

      - name: Configure randomizer static feed
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          cmake `
            -S "$env:TPR_SRC" `
            -B "$env:TPR_FEED" `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL `
            -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON `
            -DCMAKE_OBJECT_PATH_MAX=180 `
            -DDUSK_UWP=ON `
            -DDUSK_ENABLE_UPDATE_CHECKER=OFF `
            -DDUSK_ENABLE_DISCORD=OFF `
            -DDUSK_ENABLE_SENTRY_NATIVE=OFF `
            -DDUSK_ENABLE_CODE_MODS=OFF `
            -DDUSK_VERSION_OVERRIDE=v1.4.1-627-tpr-uwp

      - name: Build randomizer static feed
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          cmake `
            --build "$env:TPR_FEED" `
            --config RelWithDebInfo `
            --parallel 2

      - name: Configure Xbox UWP package project
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          cmake `
            -S "$env:TPR_SRC\platforms\uwp" `
            -B "$env:TPR_PKG" `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_SYSTEM_NAME=WindowsStore `
            -DCMAKE_SYSTEM_VERSION=10.0 `
            -DCMAKE_OBJECT_PATH_MAX=180 `
            -DDUSK_DIR="$env:TPR_FEED"

      - name: Build signed Xbox UWP package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          cmake `
            --build "$env:TPR_PKG" `
            --config RelWithDebInfo `
            --parallel 2 `
            -- `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile="$env:GITHUB_WORKSPACE\TPR-build-signing.pfx" `
            /p:PackageCertificatePassword="${{ steps.cert.outputs.password }}" `
            /p:PackageCertificateThumbprint="${{ steps.cert.outputs.thumbprint }}" `
            /p:AppxBundle=Never `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:GenerateAppxPackageOnBuild=true

      - name: Collect Xbox install package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $packageDir = "$env:GITHUB_WORKSPACE\TPR-Xbox-Package"

          if (Test-Path $packageDir) {
            Remove-Item $packageDir -Recurse -Force
          }

          New-Item -ItemType Directory -Force $packageDir | Out-Null

          $packages = Get-ChildItem "$env:TPR_PKG" `
            -Recurse `
            -File |
            Where-Object {
              $_.Extension -in '.appx', '.msix', '.appxbundle', '.msixbundle'
            }

          if (-not $packages) {
            Write-Host 'UWP package output tree:'
            Get-ChildItem "$env:TPR_PKG" -Recurse | Select-Object FullName
            throw 'UWP build did not produce an AppX/MSIX package.'
          }

          foreach ($pkg in $packages) {
            Write-Host "Collecting package: $($pkg.FullName)"
            Copy-Item $pkg.FullName $packageDir -Force
          }

          Get-ChildItem "$env:TPR_PKG" `
            -Recurse `
            -File `
            -Include *.cer,*.appxsym |
            ForEach-Object {
              Copy-Item $_.FullName $packageDir -Force
            }

          Copy-Item `
            "$env:GITHUB_WORKSPACE\TwilightPrincessRandomizer.cer" `
            $packageDir `
            -Force

          Copy-Item `
            "$env:TPR_KIT\INSTALL_XBOX.md" `
            $packageDir `
            -Force

          Copy-Item `
            "$env:TPR_KIT\APP_IDENTITY.json" `
            $packageDir `
            -Force

          $pfx = "$env:GITHUB_WORKSPACE\TPR-build-signing.pfx"

          if (Test-Path $pfx) {
            Remove-Item $pfx -Force
          }

          $output = "$env:GITHUB_WORKSPACE\Twilight-Princess-Randomizer-UWP-1.4.1.627-Xbox.zip"

          if (Test-Path $output) {
            Remove-Item $output -Force
          }

          Compress-Archive `
            -Path "$packageDir\*" `
            -DestinationPath $output `
            -Force

          if (-not (Test-Path $output)) {
            throw 'Final Xbox package ZIP was not created.'
          }

          $hash = (Get-FileHash $output -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $output).Length

          Write-Host ''
          Write-Host '=========================================='
          Write-Host 'XBOX PACKAGE CREATED SUCCESSFULLY'
          Write-Host "Size: $size bytes"
          Write-Host "SHA-256: $hash"
          Write-Host '=========================================='

      - name: Upload Xbox package
        uses: actions/upload-artifact@v7
        with:
          name: Twilight-Princess-Randomizer-UWP-1.4.1.627-Xbox
          path: |
            Twilight-Princess-Randomizer-UWP-1.4.1.627-Xbox.zip
            TPR-Xbox-Package/
          if-no-files-found: error
          retention-days: 14

      - name: Release short build drive
        if: always()
        shell: powershell
        run: |
          if (Test-Path 'S:\') {
            subst S: /D
          }
