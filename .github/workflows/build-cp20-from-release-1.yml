name: Build Working 627 + ZIP + Heart + Cursor + Tracker

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  xbox-uwp-x64:
    name: Xbox UWP x64
    runs-on: windows-2022
    timeout-minutes: 240

    steps:
      - name: Load verified working .627 cursor-tracker hotfix source
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archiveName = 'Twilight-Princess-Randomizer-UWP-Working-627-Zip-Cursor-Tracker-Hotfix-3.zip'
          $expectedHash = '3a12402f2c6e91bbdf653997ce9292932a6e6dd0d91fd079c7527cbf367f4972'
          $downloadDir = Join-Path $env:RUNNER_TEMP 'tpr-working627-zip-download'
          $extractDir = Join-Path $env:RUNNER_TEMP 'tpr-working627-zip-extract'
          New-Item -ItemType Directory -Force $downloadDir,$extractDir | Out-Null

          gh release download tpr-cp20-source `
            --repo "$env:GITHUB_REPOSITORY" `
            --pattern $archiveName `
            --dir $downloadDir
          if ($LASTEXITCODE -ne 0) {
            throw "Could not download $archiveName from release tpr-cp20-source."
          }

          $archive = Join-Path $downloadDir $archiveName
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "Release tpr-cp20-source is missing $archiveName."
          }

          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Working .627 cursor-tracker hotfix source SHA-256 mismatch: expected $expectedHash; got $actualHash."
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $extractDir -Force
          $sourceRoot = Join-Path $extractDir 'Twilight-Princess-Randomizer-UWP'
          if (-not (Test-Path -LiteralPath (Join-Path $sourceRoot 'scripts\assemble_port.py'))) {
            throw 'Source archive root or assembler is invalid.'
          }

          Get-ChildItem -LiteralPath $sourceRoot -Force |
            Copy-Item -Destination $env:GITHUB_WORKSPACE -Recurse -Force

          Write-Host "Verified and loaded cursor-tracker hotfix source: $actualHash"

      - name: Enable long Git paths
        shell: powershell
        run: git config --global core.longpaths true

      - name: Enable MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja and native dependencies
        shell: powershell
        run: |
          choco install ninja -y --no-progress
          if (Test-Path 'C:\vcpkg\vcpkg.exe') {
            C:\vcpkg\vcpkg.exe install freetype:x64-windows-static zstd:x64-windows-static
          }

      - name: Create short Windows build root
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'S:\') {
            subst S: /D 2>$null
          }

          subst S: "$env:GITHUB_WORKSPACE"
          New-Item -ItemType Directory -Force 'S:\tmp' | Out-Null

          "TPR_SRC=S:\s" >> $env:GITHUB_ENV
          "TPR_FEED=S:\b\f" >> $env:GITHUB_ENV
          "TPR_PKG=S:\b\p" >> $env:GITHUB_ENV
          "TMP=S:\tmp" >> $env:GITHUB_ENV
          "TEMP=S:\tmp" >> $env:GITHUB_ENV

      - name: Quick verify identity, artwork, ZIP loader, heart, cursor, and tracker
        shell: powershell
        run: python scripts/verify_static.py

      - name: Assemble pinned randomizer plus UWP source
        shell: powershell
        run: python scripts/assemble_port.py --output "$env:TPR_SRC"

      - name: Verify assembled source
        shell: powershell
        run: python scripts/verify_static.py "$env:TPR_SRC"

      - name: Configure working .627 game core
        shell: powershell
        run: |
          cmake -S "$env:TPR_SRC" -B "$env:TPR_FEED" -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL `
            -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON `
            -DCMAKE_OBJECT_PATH_MAX=180 `
            -DDUSK_UWP=ON `
            -DDUSK_ENABLE_UPDATE_CHECKER=OFF `
            -DDUSK_ENABLE_DISCORD=OFF `
            -DDUSK_ENABLE_SENTRY_NATIVE=OFF `
            -DDUSK_ENABLE_CODE_MODS=OFF `
            -DDUSK_VERSION_OVERRIDE=v1.4.1-627-tpr-uwp-zip-heart-cursor-tracker

      - name: Compile working .627 game core (required)
        shell: powershell
        run: cmake --build "$env:TPR_FEED" --config RelWithDebInfo --parallel 2

      - name: Configure fresh UWP package project
        shell: powershell
        run: |
          cmake -S "$env:TPR_SRC\platforms\uwp" -B "$env:TPR_PKG" `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_SYSTEM_NAME=WindowsStore `
            -DCMAKE_SYSTEM_VERSION=10.0 `
            -DCMAKE_OBJECT_PATH_MAX=180 `
            -DDUSK_DIR="$env:TPR_FEED"

      - name: Create sideload signing certificate
        id: cert
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $password = [Guid]::NewGuid().ToString('N')
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force

          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject 'CN=TwilightPrincessRandomizer' `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -KeyExportPolicy Exportable `
            -KeyUsage DigitalSignature `
            -FriendlyName 'Twilight Princess Randomizer Sideload Signing' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @(
              '2.5.29.37={text}1.3.6.1.5.5.7.3.3',
              '2.5.29.19={text}'
            )

          Export-PfxCertificate `
            -Cert $cert `
            -FilePath "$env:GITHUB_WORKSPACE\TPR-build-signing.pfx" `
            -Password $securePassword | Out-Null

          Export-Certificate `
            -Cert $cert `
            -FilePath "$env:GITHUB_WORKSPACE\TwilightPrincessRandomizer.cer" | Out-Null

          "password=$password" >> $env:GITHUB_OUTPUT

      - name: Build signed UWP package
        shell: powershell
        run: |
          cmake --build "$env:TPR_PKG" --config RelWithDebInfo --parallel 2 -- `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile="$env:GITHUB_WORKSPACE\TPR-build-signing.pfx" `
            /p:PackageCertificatePassword="${{ steps.cert.outputs.password }}" `
            '/p:PackageCertificateThumbprint=' `
            /p:AppxBundle=Never `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:GenerateAppxPackageOnBuild=true

      - name: Verify and collect direct Xbox MSIX
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $packageDir = "$env:GITHUB_WORKSPACE\TPR-Xbox-Package"

          Remove-Item $packageDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $packageDir | Out-Null

          $buildRoot = "$env:TPR_PKG"
          $sourcePackage = Get-ChildItem $buildRoot -Recurse -File -Filter '*.msix' |
            Where-Object { $_.FullName -notmatch '[\\/]Dependencies[\\/]' } |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if (-not $sourcePackage) {
            Get-ChildItem $buildRoot -Recurse | Select-Object FullName
            throw 'UWP build did not produce the expected MSIX package.'
          }

          $package = Join-Path $packageDir 'TwilightPrincessRandomizer_1.4.1.633_x64.msix'
          Copy-Item $sourcePackage.FullName $package -Force

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($package)

          try {
            $manifestEntry = $archive.GetEntry('AppxManifest.xml')
            if (-not $manifestEntry) {
              throw 'Signed MSIX has no AppxManifest.xml.'
            }

            $reader = [System.IO.StreamReader]::new($manifestEntry.Open())
            try {
              $manifest = $reader.ReadToEnd()
            }
            finally {
              $reader.Dispose()
            }

            if ($manifest -notmatch 'Name="TwilightPrincessRandomizer"' -or
                $manifest -notmatch 'Version="1[.]4[.]1[.]633"') {
              throw 'Signed MSIX identity/version is not the expected .633 in-place update.'
            }

            $exeEntry = $archive.GetEntry('TwilightPrincessRandomizer.exe')
            if (-not $exeEntry) {
              throw 'Signed MSIX has no TwilightPrincessRandomizer.exe.'
            }

            $memory = [System.IO.MemoryStream]::new()
            $exeStream = $exeEntry.Open()

            try {
              $exeStream.CopyTo($memory)
            }
            finally {
              $exeStream.Dispose()
            }

            $exeText = [System.Text.Encoding]::ASCII.GetString($memory.ToArray())
            $memory.Dispose()

            if (-not $exeText.Contains('Texture ZIP loading complete')) {
              throw 'Compiled executable is missing the direct texture-ZIP loader marker.'
            }
            if (-not $exeText.Contains('Heart Color') -or
                -not $exeText.Contains('cosmetics.heartColor')) {
              throw 'Compiled executable is missing the CP15 heart-color UI/settings markers.'
            }
            if (-not $exeText.Contains('CURSOR MODE ON') -or
                -not $exeText.Contains('Controller Cursor Speed') -or
                -not $exeText.Contains('controllerCursorSpeed')) {
              throw 'Compiled executable is missing controller-cursor UI/settings markers.'
            }
            if (-not $exeText.Contains('Twilight Princess Item & Check Tracker') -or
                -not $exeText.Contains('Toggle Item & Check Tracker') -or
                -not $exeText.Contains('randomizerTrackerOpacity')) {
              throw 'Compiled executable is missing resizable item/check tracker markers.'
            }

            foreach ($sourceAsset in Get-ChildItem "$env:GITHUB_WORKSPACE\branding\Assets" -File -Filter '*.png') {
              $entry = $archive.GetEntry("Assets/$($sourceAsset.Name)")
              if (-not $entry) {
                throw "Signed MSIX is missing custom artwork '$($sourceAsset.Name)'."
              }

              $entryStream = $entry.Open()
              $sha = [System.Security.Cryptography.SHA256]::Create()

              try {
                $actual = ([BitConverter]::ToString($sha.ComputeHash($entryStream))).Replace('-', '')
              }
              finally {
                $sha.Dispose()
                $entryStream.Dispose()
              }

              $expected = (Get-FileHash $sourceAsset.FullName -Algorithm SHA256).Hash
              if ($actual -ne $expected) {
                throw "Artwork hash mismatch: $($sourceAsset.Name)."
              }
            }
          }
          finally {
            $archive.Dispose()
          }

          if ((Get-Item $package).Length -gt 100MB) {
            throw 'ZIP-only MSIX is unexpectedly larger than 100 MiB; texture payload may have leaked in.'
          }

          Get-ChildItem $buildRoot -Recurse -File |
            Where-Object {
              $_.Extension -in '.appx','.appxbundle','.msixbundle' -and
              $_.FullName -match '[\\/]Dependencies[\\/]'
            } |
            ForEach-Object {
              Copy-Item $_.FullName $packageDir -Force
            }

          Copy-Item "$env:GITHUB_WORKSPACE\TwilightPrincessRandomizer.cer" $packageDir -Force
          Copy-Item "$env:GITHUB_WORKSPACE\INSTALL_XBOX.md" $packageDir -Force
          Copy-Item "$env:GITHUB_WORKSPACE\INSTALL_TEXTURE_ZIPS_XBOX.md" $packageDir -Force
          Copy-Item "$env:GITHUB_WORKSPACE\APP_IDENTITY.json" $packageDir -Force

          if (Test-Path "$env:GITHUB_WORKSPACE\TPR-build-signing.pfx") {
            Remove-Item "$env:GITHUB_WORKSPACE\TPR-build-signing.pfx" -Force
          }

          Write-Host "Verified ZIP-only MSIX: $((Get-Item $package).Length) bytes"

      - name: Release short build drive
        if: always()
        shell: powershell
        run: |
          if (Test-Path 'S:\') {
            subst S: /D
          }
      - name: Upload Xbox MSIX and support package to release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packageDir = Join-Path $env:GITHUB_WORKSPACE 'TPR-Xbox-Package'
          $supportDir = Join-Path $packageDir 'Support'
          $supportZip = Join-Path $packageDir 'Twilight-Princess-Randomizer-UWP-1.4.1.633-Xbox-Support.zip'

          New-Item -ItemType Directory -Force $supportDir | Out-Null
          Copy-Item @(
            (Join-Path $packageDir 'TwilightPrincessRandomizer.cer'),
            (Join-Path $packageDir 'INSTALL_XBOX.md'),
            (Join-Path $packageDir 'INSTALL_TEXTURE_ZIPS_XBOX.md'),
            (Join-Path $packageDir 'APP_IDENTITY.json')
          ) -Destination $supportDir -Force

          Get-ChildItem $packageDir -File |
            Where-Object { $_.Extension -in '.appx','.appxbundle','.msixbundle' } |
            ForEach-Object { Copy-Item $_.FullName $supportDir -Force }

          Compress-Archive -Path (Join-Path $supportDir '*') -DestinationPath $supportZip -CompressionLevel Optimal -Force

          gh release upload tpr-cp20-source `
            (Join-Path $packageDir 'TwilightPrincessRandomizer_1.4.1.633_x64.msix') `
            $supportZip `
            --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not upload the verified .633 Xbox package to release tpr-cp20-source.'
          }
