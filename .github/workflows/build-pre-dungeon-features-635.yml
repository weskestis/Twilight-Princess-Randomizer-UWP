name: Build Pre-Dungeon Features 635

on:
  push:
    branches:
      - codex/pre-dungeon-features-635
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xbox-uwp-x64:
    name: Xbox UWP x64 test package
    runs-on: windows-2022
    timeout-minutes: 240

    steps:
      - name: Check out private build controls
        uses: actions/checkout@v4
        with:
          path: _control

      - name: Load verified working .627/.634 source
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archiveName = 'Twilight-Princess-Randomizer-UWP-Working-627-Seed-Safety-Colors-Hotfix-4.zip'
          $expectedHash = 'b7d66ba41863a1207cbdd8266f3df8657f837cae9b814e59cbbf716d8b42a1c2'
          $downloadDir = Join-Path $env:RUNNER_TEMP 'tpr-working627-seedfix-download'
          $extractDir = Join-Path $env:RUNNER_TEMP 'tpr-working627-seedfix-extract'
          New-Item -ItemType Directory -Force $downloadDir,$extractDir | Out-Null

          gh release download tpr-cp20-source `
            --repo "$env:GITHUB_REPOSITORY" `
            --pattern $archiveName `
            --dir $downloadDir
          if ($LASTEXITCODE -ne 0) {
            throw "Could not download $archiveName from release tpr-cp20-source."
          }

          $archive = Join-Path $downloadDir $archiveName
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "Release tpr-cp20-source is missing $archiveName."
          }

          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Working .627/.634 source SHA-256 mismatch: expected $expectedHash; got $actualHash."
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $extractDir -Force
          $sourceRoot = Join-Path $extractDir 'Twilight-Princess-Randomizer-UWP'
          if (-not (Test-Path -LiteralPath (Join-Path $sourceRoot 'scripts\assemble_port.py'))) {
            throw 'Source archive root or assembler is invalid.'
          }

          Get-ChildItem -LiteralPath $sourceRoot -Force |
            Copy-Item -Destination $env:GITHUB_WORKSPACE -Recurse -Force
          Write-Host "Verified and loaded working .627/.634 source: $actualHash"

      - name: Enable long Git paths
        shell: powershell
        run: git config --global core.longpaths true

      - name: Enable MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja and native dependencies
        shell: powershell
        run: |
          choco install ninja -y --no-progress
          if (Test-Path 'C:\vcpkg\vcpkg.exe') {
            C:\vcpkg\vcpkg.exe install freetype:x64-windows-static zstd:x64-windows-static
          }

      - name: Create short Windows build root
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'S:\') {
            subst S: /D 2>$null
          }
          subst S: "$env:GITHUB_WORKSPACE"
          New-Item -ItemType Directory -Force 'S:\tmp' | Out-Null
          "TPR_SRC=S:\s" >> $env:GITHUB_ENV
          "TPR_FEED=S:\b\f" >> $env:GITHUB_ENV
          "TPR_PKG=S:\b\p" >> $env:GITHUB_ENV
          "TMP=S:\tmp" >> $env:GITHUB_ENV
          "TEMP=S:\tmp" >> $env:GITHUB_ENV

      - name: Verify exact .634 baseline controls
        shell: powershell
        run: python scripts/verify_static.py

      - name: Assemble pinned working .627 runtime source
        shell: powershell
        run: python scripts/assemble_port.py --output "$env:TPR_SRC"

      - name: Verify assembled .634 baseline before patching
        shell: powershell
        run: python scripts/verify_static.py "$env:TPR_SRC"

      - name: Stage exact .634 patch context
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostics = Join-Path $env:GITHUB_WORKSPACE 'TPR-Patch-Diagnostics'
          New-Item -ItemType Directory -Force $diagnostics | Out-Null
          $paths = @(
            'src/dusk/cosmetics/texture_utils.cpp',
            'src/dusk/imgui/ImGuiMenuRandomizer.cpp',
            'src/dusk/randomizer/game/randomizer_context.cpp',
            'src/dusk/randomizer/game/tools.cpp',
            'src/dusk/randomizer/generator/data/settings_list.yaml'
          )
          foreach ($relative in $paths) {
            $source = Join-Path $env:TPR_SRC $relative
            $name = $relative.Replace('/', '__')
            Copy-Item -LiteralPath $source -Destination (Join-Path $diagnostics $name) -Force
          }
          Push-Location $env:TPR_SRC
          try {
            git rev-parse HEAD | Set-Content (Join-Path $diagnostics 'assembled-head.txt') -Encoding ASCII
          }
          finally {
            Pop-Location
          }

      - name: Apply reviewed pre-dungeon feature patch
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $patch = (Resolve-Path "$env:GITHUB_WORKSPACE\_control\patches\pre-dungeon-features-635.patch").Path
          Push-Location "$env:TPR_SRC"
          try {
            $checkOutput = git apply --check $patch 2>&1
            $checkExit = $LASTEXITCODE
            $checkOutput | ForEach-Object { Write-Host $_ }
            if ($checkExit -ne 0) {
              $diagnostics = Join-Path $env:GITHUB_WORKSPACE 'TPR-Patch-Diagnostics'
              New-Item -ItemType Directory -Force $diagnostics | Out-Null
              $checkOutput | Set-Content (Join-Path $diagnostics 'git-apply-check.txt') -Encoding UTF8
              $paths = @(
                'src/dusk/cosmetics/texture_utils.cpp',
                'src/dusk/imgui/ImGuiMenuRandomizer.cpp',
                'src/dusk/randomizer/game/randomizer_context.cpp',
                'src/dusk/randomizer/game/tools.cpp',
                'src/dusk/randomizer/generator/data/settings_list.yaml'
              )
              foreach ($relative in $paths) {
                $source = Join-Path $env:TPR_SRC $relative
                $name = $relative.Replace('/', '__')
                Copy-Item -LiteralPath $source -Destination (Join-Path $diagnostics $name) -Force
              }
              git rev-parse HEAD | Set-Content (Join-Path $diagnostics 'assembled-head.txt') -Encoding ASCII
              throw 'Feature patch does not match the verified .634 baseline.'
            }
            git apply $patch
            if ($LASTEXITCODE -ne 0) { throw 'Feature patch could not be applied.' }
          }
          finally {
            Pop-Location
          }

      - name: Upload patch mismatch diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TPR-635-patch-diagnostics
          path: TPR-Patch-Diagnostics/*
          if-no-files-found: error
          retention-days: 1

      - name: Run breakable extraction and logic tests
        shell: powershell
        run: python -m unittest discover -s "$env:TPR_SRC\tools\tests" -v

      - name: Verify requested feature boundaries
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content "$env:TPR_SRC\platforms\uwp\Package.appxmanifest" -Raw
          if ($manifest -notmatch 'Version="1[.]4[.]1[.]635"') {
            throw 'Assembled package identity is not 1.4.1.635.'
          }

          $checks = @(
            @{ Path='src\dusk\ui\cosmetics.cpp'; Text='Randomize All Colors on Every Load Screen' },
            @{ Path='src\dusk\ui\cosmetics.cpp'; Text='Rainbow Color Rotation Speed' },
            @{ Path='src\dusk\randomizer\game\breakables.cpp'; Text='randomizer.breakables.v2' },
            @{ Path='src\dusk\randomizer\generator\data\settings_list.yaml'; Text='- Name: Pots' },
            @{ Path='src\dusk\randomizer\generator\data\settings_list.yaml'; Text='- Name: Pumpkins' },
            @{ Path='src\dusk\imgui\ImGuiMenuRandomizer.cpp'; Text='Visual Item Tracker' },
            @{ Path='src\dusk\imgui\ImGuiControllerOverlay.cpp'; Text='Input Viewer Layout' },
            @{ Path='src\d\actor\d_a_movie_player.cpp'; Text='Malformed JPEG data in THP frame' }
          )
          foreach ($check in $checks) {
            $path = Join-Path $env:TPR_SRC $check.Path
            if (-not (Select-String -LiteralPath $path -SimpleMatch $check.Text -Quiet)) {
              throw "Missing required marker '$($check.Text)' in $($check.Path)."
            }
          }

          if (Test-Path "$env:TPR_SRC\src\dusk\randomizer\generator\logic\entrance_shuffle.cpp") {
            $patchText = Get-Content "$env:GITHUB_WORKSPACE\_control\patches\pre-dungeon-features-635.patch" -Raw
            if ($patchText.Contains('diff --git a/src/dusk/randomizer/generator/logic/entrance_shuffle.cpp')) {
              throw 'Random dungeon entrance implementation is outside this update.'
            }
          }

      - name: Configure working .627 game core
        shell: powershell
        run: |
          cmake -S "$env:TPR_SRC" -B "$env:TPR_FEED" -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL `
            -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON `
            -DCMAKE_OBJECT_PATH_MAX=180 `
            -DDUSK_UWP=ON `
            -DDUSK_ENABLE_UPDATE_CHECKER=OFF `
            -DDUSK_ENABLE_DISCORD=OFF `
            -DDUSK_ENABLE_SENTRY_NATIVE=OFF `
            -DDUSK_ENABLE_CODE_MODS=OFF `
            -DDUSK_VERSION_OVERRIDE=v1.4.1-627-tpr-uwp-pre-dungeon-635

      - name: Compile working .627 game core
        shell: powershell
        run: cmake --build "$env:TPR_FEED" --config RelWithDebInfo --parallel 2

      - name: Configure fresh UWP package project
        shell: powershell
        run: |
          cmake -S "$env:TPR_SRC\platforms\uwp" -B "$env:TPR_PKG" `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_SYSTEM_NAME=WindowsStore `
            -DCMAKE_SYSTEM_VERSION=10.0 `
            -DCMAKE_OBJECT_PATH_MAX=180 `
            -DDUSK_DIR="$env:TPR_FEED"

      - name: Create sideload signing certificate
        id: cert
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $password = [Guid]::NewGuid().ToString('N')
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject 'CN=TwilightPrincessRandomizer' `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -KeyExportPolicy Exportable `
            -KeyUsage DigitalSignature `
            -FriendlyName 'Twilight Princess Randomizer Sideload Signing' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @(
              '2.5.29.37={text}1.3.6.1.5.5.7.3.3',
              '2.5.29.19={text}'
            )
          Export-PfxCertificate -Cert $cert `
            -FilePath "$env:GITHUB_WORKSPACE\TPR-build-signing.pfx" `
            -Password $securePassword | Out-Null
          Export-Certificate -Cert $cert `
            -FilePath "$env:GITHUB_WORKSPACE\TwilightPrincessRandomizer.cer" | Out-Null
          "password=$password" >> $env:GITHUB_OUTPUT

      - name: Build signed UWP package
        shell: powershell
        run: |
          cmake --build "$env:TPR_PKG" --config RelWithDebInfo --parallel 2 -- `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile="$env:GITHUB_WORKSPACE\TPR-build-signing.pfx" `
            /p:PackageCertificatePassword="${{ steps.cert.outputs.password }}" `
            '/p:PackageCertificateThumbprint=' `
            /p:AppxBundle=Never `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:GenerateAppxPackageOnBuild=true

      - name: Verify and collect private .635 test package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $packageDir = "$env:GITHUB_WORKSPACE\TPR-Xbox-Package"
          Remove-Item $packageDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $packageDir | Out-Null

          $sourcePackage = Get-ChildItem "$env:TPR_PKG" -Recurse -File -Filter '*.msix' |
            Where-Object { $_.FullName -notmatch '[\\/]Dependencies[\\/]' } |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $sourcePackage) {
            throw 'UWP build did not produce an MSIX package.'
          }

          $package = Join-Path $packageDir 'TwilightPrincessRandomizer_1.4.1.635_x64.msix'
          Copy-Item $sourcePackage.FullName $package -Force

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($package)
          try {
            $manifestEntry = $archive.GetEntry('AppxManifest.xml')
            if (-not $manifestEntry) { throw 'Signed MSIX has no AppxManifest.xml.' }
            $reader = [System.IO.StreamReader]::new($manifestEntry.Open())
            try { $packageManifest = $reader.ReadToEnd() }
            finally { $reader.Dispose() }
            if ($packageManifest -notmatch 'Name="TwilightPrincessRandomizer"' -or
                $packageManifest -notmatch 'Version="1[.]4[.]1[.]635"') {
              throw 'Signed MSIX identity/version is not the expected .635 in-place update.'
            }

            $exeEntry = $archive.GetEntry('TwilightPrincessRandomizer.exe')
            if (-not $exeEntry) { throw 'Signed MSIX has no TwilightPrincessRandomizer.exe.' }
            $memory = [System.IO.MemoryStream]::new()
            $exeStream = $exeEntry.Open()
            try { $exeStream.CopyTo($memory) }
            finally { $exeStream.Dispose() }
            $exeText = [System.Text.Encoding]::ASCII.GetString($memory.ToArray())
            $memory.Dispose()

            $markers = @(
              'Texture ZIP loading complete',
              'Committed verified seed data',
              'Randomize All Colors on Every Load Screen',
              'Rainbow Color Rotation Speed',
              'randomizer.breakables.v2',
              'Loading authored pot and pumpkin checks',
              'Visual Item Tracker',
              'Input Viewer Layout',
              'Malformed JPEG data in THP frame'
            )
            foreach ($marker in $markers) {
              if (-not $exeText.Contains($marker)) {
                throw "Compiled executable is missing marker '$marker'."
              }
            }
          }
          finally {
            $archive.Dispose()
          }

          if ((Get-Item $package).Length -gt 100MB) {
            throw 'ZIP-only MSIX is unexpectedly larger than 100 MiB.'
          }

          Get-ChildItem "$env:TPR_PKG" -Recurse -File |
            Where-Object {
              $_.Extension -in '.appx','.appxbundle','.msixbundle' -and
              $_.FullName -match '[\\/]Dependencies[\\/]'
            } |
            ForEach-Object { Copy-Item $_.FullName $packageDir -Force }

          $identity = Get-Content "$env:GITHUB_WORKSPACE\APP_IDENTITY.json" -Raw |
            ConvertFrom-Json
          $identity.version = '1.4.1.635'
          $identity | ConvertTo-Json | Set-Content `
            "$env:GITHUB_WORKSPACE\APP_IDENTITY.json" -Encoding UTF8
          $installGuide = Get-Content "$env:GITHUB_WORKSPACE\INSTALL_XBOX.md" -Raw
          $installGuide = $installGuide.Replace('.634', '.635').Replace('.633', '.634')
          Set-Content "$env:GITHUB_WORKSPACE\INSTALL_XBOX.md" $installGuide -Encoding UTF8

          Copy-Item "$env:GITHUB_WORKSPACE\TwilightPrincessRandomizer.cer" $packageDir -Force
          Copy-Item "$env:GITHUB_WORKSPACE\INSTALL_XBOX.md" $packageDir -Force
          Copy-Item "$env:GITHUB_WORKSPACE\INSTALL_TEXTURE_ZIPS_XBOX.md" $packageDir -Force
          Copy-Item "$env:GITHUB_WORKSPACE\APP_IDENTITY.json" $packageDir -Force

          $supportDir = Join-Path $packageDir 'Support'
          $supportZip = Join-Path $packageDir 'Twilight-Princess-Randomizer-UWP-1.4.1.635-Xbox-Support.zip'
          New-Item -ItemType Directory -Force $supportDir | Out-Null
          Copy-Item @(
            (Join-Path $packageDir 'TwilightPrincessRandomizer.cer'),
            (Join-Path $packageDir 'INSTALL_XBOX.md'),
            (Join-Path $packageDir 'INSTALL_TEXTURE_ZIPS_XBOX.md'),
            (Join-Path $packageDir 'APP_IDENTITY.json')
          ) -Destination $supportDir -Force
          Get-ChildItem $packageDir -File |
            Where-Object { $_.Extension -in '.appx','.appxbundle','.msixbundle' } |
            ForEach-Object { Copy-Item $_.FullName $supportDir -Force }
          Compress-Archive -Path (Join-Path $supportDir '*') `
            -DestinationPath $supportZip -CompressionLevel Optimal -Force

          if (Test-Path "$env:GITHUB_WORKSPACE\TPR-build-signing.pfx") {
            Remove-Item "$env:GITHUB_WORKSPACE\TPR-build-signing.pfx" -Force
          }
          Get-FileHash $package -Algorithm SHA256

      - name: Release short build drive
        if: always()
        shell: powershell
        run: |
          if (Test-Path 'S:\') {
            subst S: /D
          }

      - name: Upload private test artifact
        uses: actions/upload-artifact@v4
        with:
          name: TPR-UWP-1.4.1.635-pre-dungeon-test
          path: TPR-Xbox-Package/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
