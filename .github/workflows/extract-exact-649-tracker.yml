      - name: Collect exact 649 tracker source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'exact-649-tracker'
          New-Item -ItemType Directory -Force $out | Out-Null
          $wanted = @(
            'src\dusk\imgui\ImGuiMenuRandomizer.cpp',
            'src\dusk\imgui\ImGuiMenuRandomizer.hpp',
            'src\dusk\randomizer\game\randomizer_context.hpp',
            'src\dusk\randomizer\game\tools.cpp',
            'src\dusk\randomizer\game\tools.h',
            'src\dusk\settings.cpp',
            'src\dusk\settings.h',
            'src\dusk\ui\rando_config.cpp',
            'src\dusk\ui\settings.cpp',
            'src\dusk\ui\input.cpp',
            'src\dusk\imgui\ImGuiConsole.cpp'
          )
          foreach ($relative in $wanted) {
            $source = Join-Path $env:TPR_SRC $relative
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Exact .649 source missing $relative"
            }
            $safe = ($relative -replace '[:\\/]', '__')
            Copy-Item -LiteralPath $source -Destination (Join-Path $out $safe) -Force
          }
          Get-ChildItem $out | Select-Object Name,Length | Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: exact-649-tracker-source
          path: exact-649-tracker/*
          if-no-files-found: error
