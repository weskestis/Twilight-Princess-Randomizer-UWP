    - name: Archive checked source text and provenance
      shell: powershell
      run: "$ErrorActionPreference = 'Stop'\n$code = @'\nimport hashlib,json,os,zipfile\nfrom pathlib import Path\nroot=Path(os.environ['TPR_SRC'])\n\
        out=Path(os.environ['GITHUB_WORKSPACE'])/'Staged-743-Sources.zip'\nextensions={'.cpp','.hpp','.h','.c','.py','.ps1','.cmake','.yml','.yaml','.json','.wgsl','.rml','.rc'}\n\
        files=[]\nwith zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:\n    for file in sorted(root.rglob('*')):\n\
        \        if not file.is_file():continue\n        rel=file.relative_to(root)\n        if any(p.startswith('.') for\
        \ p in rel.parts):continue\n        if file.name!='CMakeLists.txt' and file.suffix.lower() not in extensions:continue\n\
        \        data=file.read_bytes()\n        z.writestr(rel.as_posix(),data)\n        files.append({'path':rel.as_posix(),'size':len(data),'sha256':hashlib.sha256(data).hexdigest()})\n\
        \    proof={'controlRevision':'8e9f155461208151b4b1e9fb565eba75ab19d1c4','greenRun':38183843368,'snapshotRun':os.environ['GITHUB_RUN_ID'],'files':files}\n\
        \    z.writestr('SOURCE-743-PROVENANCE.json',json.dumps(proof,indent=2))\nassert out.stat().st_size<512*1024**2\n\
        print('Captured',len(files),'staged source files in',out.stat().st_size,'bytes')\n'@\n$code | python -\nif ($LASTEXITCODE\
        \ -ne 0) { throw 'Checked source archive failed.' }\n"
    - name: Upload checked source snapshot
      uses: actions/upload-artifact@v4
      with:
        name: Staged-743-Sources
        path: Staged-743-Sources.zip
        if-no-files-found: error
        retention-days: 3
