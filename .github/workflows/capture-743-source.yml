name: Recover verified Xbox 746 delivery
on:
  push:
    branches: [codex/deliver-746-38323037388]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xbox746-delivery-recovery
  cancel-in-progress: true
jobs:
  recover:
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: _control
      - name: Download the existing verified package
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 11780832662
          run-id: 38323037388
          github-token: ${{ github.token }}
          path: Verified746
          merge-multiple: true
      - name: Verify exact package and recover pinned Essentials source
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE']);package=root/'Verified746'
          metadata=json.loads(subprocess.check_output(['gh','api','repos/weskestis/Twilight-Princess-Randomizer-UWP/actions/artifacts/11780832662']))
          assert metadata['digest']=='sha256:4c5378eae7dac9a69fad7e67c18da1a0809db1d8e83ec6619bb9357d12db51c4'
          msix=package/'TwilightPrincessRandomizer_1.4.1.746_x64.msix'
          with msix.open('rb') as stream:actual=hashlib.file_digest(stream,'sha256').hexdigest()
          assert actual=='aba54315aca1ef7992a7e1eb3ed60bdf8f6dc767e0cf47124225c1262650515b'
          support=package/'Twilight-Princess-Randomizer-UWP-1.4.1.746-Xbox-Support.zip'
          import zipfile
          with zipfile.ZipFile(support) as archive:
              assert archive.testzip() is None
              for name in archive.namelist():
                  assert '/' not in name and '\\' not in name and not name.startswith('.')
                  assert archive.read(name)==(package/name).read_bytes(),name
          manifest=json.loads((package/'SOURCE-MANIFEST-744.json').read_text(encoding='utf-8-sig'))
          assert manifest['package']=='Twilight Princess Randomizer Xbox/UWP 1.4.1.746'
          assert manifest['generatorScenarios']==67
          assert manifest['sourceRevision']=='c5e2603415f1ef5a1be8c8bfb75acb9de6022e01'
          lock=json.loads((root/'_control/NATIVE_MODS-743.json').read_text())
          source=next(m for m in lock['mods'] if m['target']=='port_twilit_essentials')['sourceArchive']
          cache=root/'RecoveredSource/.uwp-native-downloads-743';cache.mkdir(parents=True,exist_ok=True)
          with (cache/source['name']).open('wb') as stream:
              subprocess.run(['gh','api','repos/weskestis/Twilight-Princess-Randomizer-UWP/releases/assets/634903321','-H','Accept: application/octet-stream'],stdout=stream,check=True)
          print('PASS: exact signed MSIX/support bytes and source revision; original package was fully verified in run 38323037388')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Verified package recovery mismatch.' }
          python "$env:GITHUB_WORKSPACE\_control\scripts\prepare-746-delivery.py" "$env:GITHUB_WORKSPACE\Verified746" "$env:GITHUB_WORKSPACE\RecoveredSource" "$env:GITHUB_WORKSPACE\Delivery746"
          if ($LASTEXITCODE -ne 0) { throw 'Transfer/source hash verification failed.' }
      - name: Publish the verified package and write delivery receipt
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GITHUB_RUN_ID = '38323037388'
          $env:GITHUB_SHA = 'c5e2603415f1ef5a1be8c8bfb75acb9de6022e01'
          python "$env:GITHUB_WORKSPACE\_control\scripts\publish-746-draft.py" "$env:GITHUB_WORKSPACE\Verified746" "$env:GITHUB_WORKSPACE\Delivery746\evidence"
          if ($LASTEXITCODE -ne 0) { throw 'Draft asset verification failed.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Xbox746-MSIX-Part-1
          path: Delivery746/part1/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Xbox746-MSIX-Part-2
          path: Delivery746/part2/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Xbox746-MSIX-Part-3
          path: Delivery746/part3/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Xbox746-Delivery-Evidence
          path: Delivery746/evidence/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
