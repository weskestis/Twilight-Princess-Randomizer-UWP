name: Recover verified Xbox 745 delivery
on:
  push:
    branches: [codex/deliver-745-38298493676]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xbox745-delivery-recovery
  cancel-in-progress: true
jobs:
  recover:
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: _control
      - name: Download the existing verified package
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 11770798849
          run-id: 38298493676
          github-token: ${{ github.token }}
          path: Verified745
          merge-multiple: true
      - name: Verify exact package and recover pinned Essentials source
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE']);package=root/'Verified745'
          metadata=json.loads(subprocess.check_output(['gh','api','repos/weskestis/Twilight-Princess-Randomizer-UWP/actions/artifacts/11770798849']))
          assert metadata['digest']=='sha256:8904269da59360bc5b54a62e90eac95286384d4f7f7a89349bf05d154b0a2db1'
          msix=package/'TwilightPrincessRandomizer_1.4.1.745_x64.msix'
          with msix.open('rb') as stream:actual=hashlib.file_digest(stream,'sha256').hexdigest()
          assert actual=='3bce0336b67c9251b520f5216a8bf24bda36ead195970eb9a201653d0a239d78'
          support=package/'Twilight-Princess-Randomizer-UWP-1.4.1.745-Xbox-Support.zip'
          import zipfile
          with zipfile.ZipFile(support) as archive:
              assert archive.testzip() is None
              for name in archive.namelist():
                  assert '/' not in name and '\\' not in name and not name.startswith('.')
                  assert archive.read(name)==(package/name).read_bytes(),name
          manifest=json.loads((package/'SOURCE-MANIFEST-744.json').read_text(encoding='utf-8-sig'))
          assert manifest['package']=='Twilight Princess Randomizer Xbox/UWP 1.4.1.745'
          assert manifest['generatorScenarios']==67
          assert manifest['sourceRevision']=='60ae2dc11e11849bf769a191355a4900cfcb08bf'
          lock=json.loads((root/'_control/NATIVE_MODS-743.json').read_text())
          source=next(m for m in lock['mods'] if m['target']=='port_twilit_essentials')['sourceArchive']
          cache=root/'RecoveredSource/.uwp-native-downloads-743';cache.mkdir(parents=True,exist_ok=True)
          with (cache/source['name']).open('wb') as stream:
              subprocess.run(['gh','api','repos/weskestis/Twilight-Princess-Randomizer-UWP/releases/assets/633790581','-H','Accept: application/octet-stream'],stdout=stream,check=True)
          print('PASS: exact signed MSIX/support bytes and source revision; original package was fully verified in run 38298493676')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Verified package recovery mismatch.' }
          python "$env:GITHUB_WORKSPACE\_control\scripts\prepare-745-delivery.py" "$env:GITHUB_WORKSPACE\Verified745" "$env:GITHUB_WORKSPACE\RecoveredSource" "$env:GITHUB_WORKSPACE\Delivery745"
          if ($LASTEXITCODE -ne 0) { throw 'Transfer/source hash verification failed.' }
      - name: Verify the existing draft assets and write delivery receipt
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GITHUB_RUN_ID = '38298493676'
          $env:GITHUB_SHA = '60ae2dc11e11849bf769a191355a4900cfcb08bf'
          python "$env:GITHUB_WORKSPACE\_control\scripts\publish-745-draft.py" "$env:GITHUB_WORKSPACE\Verified745" "$env:GITHUB_WORKSPACE\Delivery745\evidence" --release-id 410967863
          if ($LASTEXITCODE -ne 0) { throw 'Draft asset verification failed.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Xbox745-MSIX-Part-1
          path: Delivery745/part1/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Xbox745-MSIX-Part-2
          path: Delivery745/part2/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Xbox745-MSIX-Part-3
          path: Delivery745/part3/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Xbox745-Delivery-Evidence
          path: Delivery745/evidence/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
