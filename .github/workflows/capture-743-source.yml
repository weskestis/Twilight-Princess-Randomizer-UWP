name: Recover verified Xbox 744 delivery
on:
  pull_request:
    branches: [codex/xbox-680-from-679]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xbox744-delivery-recovery
  cancel-in-progress: true
jobs:
  recover:
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: _control
      - name: Download the existing verified package
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 11749225621
          run-id: 38245912565
          github-token: ${{ github.token }}
          path: Verified744
          merge-multiple: true
      - name: Verify exact package and recover pinned Essentials source
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE']);package=root/'Verified744'
          expected={'TwilightPrincessRandomizer_1.4.1.744_x64.msix':(1142153655,'5fe5d003a79369e6a48fcebd832f7cdbabba9b77984c8d82a7fa4e97611cbb01'),'Twilight-Princess-Randomizer-UWP-1.4.1.744-Xbox-Support.zip':(985090,'2b26e360f54442a322e93627870f93897b7149ba4f55fecab619649d3148f8fb')}
          for name,(size,digest) in expected.items():
              file=package/name
              with file.open('rb') as stream:actual=hashlib.file_digest(stream,'sha256').hexdigest()
              assert file.stat().st_size==size and actual==digest,name
          manifest=json.loads((package/'SOURCE-MANIFEST-744.json').read_text(encoding='utf-8-sig'))
          assert manifest['sourceRevision']=='766528046227d392481fd8f0b6385961344c219d'
          lock=json.loads((root/'_control/NATIVE_MODS-743.json').read_text())
          source=next(m for m in lock['mods'] if m['target']=='port_twilit_essentials')['sourceArchive']
          cache=root/'RecoveredSource/.uwp-native-downloads-743';cache.mkdir(parents=True,exist_ok=True)
          with (cache/source['name']).open('wb') as stream:
              subprocess.run(['gh','api','repos/weskestis/Twilight-Princess-Randomizer-UWP/releases/assets/633790581','-H','Accept: application/octet-stream'],stdout=stream,check=True)
          print('PASS: exact signed MSIX/support bytes and source revision; original package was fully verified in run 38245912565')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Verified package recovery mismatch.' }
          python "$env:GITHUB_WORKSPACE\_control\scripts\prepare-744-delivery.py" "$env:GITHUB_WORKSPACE\Verified744" "$env:GITHUB_WORKSPACE\RecoveredSource" "$env:GITHUB_WORKSPACE\Delivery744"
          if ($LASTEXITCODE -ne 0) { throw 'Transfer/source hash verification failed.' }
      - name: Verify the existing draft assets and write delivery receipt
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GITHUB_RUN_ID = '38245912565'
          $env:GITHUB_SHA = '766528046227d392481fd8f0b6385961344c219d'
          python "$env:GITHUB_WORKSPACE\_control\scripts\publish-744-draft.py" "$env:GITHUB_WORKSPACE\Verified744" "$env:GITHUB_WORKSPACE\Delivery744\evidence"
          if ($LASTEXITCODE -ne 0) { throw 'Draft asset verification failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: Xbox744-MSIX-Part-1
          path: Delivery744/part1/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Xbox744-MSIX-Part-2
          path: Delivery744/part2/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Xbox744-MSIX-Part-3
          path: Delivery744/part3/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Xbox744-Delivery-Evidence
          path: Delivery744/evidence/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
