name: Capture staged 743 source for 744 fixes
permissions:
  contents: read
concurrency:
  group: capture-743-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  xbox-uwp-x64:
    name: Capture staged source
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
      SCCACHE_IDLE_TIMEOUT: '0'
    steps:
    - name: Check out build controls
      uses: actions/checkout@v4
      with:
        path: _control
        ref: 8e9f155461208151b4b1e9fb565eba75ab19d1c4
    - name: Enable MSVC x64
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    - name: Enable pinned C++ compiler cache
      id: compiler-cache
      continue-on-error: true
      uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c
      with:
        version: v0.16.0
      env:
        SCCACHE_GHA_ENABLED: 'true'
        SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
    - name: Resolve Windows compiler cache executable
      if: steps.compiler-cache.outcome == 'success'
      shell: powershell
      run: "$ErrorActionPreference = 'Stop'\n# The pinned action exports an extensionless path on Windows.\n$cacheExecutable739\
        \ = $env:SCCACHE_PATH\nif ($cacheExecutable739 -and\n    -not (Test-Path $cacheExecutable739 -PathType Leaf) -and\n\
        \    (Test-Path ($cacheExecutable739 + '.exe') -PathType Leaf)) {\n  $cacheExecutable739 += '.exe'\n}\nif (-not $cacheExecutable739\
        \ -or\n    -not (Test-Path $cacheExecutable739 -PathType Leaf)) {\n  Write-Warning 'Compiler cache executable unavailable;\
        \ ordinary compilation remains enabled.'\n  'SCCACHE_PATH=' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append\n\
        \  exit 0\n}\n& $cacheExecutable739 --version\nif ($LASTEXITCODE -ne 0) {\n  Write-Warning 'Installed compiler cache\
        \ could not run; ordinary compilation remains enabled.'\n  'SCCACHE_PATH=' | Out-File -FilePath $env:GITHUB_ENV -Encoding\
        \ utf8 -Append\n  exit 0\n}\n\"SCCACHE_PATH=$cacheExecutable739\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8\
        \ -Append\nWrite-Host \"Resolved Windows compiler cache executable: $cacheExecutable739\"\n"
    - name: Prepare short build paths
      shell: powershell
      run: "$ErrorActionPreference = 'Stop'\ngit config --global core.longpaths true\ngit config --global core.autocrlf false\n\
        if (Test-Path 'S:\\') { subst S: /D | Out-Null }\nsubst S: \"$env:GITHUB_WORKSPACE\"\nNew-Item -ItemType Directory\
        \ -Force S:\\tmp,S:\\b | Out-Null\n\"TPR_CONTROL=S:\\_control\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8\
        \ -Append\n\"TPR_SRC=S:\\s\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append\n\"TPR_UWP_DEP=S:\\u\" |\
        \ Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append\n\"TPR_FEED=S:\\b\\feed\" | Out-File -FilePath $env:GITHUB_ENV\
        \ -Encoding utf8 -Append\n\"TPR_PKG=S:\\b\\package\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append\n\
        \"TPR_MOD_INSPECT=S:\\b\\mod-inspect\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append\n\"TPR_MSIX_INSPECT=S:\\\
        b\\msix-inspect\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append\n\"TMP=S:\\tmp\" | Out-File -FilePath\
        \ $env:GITHUB_ENV -Encoding utf8 -Append\n\"TEMP=S:\\tmp\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append\n\
        if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {\n  choco install ninja -y --no-progress\n}\ncmake --version\n\
        ninja --version\nGet-Command cl | Select-Object -ExpandProperty Source\n"
    - name: Restore hash-verified mod download cache
      id: mod-download-cache
      continue-on-error: true
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: '${{ env.TPR_SRC }}/.uwp-custom-downloads-743/*.zip

          ${{ env.TPR_SRC }}/.uwp-custom-downloads-743/*.rar

          ${{ env.TPR_SRC }}/.uwp-native-downloads-743/*.zip

          ${{ env.TPR_SRC }}/.uwp-native-downloads-743/*.dusk

          ${{ env.TPR_SRC }}/.uwp-mod-downloads-736/*.dusk

          '
        key: xbox-mod-downloads-743-${{ hashFiles('_control/CUSTOM_MODS-743.json', '_control/NATIVE_MODS-743.json', '_control/BUNDLED_MODS-736.json')
          }}
        restore-keys: xbox-mod-downloads-743-
    - name: Fetch exact source and UWP dependency revisions
      shell: powershell
      run: "$ErrorActionPreference = 'Stop'\ngit init \"$env:TPR_SRC\"\ngit -C \"$env:TPR_SRC\" remote add origin https://github.com/TwilitRealm/dusklight.git\n\
        git -C \"$env:TPR_SRC\" fetch --depth 1 origin 422d7bb1b6c8d973cccf8b3d0b226a57ac3cc8c7\ngit -C \"$env:TPR_SRC\" checkout\
        \ --detach FETCH_HEAD\ngit -C \"$env:TPR_SRC\" submodule update --init --recursive --depth 1\ngit -C \"$env:TPR_SRC\\\
        mods\\randomizer\" fetch --depth 1 origin d0ceae8f18bbef4a40287a72a2791a3c06c9aca5\ngit -C \"$env:TPR_SRC\\mods\\\
        randomizer\" checkout --detach FETCH_HEAD\n\ngit init \"$env:TPR_UWP_DEP\"\ngit -C \"$env:TPR_UWP_DEP\" remote add\
        \ origin https://github.com/SternXD/uwp-dep.git\ngit -C \"$env:TPR_UWP_DEP\" fetch --depth 1 origin 810cdcb672383045a8b03d1d55bb535352d7d46f\n\
        git -C \"$env:TPR_UWP_DEP\" checkout --detach FETCH_HEAD\n\n$pins = @{\n  \"$env:TPR_SRC\" = '422d7bb1b6c8d973cccf8b3d0b226a57ac3cc8c7'\n\
        \  \"$env:TPR_SRC\\extern\\aurora\" = 'd0933b745abe0eb9815bedcea8047575da18698d'\n  \"$env:TPR_SRC\\extern\\borealis\"\
        \ = '0bdba6c50a46409c4862474c72b4a3a631fbe0ec'\n  \"$env:TPR_SRC\\mods\\randomizer\" = 'd0ceae8f18bbef4a40287a72a2791a3c06c9aca5'\n\
        \  \"$env:TPR_SRC\\mods\\cosmetics\" = 'fd93491089fa95441789244f2b2fd22a451ecbcc'\n  \"$env:TPR_UWP_DEP\" = '810cdcb672383045a8b03d1d55bb535352d7d46f'\n\
        }\nforeach ($entry in $pins.GetEnumerator()) {\n  $actual = (git -C $entry.Key rev-parse HEAD).Trim()\n  if ($actual\
        \ -ne $entry.Value) {\n    throw \"Revision mismatch for $($entry.Key): expected $($entry.Value), got $actual\"\n\
        \  }\n}\n\n# Pin the current Dusklight UWP dependency set. This pairs Aurora's\n# expected Dawn revision with an SDL\
        \ build that uses the Store CRT.\n$sdl = \"$env:TPR_UWP_DEP\\x64\\bin\\SDL3.dll\"\n$dawn = \"$env:TPR_UWP_DEP\\x64\\\
        bin\\webgpu_dawn.dll\"\n$expectedSdlHash = 'f288fd682ea19fa82bf9bbbfefab4132853555ad6dfe37cbe9f9c55acff4bf06'\n$expectedDawnHash\
        \ = 'd1126d70c0eee87d69b802d10527d3dc301fce7514a206112ed4056cbf5b6910'\n$actualSdlHash = (Get-FileHash $sdl -Algorithm\
        \ SHA256).Hash.ToLowerInvariant()\n$actualDawnHash = (Get-FileHash $dawn -Algorithm SHA256).Hash.ToLowerInvariant()\n\
        if ($actualSdlHash -ne $expectedSdlHash) {\n  throw \"Pinned UWP SDL3 hash mismatch: $actualSdlHash\"\n}\nif ($actualDawnHash\
        \ -ne $expectedDawnHash) {\n  throw \"Pinned UWP Dawn hash mismatch: $actualDawnHash\"\n}\n$expectedImportHashes =\
        \ @{\n  'SDL3.lib' = '474423aa48a7760a236b8394b82559cfa37c5e33c430029c328a09496c0e4f7b'\n  'webgpu_dawn.lib' = '051ce8d5ee93e7de14c482da735be0dd41dddf51fc8acb14221c468a14d49a99'\n\
        }\nforeach ($entry in $expectedImportHashes.GetEnumerator()) {\n  $actual = (Get-FileHash \"$env:TPR_UWP_DEP\\x64\\\
        lib\\$($entry.Key)\" `\n    -Algorithm SHA256).Hash.ToLowerInvariant()\n  if ($actual -ne $entry.Value) {\n    throw\
        \ \"Pinned UWP import library hash mismatch for $($entry.Key): $actual\"\n  }\n}\n$sdlBytes = [IO.File]::ReadAllBytes($sdl)\n\
        $peOffset = [BitConverter]::ToInt32($sdlBytes, 0x3c)\nif ([BitConverter]::ToUInt32($sdlBytes, $peOffset) -ne 0x00004550)\
        \ {\n  throw 'Pinned SDL3.dll has no valid PE signature.'\n}\n$sdlImports = & dumpbin /nologo /imports $sdl | Out-String\n\
        foreach ($desktopCrt in @('MSVCP140.dll','VCRUNTIME140.dll','VCRUNTIME140_1.dll','vccorlib140.dll')) {\n  if ($sdlImports\
        \ -match \"(?im)^\\s*$([regex]::Escape($desktopCrt))\\s*$\") {\n    throw \"Pinned SDL3.dll imports unavailable desktop\
        \ CRT: $desktopCrt\"\n  }\n}\nforeach ($appCrt in @('MSVCP140_APP.dll','VCRUNTIME140_APP.dll','VCRUNTIME140_1_APP.dll','vccorlib140_app.dll'))\
        \ {\n  if ($sdlImports -notmatch \"(?im)^\\s*$([regex]::Escape($appCrt))\\s*$\") {\n    throw \"Pinned SDL3.dll is\
        \ missing UWP CRT import: $appCrt\"\n  }\n}\n"
    - name: Apply reviewed source layers and advance 743 identity
      shell: powershell
      env:
        GH_TOKEN: ${{ github.token }}
      run: "$ErrorActionPreference = 'Stop'\nfunction Expand-ControlPatch {\n  param(\n    [string]$Stem,\n    [string]$EncodedHash,\n\
        \    [string]$GzipHash,\n    [string]$PatchHash\n  )\n  $parts = @(Get-ChildItem \"$env:TPR_CONTROL\\patches\\$Stem.patch.gz.b64.part*\"\
        \ -File |\n    Sort-Object Name)\n  if ($parts.Count -lt 1) { throw \"No encoded parts found for $Stem\" }\n  if ($parts.Count\
        \ -eq 1) {\n    $normalizedEncoded = (Get-Content $parts[0].FullName -Raw) -replace \"`r`n\", \"`n\"\n    $hasher\
        \ = [Security.Cryptography.SHA256]::Create()\n    try {\n      $digest = $hasher.ComputeHash([Text.Encoding]::UTF8.GetBytes($normalizedEncoded))\n\
        \      $actualEncodedHash = ([BitConverter]::ToString($digest) -replace '-', '').ToLowerInvariant()\n    }\n    finally\
        \ { $hasher.Dispose() }\n    if ($actualEncodedHash -ne $EncodedHash) {\n      throw \"$Stem encoded SHA-256 mismatch:\
        \ $actualEncodedHash\"\n    }\n  }\n  $encoded = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join\
        \ ''\n  $gzipPath = Join-Path $env:RUNNER_TEMP \"$Stem.patch.gz\"\n  [IO.File]::WriteAllBytes($gzipPath, [Convert]::FromBase64String($encoded))\n\
        \  $actualGzipHash = (Get-FileHash $gzipPath -Algorithm SHA256).Hash.ToLowerInvariant()\n  if ($actualGzipHash -ne\
        \ $GzipHash) {\n    throw \"$Stem gzip SHA-256 mismatch: $actualGzipHash\"\n  }\n  $patchPath = Join-Path $env:RUNNER_TEMP\
        \ \"$Stem.patch\"\n  $input = [IO.File]::OpenRead($gzipPath)\n  try {\n    $decoder = [IO.Compression.GZipStream]::new(\n\
        \      $input, [IO.Compression.CompressionMode]::Decompress)\n    try {\n      $output = [IO.File]::Create($patchPath)\n\
        \      try { $decoder.CopyTo($output) }\n      finally { $output.Dispose() }\n    }\n    finally { $decoder.Dispose()\
        \ }\n  }\n  finally { $input.Dispose() }\n  $actualPatchHash = (Get-FileHash $patchPath -Algorithm SHA256).Hash.ToLowerInvariant()\n\
        \  if ($actualPatchHash -ne $PatchHash) {\n    throw \"$Stem decoded SHA-256 mismatch: $actualPatchHash\"\n  }\n \
        \ return $patchPath\n}\n\n$duskPatch = Expand-ControlPatch `\n  'dusklight201-uwp-662' `\n  '82302f5d940161c1458950a3352bc71048f379a2a39b884d2eddbce227c415bc'\
        \ `\n  '095f123e3469f636f7491f6e6b092e8a0bf097a926a9b34ae736382e159fc123' `\n  '7ea1bb82f45f54c333f682639250986930628cab71d2353d58cf9688b243f393'\n\
        $auroraPatch = Expand-ControlPatch `\n  'aurora-uwp-662' `\n  '99424654b2a37f8f3ec5f1d6b878864d5a20f09786e440beaecf187a623626c2'\
        \ `\n  '2edc6756bde2af85832970d9b5223b4918eb1d2f9387d653a86e9ba43292fc31' `\n  '24173d1d5328aed26ec73756d644e670420d271269dc0553ca57b90a643e22dc'\n\
        $randomizerPatch = Expand-ControlPatch `\n  'randomizer-662-checkpoint' `\n  '1d89f69d1cc7cb04e2f1b0efed2e06749b4704d82d790920cafdb69992e22198'\
        \ `\n  '6d269e542e5472021eb413131cb5e150739a856a4843b18c9fade4a7ddbd06cf' `\n  'a7d7986b7c33cbf025e3290fd75074dc5d59ab1cf014aea952d3ecf439b6c4cc'\n\
        $moduleUwpPatchSource = \"$env:TPR_CONTROL\\patches\\xbox-appcontainer-module-663.patch\"\n$moduleUwpPatchText = [IO.File]::ReadAllText($moduleUwpPatchSource).Replace(\"\
        `r`n\", \"`n\")\n$hasher = [Security.Cryptography.SHA256]::Create()\ntry {\n  $moduleUwpPatchDigest = $hasher.ComputeHash(\n\
        \    [Text.Encoding]::UTF8.GetBytes($moduleUwpPatchText))\n  $moduleUwpPatchHash = ([BitConverter]::ToString($moduleUwpPatchDigest)\
        \ -replace '-', '').ToLowerInvariant()\n}\nfinally { $hasher.Dispose() }\nif ($moduleUwpPatchHash -ne '835512c284d2ff687fc352afb7b7d1236b2c57dcbed39583217ee70f27c892c7')\
        \ {\n  throw \"Xbox AppContainer module patch SHA-256 mismatch: $moduleUwpPatchHash\"\n}\n$moduleUwpPatch = Join-Path\
        \ $env:RUNNER_TEMP 'xbox-appcontainer-module-663.patch'\n[IO.File]::WriteAllText(\n  $moduleUwpPatch, $moduleUwpPatchText,\
        \ [Text.UTF8Encoding]::new($false))\n\n$packagedModPatchSource = \"$env:TPR_CONTROL\\patches\\xbox-packaged-randomizer-664.patch\"\
        \n$packagedModPatchText = [IO.File]::ReadAllText($packagedModPatchSource).Replace(\"`r`n\", \"`n\")\n$hasher = [Security.Cryptography.SHA256]::Create()\n\
        try {\n  $packagedModPatchDigest = $hasher.ComputeHash(\n    [Text.Encoding]::UTF8.GetBytes($packagedModPatchText))\n\
        \  $packagedModPatchHash = ([BitConverter]::ToString($packagedModPatchDigest) -replace '-', '').ToLowerInvariant()\n\
        }\nfinally { $hasher.Dispose() }\nif ($packagedModPatchHash -ne '4869f13d36b8e2fe2c335ed477f7381ef4fbd483474434d1b3cc60ee078198cc')\
        \ {\n  throw \"Xbox packaged Randomizer patch SHA-256 mismatch: $packagedModPatchHash\"\n}\n$packagedModPatch = Join-Path\
        \ $env:RUNNER_TEMP 'xbox-packaged-randomizer-664.patch'\n[IO.File]::WriteAllText(\n  $packagedModPatch, $packagedModPatchText,\
        \ [Text.UTF8Encoding]::new($false))\n\n$startupGuardPatchSource = \"$env:TPR_CONTROL\\patches\\xbox-startup-guard-665.patch\"\
        \n$startupGuardPatchText = [IO.File]::ReadAllText($startupGuardPatchSource).Replace(\"`r`n\", \"`n\")\n$hasher = [Security.Cryptography.SHA256]::Create()\n\
        try {\n  $startupGuardPatchDigest = $hasher.ComputeHash(\n    [Text.Encoding]::UTF8.GetBytes($startupGuardPatchText))\n\
        \  $startupGuardPatchHash = ([BitConverter]::ToString($startupGuardPatchDigest) -replace '-', '').ToLowerInvariant()\n\
        }\nfinally { $hasher.Dispose() }\nif ($startupGuardPatchHash -ne 'd1e1603a607c007244f5a35285d507ebf1d5ec8476cc5cd040be9c24e7c84713')\
        \ {\n  throw \"Xbox startup guard patch SHA-256 mismatch: $startupGuardPatchHash\"\n}\n$startupGuardPatch = Join-Path\
        \ $env:RUNNER_TEMP 'xbox-startup-guard-665.patch'\n[IO.File]::WriteAllText(\n  $startupGuardPatch, $startupGuardPatchText,\
        \ [Text.UTF8Encoding]::new($false))\n\n$threadAffinityPatchSource = \"$env:TPR_CONTROL\\patches\\xbox-uwp-thread-affinity-666.patch\"\
        \n$threadAffinityPatchText = [IO.File]::ReadAllText($threadAffinityPatchSource).Replace(\"`r`n\", \"`n\")\n$hasher\
        \ = [Security.Cryptography.SHA256]::Create()\ntry {\n  $threadAffinityPatchDigest = $hasher.ComputeHash(\n    [Text.Encoding]::UTF8.GetBytes($threadAffinityPatchText))\n\
        \  $threadAffinityPatchHash = ([BitConverter]::ToString($threadAffinityPatchDigest) -replace '-', '').ToLowerInvariant()\n\
        }\nfinally { $hasher.Dispose() }\nif ($threadAffinityPatchHash -ne '9b864a38ab17d1b3e6563c1c29a292966784639781239e48791482c64db7531f')\
        \ {\n  throw \"Xbox UWP thread-affinity patch SHA-256 mismatch: $threadAffinityPatchHash\"\n}\n$threadAffinityPatch\
        \ = Join-Path $env:RUNNER_TEMP 'xbox-uwp-thread-affinity-666.patch'\n[IO.File]::WriteAllText(\n  $threadAffinityPatch,\
        \ $threadAffinityPatchText, [Text.UTF8Encoding]::new($false))\n\n$dawnCacheApiPatchSource = \"$env:TPR_CONTROL\\patches\\\
        aurora-dawn-cache-api-668.patch\"\n$dawnCacheApiPatchText = [IO.File]::ReadAllText($dawnCacheApiPatchSource).Replace(\"\
        `r`n\", \"`n\")\n$hasher = [Security.Cryptography.SHA256]::Create()\ntry {\n  $dawnCacheApiPatchDigest = $hasher.ComputeHash(\n\
        \    [Text.Encoding]::UTF8.GetBytes($dawnCacheApiPatchText))\n  $dawnCacheApiPatchHash = ([BitConverter]::ToString(\n\
        \    $dawnCacheApiPatchDigest) -replace '-', '').ToLowerInvariant()\n}\nfinally { $hasher.Dispose() }\nif ($dawnCacheApiPatchHash\
        \ -ne '6b7ad75131e815f3e5e1ea54c89c40cc853f4ab1ed0ec22ae7386994fb357e7f') {\n  throw \"Aurora Dawn cache API patch\
        \ SHA-256 mismatch: $dawnCacheApiPatchHash\"\n}\n$dawnCacheApiPatch = Join-Path $env:RUNNER_TEMP 'aurora-dawn-cache-api-668.patch'\n\
        [IO.File]::WriteAllText(\n  $dawnCacheApiPatch, $dawnCacheApiPatchText, [Text.UTF8Encoding]::new($false))\n\n$funchookModuleBasePatchSource\
        \ = \"$env:TPR_CONTROL\\patches\\xbox-uwp-funchook-module-base-667.patch\"\n$funchookModuleBasePatchText = [IO.File]::ReadAllText($funchookModuleBasePatchSource).Replace(\"\
        `r`n\", \"`n\")\n$hasher = [Security.Cryptography.SHA256]::Create()\ntry {\n  $funchookModuleBasePatchDigest = $hasher.ComputeHash(\n\
        \    [Text.Encoding]::UTF8.GetBytes($funchookModuleBasePatchText))\n  $funchookModuleBasePatchHash = ([BitConverter]::ToString($funchookModuleBasePatchDigest)\
        \ -replace '-', '').ToLowerInvariant()\n}\nfinally { $hasher.Dispose() }\nif ($funchookModuleBasePatchHash -ne 'f61ee177fedaaced7024d21c481a5b35c3fb3ea1b08f7dd9b40c47ab796cea5e')\
        \ {\n  throw \"Xbox UWP Funchook module-base patch SHA-256 mismatch: $funchookModuleBasePatchHash\"\n}\n$funchookModuleBasePatch\
        \ = Join-Path $env:RUNNER_TEMP 'xbox-uwp-funchook-module-base-667.patch'\n[IO.File]::WriteAllText(\n  $funchookModuleBasePatch,\n\
        \  $funchookModuleBasePatchText,\n  [Text.UTF8Encoding]::new($false))\n\n$staticRandomizerPatchSource = \"$env:TPR_CONTROL\\\
        patches\\xbox-static-randomizer-668.patch\"\n$staticRandomizerPatchText = [IO.File]::ReadAllText(\n  $staticRandomizerPatchSource).Replace(\"\
        `r`n\", \"`n\")\n$hasher = [Security.Cryptography.SHA256]::Create()\ntry {\n  $staticRandomizerPatchDigest = $hasher.ComputeHash(\n\
        \    [Text.Encoding]::UTF8.GetBytes($staticRandomizerPatchText))\n  $staticRandomizerPatchHash = ([BitConverter]::ToString(\n\
        \    $staticRandomizerPatchDigest) -replace '-', '').ToLowerInvariant()\n}\nfinally { $hasher.Dispose() }\nif ($staticRandomizerPatchHash\
        \ -ne 'b63fee8c7b24ef1fd0a8b3210add426f051ca418b89f0ff1a9d218076af5e6b3') {\n  throw \"Xbox static Randomizer patch\
        \ SHA-256 mismatch: $staticRandomizerPatchHash\"\n}\n$staticRandomizerPatch = Join-Path $env:RUNNER_TEMP 'xbox-static-randomizer-668.patch'\n\
        [IO.File]::WriteAllText(\n  $staticRandomizerPatch,\n  $staticRandomizerPatchText,\n  [Text.UTF8Encoding]::new($false))\n\
        \n$recoveryLifecyclePatchSource = \"$env:TPR_CONTROL\\patches\\xbox-recovery-lifecycle-669.patch\"\n$recoveryLifecyclePatchText\
        \ = [IO.File]::ReadAllText(\n  $recoveryLifecyclePatchSource).Replace(\"`r`n\", \"`n\")\n$hasher = [Security.Cryptography.SHA256]::Create()\n\
        try {\n  $recoveryLifecyclePatchDigest = $hasher.ComputeHash(\n    [Text.Encoding]::UTF8.GetBytes($recoveryLifecyclePatchText))\n\
        \  $recoveryLifecyclePatchHash = ([BitConverter]::ToString(\n    $recoveryLifecyclePatchDigest) -replace '-', '').ToLowerInvariant()\n\
        }\nfinally { $hasher.Dispose() }\nif ($recoveryLifecyclePatchHash -ne '814a266523f90ac0d7545eff771f0823b1c723697fcf7bf5373f856bc1e48a0a')\
        \ {\n  throw \"Xbox recovery/lifecycle patch SHA-256 mismatch: $recoveryLifecyclePatchHash\"\n}\n$recoveryLifecyclePatch\
        \ = Join-Path $env:RUNNER_TEMP 'xbox-recovery-lifecycle-669.patch'\n[IO.File]::WriteAllText(\n  $recoveryLifecyclePatch,\n\
        \  $recoveryLifecyclePatchText,\n  [Text.UTF8Encoding]::new($false))\n\n$lifecycleQuarantinePatchSource = \"$env:TPR_CONTROL\\\
        patches\\xbox-lifecycle-quarantine-670.patch\"\n$lifecycleQuarantinePatchText = [IO.File]::ReadAllText(\n  $lifecycleQuarantinePatchSource).Replace(\"\
        `r`n\", \"`n\")\n$hasher = [Security.Cryptography.SHA256]::Create()\ntry {\n  $lifecycleQuarantinePatchDigest = $hasher.ComputeHash(\n\
        \    [Text.Encoding]::UTF8.GetBytes($lifecycleQuarantinePatchText))\n  $lifecycleQuarantinePatchHash = ([BitConverter]::ToString(\n\
        \    $lifecycleQuarantinePatchDigest) -replace '-', '').ToLowerInvariant()\n}\nfinally { $hasher.Dispose() }\nif ($lifecycleQuarantinePatchHash\
        \ -ne 'a85624ab23e58ece31c03af9c886907337aad6c2379330e3f175a303156a41a6') {\n  throw \"Xbox lifecycle quarantine patch\
        \ SHA-256 mismatch: $lifecycleQuarantinePatchHash\"\n}\n$lifecycleQuarantinePatch = Join-Path $env:RUNNER_TEMP 'xbox-lifecycle-quarantine-670.patch'\n\
        [IO.File]::WriteAllText(\n  $lifecycleQuarantinePatch,\n  $lifecycleQuarantinePatchText,\n  [Text.UTF8Encoding]::new($false))\n\
        \n$firstFramePatchSource = \"$env:TPR_CONTROL\\patches\\xbox-first-frame-defer-671.patch\"\n$firstFramePatchText =\
