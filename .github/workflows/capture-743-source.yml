name: Capture cached mod inputs for 744
on:
  pull_request:
    branches: [codex/xbox-680-from-679]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cached-inputs:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/xbox-680-from-679
          path: _control
      - name: Prepare input paths
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'S:\') { subst S: /D | Out-Null }
          subst S: "$env:GITHUB_WORKSPACE"
          "TPR_SRC=S:\s" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Restore already verified mod inputs
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ env.TPR_SRC }}/.uwp-custom-downloads-743/*.zip
            ${{ env.TPR_SRC }}/.uwp-custom-downloads-743/*.rar
            ${{ env.TPR_SRC }}/.uwp-native-downloads-743/*.zip
            ${{ env.TPR_SRC }}/.uwp-native-downloads-743/*.dusk
            ${{ env.TPR_SRC }}/.uwp-mod-downloads-736/*.dusk
          key: xbox-mod-downloads-743-${{ hashFiles('_control/CUSTOM_MODS-743.json', '_control/NATIVE_MODS-743.json', '_control/BUNDLED_MODS-736.json') }}
          restore-keys: xbox-mod-downloads-743-
      - name: Verify and collect requested inputs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "$env:GITHUB_WORKSPACE\Mod-Inputs-744"
          New-Item -ItemType Directory -Force $out | Out-Null
          $expected = @{
            'dev.remiafterdark.coop_mod.dusk' = '6967db851bd9575eb8ec3bd2439b5d908fc26353343da03eb5346d637c62591a'
            'com.blueflaregames.zora_swim.dusk' = 'dc3ced805a85a9d657937e2a802c944138cbb98e5cca883d09161bc0db455140'
            'com.dusklight.twilit_essentials.zip' = '9d70b091a2ec88c0959c5e0f241acb02279326fa97e4d7db49035e18c3d7ad23'
          }
          foreach ($name in $expected.Keys) {
            $file = Get-ChildItem "$env:TPR_SRC" -Recurse -File -Filter $name | Select-Object -First 1
            if (-not $file) { throw "Requested cached input missing: $name" }
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $expected[$name]) { throw "Cached input hash mismatch: $name" }
            Copy-Item $file.FullName (Join-Path $out $name)
            Write-Host "$name $hash"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Mod-Inputs-744
          path: Mod-Inputs-744/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
