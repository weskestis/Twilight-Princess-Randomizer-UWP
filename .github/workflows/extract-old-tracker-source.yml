name: Extract legacy tracker source

on:
  push:
    branches:
      - codex/tracker-source-extract
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Download and assemble old tracker source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/weskestis/Twilight-Princess-Randomizer-UWP/releases/download/tpr-cp20-source/Twilight-Princess-Randomizer-UWP-Working-627-Seed-Safety-Colors-Hotfix-4.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'old-source.zip'
          $src = Join-Path $env:RUNNER_TEMP 'old-control'
          $assembled = Join-Path $env:RUNNER_TEMP 'assembled'
          $out = Join-Path $env:GITHUB_WORKSPACE 'legacy-tracker-source'
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $src -Force
          $control = Join-Path $src 'Twilight-Princess-Randomizer-UWP'
          if (-not (Test-Path (Join-Path $control 'scripts\assemble_port.py'))) {
            throw 'Legacy source assembler is missing.'
          }
          python (Join-Path $control 'scripts\assemble_port.py') --output $assembled
          if ($LASTEXITCODE -ne 0) {
            throw 'Legacy source assembly failed.'
          }
          New-Item -ItemType Directory -Force $out | Out-Null
          $wanted = @(
            'src\dusk\imgui\ImGuiMenuRandomizer.cpp',
            'src\dusk\imgui\ImGuiMenuRandomizer.hpp',
            'src\dusk\randomizer\game\randomizer_context.hpp',
            'src\dusk\settings.cpp',
            'src\dusk\settings.h',
            'src\dusk\ui\rando_config.cpp',
            'src\dusk\ui\input.cpp'
          )
          foreach ($relative in $wanted) {
            $source = Join-Path $assembled $relative
            if (Test-Path $source) {
              $safe = ($relative -replace '[:\\/]', '__')
              Copy-Item $source (Join-Path $out $safe) -Force
            }
          }
          Get-ChildItem $out | Select-Object Name,Length | Format-Table -AutoSize
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-tracker-source
          path: legacy-tracker-source/*
          if-no-files-found: error
