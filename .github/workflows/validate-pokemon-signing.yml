name: Verify private preview packaging format on Windows
on:
  push:
    branches: [codex/pokemon-signing-proof]
permissions:
  contents: read
jobs:
  signature-format:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Trust the fixture certificate in the disposable runner
        timeout-minutes: 1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Certificate -FilePath tests/fixtures/msix-signing/probe.cer -CertStoreLocation 'Cert:\LocalMachine\Root' | Out-Null
      - name: Verify package signature with Microsoft SignTool
        timeout-minutes: 2
        shell: powershell
        run: |
          signtool verify /pa /v tests/fixtures/msix-signing/probe.msix
          if ($LASTEXITCODE -ne 0) { throw 'Microsoft signature verification rejected the package.' }
      - name: Extract with the Windows SDK
        timeout-minutes: 2
        shell: powershell
        run: |
          makeappx unpack /p tests/fixtures/msix-signing/probe.msix /d probe-unpacked /o
          if ($LASTEXITCODE -ne 0) { throw 'Windows SDK extraction failed.' }
      - name: Verify catalog signature with Microsoft SignTool
        timeout-minutes: 2
        shell: powershell
        run: |
          signtool verify /pa /v probe-unpacked/AppxMetadata/CodeIntegrity.cat
          if ($LASTEXITCODE -ne 0) { throw 'Microsoft signature verification rejected the code catalog.' }
      - name: Check every installed payload and literal resource filename
        run: python tests/verify-pokemon-signing-probe.py
