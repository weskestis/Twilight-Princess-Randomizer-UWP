            subst S: /D
          }

      - name: Upload verified .643 test artifact
        id: artifact_handoff
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Twilight-Princess-Randomizer-UWP-1.4.1.643-Private-Test
          path: TPR-Xbox-Package/
          if-no-files-found: error
          retention-days: 14

