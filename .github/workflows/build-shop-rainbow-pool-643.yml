          if ($patchHash -ne 'af94546744cc3e8b189744c40b58cf953cecb745bff123734ee5728c16a115da') {
            throw "Decoded .643 patch SHA-256 mismatch: $patchHash"
          }

          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
