name: Inspect Input Viewer and Sword Logic 640

on:
  push:
    branches:
      - codex/input-viewer-inspection
  workflow_dispatch:

permissions:
  contents: write

jobs:
  xbox-uwp-x64:
    name: Xbox UWP x64 test package
    runs-on: windows-2022
    timeout-minutes: 240

    steps:
      - name: Check out private build controls
        uses: actions/checkout@v4
        with:
          path: _control

      - name: Load verified working .627/.634 source
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archiveName = 'Twilight-Princess-Randomizer-UWP-Working-627-Seed-Safety-Colors-Hotfix-4.zip'
          $expectedHash = 'b7d66ba41863a1207cbdd8266f3df8657f837cae9b814e59cbbf716d8b42a1c2'
          $downloadDir = Join-Path $env:RUNNER_TEMP 'tpr-working627-seedfix-download'
          $extractDir = Join-Path $env:RUNNER_TEMP 'tpr-working627-seedfix-extract'
          New-Item -ItemType Directory -Force $downloadDir,$extractDir | Out-Null

          gh release download tpr-cp20-source `
            --repo "$env:GITHUB_REPOSITORY" `
            --pattern $archiveName `
            --dir $downloadDir
          if ($LASTEXITCODE -ne 0) {
            throw "Could not download $archiveName from release tpr-cp20-source."
          }

          $archive = Join-Path $downloadDir $archiveName
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "Release tpr-cp20-source is missing $archiveName."
          }

          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Working .627/.634 source SHA-256 mismatch: expected $expectedHash; got $actualHash."
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $extractDir -Force
          $sourceRoot = Join-Path $extractDir 'Twilight-Princess-Randomizer-UWP'
          if (-not (Test-Path -LiteralPath (Join-Path $sourceRoot 'scripts\assemble_port.py'))) {
            throw 'Source archive root or assembler is invalid.'
          }

          Get-ChildItem -LiteralPath $sourceRoot -Force |
            Copy-Item -Destination $env:GITHUB_WORKSPACE -Recurse -Force
          Write-Host "Verified and loaded working .627/.634 source: $actualHash"

      - name: Enable long Git paths
        shell: powershell
        run: git config --global core.longpaths true

      - name: Enable MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Create short Windows build root
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'S:\') {
            subst S: /D 2>$null
          }
          subst S: "$env:GITHUB_WORKSPACE"
          New-Item -ItemType Directory -Force 'S:\tmp' | Out-Null
          "TPR_SRC=S:\s" >> $env:GITHUB_ENV
          "TPR_FEED=S:\b\f" >> $env:GITHUB_ENV
          "TPR_PKG=S:\b\p" >> $env:GITHUB_ENV
          "TMP=S:\tmp" >> $env:GITHUB_ENV
          "TEMP=S:\tmp" >> $env:GITHUB_ENV

      - name: Verify exact .634 baseline controls
        shell: powershell
        run: python scripts/verify_static.py

      - name: Assemble pinned working .627 runtime source
        shell: powershell
        run: python scripts/assemble_port.py --output "$env:TPR_SRC"

      - name: Verify assembled .634 baseline before patching
        shell: powershell
        run: python scripts/verify_static.py "$env:TPR_SRC"

      - name: Stage exact .634 patch context
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostics = Join-Path $env:GITHUB_WORKSPACE 'TPR-Patch-Diagnostics'
          New-Item -ItemType Directory -Force $diagnostics | Out-Null
          $paths = @(
            'src/dusk/cosmetics/texture_utils.cpp',
            'src/dusk/imgui/ImGuiMenuRandomizer.cpp',
            'src/dusk/randomizer/game/randomizer_context.cpp',
            'src/dusk/randomizer/game/tools.cpp',
            'src/dusk/randomizer/generator/data/settings_list.yaml'
          )
          foreach ($relative in $paths) {
            $source = Join-Path $env:TPR_SRC $relative
            $name = $relative.Replace('/', '__')
            Copy-Item -LiteralPath $source -Destination (Join-Path $diagnostics $name) -Force
          }
          Push-Location $env:TPR_SRC
          try {
            git rev-parse HEAD | Set-Content (Join-Path $diagnostics 'assembled-head.txt') -Encoding ASCII
          }
          finally {
            Pop-Location
          }

      - name: Apply reviewed .636 feature patch
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = @(Get-ChildItem `
            "$env:GITHUB_WORKSPACE\_control\patches\dungeon-boss-shops-636.patch.gz.b64.part*" `
            -File | Sort-Object Name)
          if ($parts.Count -ne 4) {
            throw "Expected four .636 patch chunks; found $($parts.Count)."
          }

          $encoded = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $gzipPath = Join-Path $env:RUNNER_TEMP 'dungeon-boss-shops-636.patch.gz'
          [IO.File]::WriteAllBytes($gzipPath, [Convert]::FromBase64String($encoded))
          $gzipHash = (Get-FileHash -LiteralPath $gzipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($gzipHash -ne 'd2f3cf64cb18a1f4d9dcaade7080c6b1646c6b7cb9172f3a4b616f01ec4e8154') {
            throw "Compressed .636 patch SHA-256 mismatch: $gzipHash"
          }

          $patch = Join-Path $env:RUNNER_TEMP 'dungeon-boss-shops-636.patch'
          $gzip = [IO.File]::OpenRead($gzipPath)
          try {
            $decoder = [IO.Compression.GZipStream]::new(
              $gzip, [IO.Compression.CompressionMode]::Decompress)
            try {
              $output = [IO.File]::Create($patch)
              try { $decoder.CopyTo($output) }
              finally { $output.Dispose() }
            }
            finally { $decoder.Dispose() }
          }
          finally { $gzip.Dispose() }

          $patchHash = (Get-FileHash -LiteralPath $patch -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($patchHash -ne 'b90f078e91b8a12b04ce19480ad9a6ee9d43366c3e514957d28b473244d2f932') {
            throw "Decoded .636 patch SHA-256 mismatch: $patchHash"
          }

          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $patchText = [IO.File]::ReadAllText($patch).Replace("`r`n", "`n")
          [IO.File]::WriteAllText($patch, $patchText, $utf8NoBom)

          $pathMatches = [regex]::Matches($patchText, '(?m)^diff --git a/(.+?) b/(.+?)$')
          foreach ($match in $pathMatches) {
            $relative = $match.Groups[2].Value
            $path = Join-Path $env:TPR_SRC $relative
            if (Test-Path -LiteralPath $path -PathType Leaf) {
              $text = [IO.File]::ReadAllText($path)
              [IO.File]::WriteAllText($path, $text.Replace("`r`n", "`n"), $utf8NoBom)
            }
          }

          Push-Location "$env:TPR_SRC"
          try {
            $checkOutput = git apply --check $patch 2>&1
            $checkExit = $LASTEXITCODE
            $checkOutput | ForEach-Object { Write-Host $_ }
            if ($checkExit -ne 0) {
              $diagnostics = Join-Path $env:GITHUB_WORKSPACE 'TPR-Patch-Diagnostics'
              New-Item -ItemType Directory -Force $diagnostics | Out-Null
              $checkOutput | Set-Content (Join-Path $diagnostics 'git-apply-check.txt') -Encoding UTF8
              $paths = @(
                'src/dusk/cosmetics/texture_utils.cpp',
                'src/dusk/imgui/ImGuiMenuRandomizer.cpp',
                'src/dusk/randomizer/game/randomizer_context.cpp',
                'src/dusk/randomizer/game/tools.cpp',
                'src/dusk/randomizer/generator/data/settings_list.yaml'
              )
              foreach ($relative in $paths) {
                $source = Join-Path $env:TPR_SRC $relative
                $name = $relative.Replace('/', '__')
                Copy-Item -LiteralPath $source -Destination (Join-Path $diagnostics $name) -Force
              }
              git rev-parse HEAD | Set-Content (Join-Path $diagnostics 'assembled-head.txt') -Encoding ASCII
              throw 'Feature patch does not match the verified .634 baseline.'
            }
            git apply $patch
            if ($LASTEXITCODE -ne 0) { throw 'Feature patch could not be applied.' }
          }
          finally {
            Pop-Location
          }

      - name: Apply reviewed .637 enemy-defeat logic patch
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = @(Get-ChildItem `
            "$env:GITHUB_WORKSPACE\_control\patches\enemy-defeat-logic-637.patch.gz.b64.part*" `
            -File | Sort-Object Name)
          if ($parts.Count -ne 1) {
            throw "Expected one .637 patch chunk; found $($parts.Count)."
          }

          $encoded = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $gzipPath = Join-Path $env:RUNNER_TEMP 'enemy-defeat-logic-637.patch.gz'
          [IO.File]::WriteAllBytes($gzipPath, [Convert]::FromBase64String($encoded))
          $gzipHash = (Get-FileHash -LiteralPath $gzipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($gzipHash -ne '950f43a6ff3d5c167a278ab91c6d163acebcbad10e93a7ad6b575ed6ceb2ffdb') {
            throw "Compressed .637 patch SHA-256 mismatch: $gzipHash"
          }

          $patch = Join-Path $env:RUNNER_TEMP 'enemy-defeat-logic-637.patch'
          $gzip = [IO.File]::OpenRead($gzipPath)
          try {
            $decoder = [IO.Compression.GZipStream]::new(
              $gzip, [IO.Compression.CompressionMode]::Decompress)
            try {
              $output = [IO.File]::Create($patch)
              try { $decoder.CopyTo($output) }
              finally { $output.Dispose() }
            }
            finally { $decoder.Dispose() }
          }
          finally { $gzip.Dispose() }

          $patchHash = (Get-FileHash -LiteralPath $patch -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($patchHash -ne '393e520c85db623db9ce4045a45522248894ef77f8f278e285d1dd945558966d') {
            throw "Decoded .637 patch SHA-256 mismatch: $patchHash"
          }

          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $patchText = [IO.File]::ReadAllText($patch).Replace("`r`n", "`n")
          [IO.File]::WriteAllText($patch, $patchText, $utf8NoBom)

          $pathMatches = [regex]::Matches($patchText, '(?m)^diff --git a/(.+?) b/(.+?)$')
          foreach ($match in $pathMatches) {
            $relative = $match.Groups[2].Value
            $path = Join-Path $env:TPR_SRC $relative
            if (Test-Path -LiteralPath $path -PathType Leaf) {
              $text = [IO.File]::ReadAllText($path)
              [IO.File]::WriteAllText($path, $text.Replace("`r`n", "`n"), $utf8NoBom)
            }
          }

          Push-Location "$env:TPR_SRC"
          try {
            git apply --check $patch
            if ($LASTEXITCODE -ne 0) {
              throw 'Enemy-defeat logic patch does not match the verified .636 source.'
            }
            git apply $patch
            if ($LASTEXITCODE -ne 0) {
              throw 'Enemy-defeat logic patch could not be applied.'
            }
          }
          finally {
            Pop-Location
          }

      - name: Apply reviewed .638 enemy-randomization patch
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = @(Get-ChildItem `
            "$env:GITHUB_WORKSPACE\_control\patches\enemy-randomization-638.patch.gz.b64.part*" `
            -File | Sort-Object Name)
          if ($parts.Count -ne 1) {
            throw "Expected one .638 patch chunk; found $($parts.Count)."
          }

          $encoded = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $gzipPath = Join-Path $env:RUNNER_TEMP 'enemy-randomization-638.patch.gz'
          [IO.File]::WriteAllBytes($gzipPath, [Convert]::FromBase64String($encoded))
          $gzipHash = (Get-FileHash -LiteralPath $gzipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($gzipHash -ne '2e099d403462e8545688ba8d241028447eeb68a1192d945462274cc2d2db5388') {
            throw "Compressed .638 patch SHA-256 mismatch: $gzipHash"
          }

          $patch = Join-Path $env:RUNNER_TEMP 'enemy-randomization-638.patch'
          $gzip = [IO.File]::OpenRead($gzipPath)
          try {
            $decoder = [IO.Compression.GZipStream]::new(
              $gzip, [IO.Compression.CompressionMode]::Decompress)
            try {
              $output = [IO.File]::Create($patch)
              try { $decoder.CopyTo($output) }
              finally { $output.Dispose() }
            }
            finally { $decoder.Dispose() }
          }
          finally { $gzip.Dispose() }

          $patchHash = (Get-FileHash -LiteralPath $patch -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($patchHash -ne '848ffccdf92d2dbcaf6396f3bc47643960439f46e2ef5979481442e9587ac3ea') {
            throw "Decoded .638 patch SHA-256 mismatch: $patchHash"
          }

          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $patchText = [IO.File]::ReadAllText($patch).Replace("`r`n", "`n")
          [IO.File]::WriteAllText($patch, $patchText, $utf8NoBom)

          $pathMatches = [regex]::Matches($patchText, '(?m)^diff --git a/(.+?) b/(.+?)$')
          foreach ($match in $pathMatches) {
            $relative = $match.Groups[2].Value
            $path = Join-Path $env:TPR_SRC $relative
            if (Test-Path -LiteralPath $path -PathType Leaf) {
              $text = [IO.File]::ReadAllText($path)
              [IO.File]::WriteAllText($path, $text.Replace("`r`n", "`n"), $utf8NoBom)
            }
          }

          Push-Location "$env:TPR_SRC"
          try {
            git apply --check $patch
            if ($LASTEXITCODE -ne 0) {
              throw 'Enemy-randomization patch does not match the verified .637 source.'
            }
            git apply $patch
            if ($LASTEXITCODE -ne 0) {
              throw 'Enemy-randomization patch could not be applied.'
            }
          }
          finally {
            Pop-Location
          }

      - name: Apply reviewed .639 menu-color safety patch
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = @(Get-ChildItem `
            "$env:GITHUB_WORKSPACE\_control\patches\menu-color-safety-639.patch.gz.b64.part*" `
            -File | Sort-Object Name)
          if ($parts.Count -ne 1) {
            throw "Expected one .639 patch chunk; found $($parts.Count)."
          }

          $encoded = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $gzipPath = Join-Path $env:RUNNER_TEMP 'menu-color-safety-639.patch.gz'
          [IO.File]::WriteAllBytes($gzipPath, [Convert]::FromBase64String($encoded))
          $gzipHash = (Get-FileHash -LiteralPath $gzipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($gzipHash -ne '97941abc74f6144ba234ecab69387b4cbac71f2ce887e4a6ab45be58273668ca') {
            throw "Compressed .639 patch SHA-256 mismatch: $gzipHash"
          }

          $patch = Join-Path $env:RUNNER_TEMP 'menu-color-safety-639.patch'
          $gzip = [IO.File]::OpenRead($gzipPath)
          try {
            $decoder = [IO.Compression.GZipStream]::new(
              $gzip, [IO.Compression.CompressionMode]::Decompress)
            try {
              $output = [IO.File]::Create($patch)
              try { $decoder.CopyTo($output) }
              finally { $output.Dispose() }
            }
            finally { $decoder.Dispose() }
          }
          finally { $gzip.Dispose() }

          $patchHash = (Get-FileHash -LiteralPath $patch -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($patchHash -ne 'e494bcd5e650878c81a4277ce4c9013e04fa4bd65a11ff7121fc730675521922') {
            throw "Decoded .639 patch SHA-256 mismatch: $patchHash"
          }

          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $patchText = [IO.File]::ReadAllText($patch).Replace("`r`n", "`n")
          [IO.File]::WriteAllText($patch, $patchText, $utf8NoBom)

          $pathMatches = [regex]::Matches($patchText, '(?m)^diff --git a/(.+?) b/(.+?)$')
          foreach ($match in $pathMatches) {
            $relative = $match.Groups[2].Value
            $path = Join-Path $env:TPR_SRC $relative
            if (Test-Path -LiteralPath $path -PathType Leaf) {
              $text = [IO.File]::ReadAllText($path)
              [IO.File]::WriteAllText($path, $text.Replace("`r`n", "`n"), $utf8NoBom)
            }
          }

          Push-Location "$env:TPR_SRC"
          try {
            git apply --check $patch
            if ($LASTEXITCODE -ne 0) {
              throw 'Menu-color safety patch does not match the verified .638 source.'
            }
            git apply $patch
            if ($LASTEXITCODE -ne 0) {
              throw 'Menu-color safety patch could not be applied.'
            }
          }
          finally {
            Pop-Location
          }

      - name: Advance private package identity to .639
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = "$env:TPR_SRC\platforms\uwp\Package.appxmanifest"
          $manifest = [IO.File]::ReadAllText($manifestPath)
          if ($manifest -notmatch 'Version="1[.]4[.]1[.]636"') {
            throw 'Verified .636 package identity was not present before the .639 version advance.'
          }
          $manifest = $manifest.Replace('Version="1.4.1.636"', 'Version="1.4.1.639"')
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::WriteAllText($manifestPath, $manifest, $utf8NoBom)

      - name: Emit patch mismatch diagnostics
        if: failure()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostics = Join-Path $env:GITHUB_WORKSPACE 'TPR-Patch-Diagnostics'
          Get-ChildItem -LiteralPath $diagnostics -File | Sort-Object Name | ForEach-Object {
            Write-Host "TPR_DIAG_BEGIN:$($_.Name)"
            $encoded = [Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName))
            for ($offset = 0; $offset -lt $encoded.Length; $offset += 12000) {
              $length = [Math]::Min(12000, $encoded.Length - $offset)
              Write-Host $encoded.Substring($offset, $length)
            }
            Write-Host "TPR_DIAG_END:$($_.Name)"
          }

      - name: Run focused extraction, logic, entrance, shop, enemy, and color-safety tests
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          if ($LASTEXITCODE -ne 0) { throw 'Could not install the pinned PyYAML test dependency.' }
          python -m unittest discover -s "$env:TPR_SRC\tools\tests" -v

      - name: Verify requested feature boundaries
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content "$env:TPR_SRC\platforms\uwp\Package.appxmanifest" -Raw
          if ($manifest -notmatch 'Version="1[.]4[.]1[.]639"') {
            throw 'Assembled package identity is not 1.4.1.639.'
          }

          $checks = @(
            @{ Path='src\dusk\ui\cosmetics.cpp'; Text='Randomize All Colors on Every Load Screen' },
            @{ Path='src\dusk\ui\cosmetics.cpp'; Text='Rainbow Color Rotation Speed' },
            @{ Path='src\dusk\ui\cosmetics.cpp'; Text='cosmetics.menuPalette.contrast.v1' },
            @{ Path='src\dusk\ui\cosmetics.cpp'; Text='kFixedTextBoxBackground = "11100a"' },
            @{ Path='tools\tests\test_cosmetic_color_safety.py'; Text='test_twenty_thousand_load_palette_inputs_all_pass' },
            @{ Path='src\dusk\randomizer\game\breakables.cpp'; Text='randomizer.breakables.v2' },
            @{ Path='src\dusk\randomizer\generator\data\settings_list.yaml'; Text='- Name: Pots' },
            @{ Path='src\dusk\randomizer\generator\data\settings_list.yaml'; Text='- Name: Pumpkins' },
            @{ Path='src\dusk\imgui\ImGuiMenuRandomizer.cpp'; Text='Visual Item Tracker' },
            @{ Path='src\dusk\imgui\ImGuiControllerOverlay.cpp'; Text='Input Viewer Layout' },
            @{ Path='src\d\actor\d_a_movie_player.cpp'; Text='Malformed JPEG data in THP frame' },
            @{ Path='src\dusk\randomizer\generator\logic\entrance.hpp'; Text='GameTransitionData' },
            @{ Path='src\dusk\randomizer\game\randomizer_context.cpp'; Text='Dungeon entrance shuffle did not produce a complete permutation' },
            @{ Path='src\dusk\randomizer\game\randomizer_context.cpp'; Text='Boss entrance shuffle did not produce a complete permutation' },
            @{ Path='src\dusk\randomizer\game\shop_items.cpp'; Text='randomizer.expanded_shops.v1' },
            @{ Path='src\dusk\randomizer\generator\shop_item_data.cpp'; Text='Castle Town Malo Mart Bomblings' },
            @{ Path='src\dusk\randomizer\generator\data\settings_list.yaml'; Text='- "All": "The established shop items' },
            @{ Path='src\dusk\randomizer\generator\data\enemy_defeat_requirements.yaml'; Text='Gate Policy: Mandatory Only' },
            @{ Path='src\dusk\randomizer\generator\logic\enemy_requirements.cpp'; Text='Boss entrance shuffle did not preserve every enemy defeat requirement' },
            @{ Path='src\dusk\randomizer\generator\data\macros.yaml'; Text='Can Defeat Ganondorf' },
            @{ Path='src\dusk\randomizer\generator\data\settings_list.yaml'; Text='- Name: Enemy Randomization' },
            @{ Path='src\dusk\randomizer\generator\data\enemy_shuffle_placements.yaml'; Text='Full Records: 464' },
            @{ Path='src\dusk\randomizer\game\enemy_shuffle.cpp'; Text='Enemy shuffle overlaps another actor patch' },
            @{ Path='src\dusk\ui\rando_config.cpp'; Text='rando_config_button(leftPane, rightPane, "Enemy Randomization")' }
          )
          foreach ($check in $checks) {
            $path = Join-Path $env:TPR_SRC $check.Path
            if (-not (Select-String -LiteralPath $path -SimpleMatch $check.Text -Quiet)) {
              throw "Missing required marker '$($check.Text)' in $($check.Path)."
            }
          }


      - name: Emit Input Viewer and Sword diagnostics
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          function Write-EncodedSource([string]$relative) {
            $path = Join-Path $env:TPR_SRC $relative
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              Write-Host "TPR_SOURCE_MISSING:$relative"
              return
            }
            Write-Host "TPR_SOURCE_BEGIN:$relative"
            $encoded = [Convert]::ToBase64String([IO.File]::ReadAllBytes($path))
            for ($offset = 0; $offset -lt $encoded.Length; $offset += 12000) {
              $length = [Math]::Min(12000, $encoded.Length - $offset)
              Write-Host $encoded.Substring($offset, $length)
            }
            Write-Host "TPR_SOURCE_END:$relative"
          }

          Write-EncodedSource 'src\dusk\imgui\ImGuiControllerOverlay.cpp'
          Write-EncodedSource 'src\dusk\imgui\ImGuiControllerOverlay.h'
          Write-EncodedSource 'src\dusk\imgui\ImGuiControllerOverlay.hpp'

          Write-Host 'TPR_INPUT_VIEWER_PATHS_BEGIN'
          Get-ChildItem -LiteralPath $env:TPR_SRC -Recurse -File |
            Where-Object {
              $_.Name -match '(?i)(controller.*overlay|input.?viewer|gamepad)' -or
              $_.FullName -match '(?i)[\\/]textures[\\/].*(controller|input)'
            } |
            Sort-Object FullName |
            ForEach-Object {
              $relative = $_.FullName.Substring($env:TPR_SRC.Length).TrimStart([char[]]'\\/')
              Write-Host ($relative + ' | ' + $_.Length)
            }
          Write-Host 'TPR_INPUT_VIEWER_PATHS_END'

          Push-Location $env:TPR_SRC
          try {
            $swordMatches = @(git grep -n -I -E '(^|[^[:alnum:]_])Sword([^[:alnum:]_]|$)' -- 'src/dusk/randomizer')
            Write-Host 'TPR_SWORD_MATCHES_BEGIN'
            $swordMatches | ForEach-Object { Write-Host $_ }
            Write-Host 'TPR_SWORD_MATCHES_END'

            $swordFiles = @($swordMatches |
              ForEach-Object { ($_ -split ':', 2)[0] } |
              Sort-Object -Unique)
            foreach ($relative in $swordFiles) {
              $path = Join-Path $env:TPR_SRC $relative
              if ((Get-Item -LiteralPath $path).Length -le 300000) {
                Write-EncodedSource $relative
              }
            }

            Write-Host 'TPR_LOGIC_SYMBOL_PATHS_BEGIN'
            git grep -l -I -E 'Unrecognized logic symbol|logic symbol|LogicSymbols|register.*symbol|symbol.*register' -- 'src/dusk/randomizer' |
              Sort-Object -Unique |
              ForEach-Object { Write-Host $_ }
            Write-Host 'TPR_LOGIC_SYMBOL_PATHS_END'
          }
          finally {
            Pop-Location
          }
