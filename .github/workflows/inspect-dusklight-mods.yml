name: Inventory verified Dusklight mod packages
on:
  push:
    branches: [codex/mod-bundle-inventory-735]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download and inspect every published mod
        run: python3 scripts/inspect-online-mods.py mod-inventory
      - name: Save verified packages and compatibility inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dusklight-mod-compatibility-inventory
          path: mod-inventory
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
