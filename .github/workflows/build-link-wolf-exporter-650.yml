              'Discovered Entrance Graph',
              'Focus Current Region',
              'Seed Audit',
              'Safe Full Randomizer',
              'Open Tracker at Current Region',
              'Seed-Aware Junk',
              'TPR-SEED-AWARE-JUNK-V1'
            )
            foreach ($marker in $markers) {
              if (-not $exeText.Contains($marker)) {
                throw "Compiled executable is missing marker '$marker'."
              }
            }
          }
          finally {
            $archive.Dispose()
          }

          if ((Get-Item $package).Length -gt 100MB) {
            throw 'ZIP-only MSIX is unexpectedly larger than 100 MiB.'
          }

          $dependencies = @(Get-ChildItem "$env:TPR_PKG" -Recurse -File |
            Where-Object {
              $_.Extension -in '.appx','.appxbundle','.msixbundle' -and
              $_.FullName -match '[\\/]Dependencies[\\/]' -and
              $_.Name -match '(?i)x64'
            })
          if ($dependencies.Count -ne 1) {
            throw "Expected exactly one x64 dependency for the Xbox portal; found $($dependencies.Count)."
          }
          Copy-Item $dependencies[0].FullName $packageDir -Force

          $identity = Get-Content "$env:GITHUB_WORKSPACE\APP_IDENTITY.json" -Raw |
            ConvertFrom-Json
          $identity.version = '1.4.1.650'
          $identity | ConvertTo-Json | Set-Content `
            "$env:GITHUB_WORKSPACE\APP_IDENTITY.json" -Encoding UTF8
          $installGuide = Get-Content "$env:GITHUB_WORKSPACE\INSTALL_XBOX.md" -Raw
          $nextInstallInstruction = 'Do **not** uninstall your current working build. Deploy `.650` over it'
          $knownInstallInstructions = @(
            'Do **not** uninstall `.633`. Deploy `.634` over it',
            'Do **not** uninstall `.635`. Deploy `.636` over it',
            'Do **not** uninstall `.636`. Deploy `.637` over it',
            'Do **not** uninstall `.637`. Deploy `.638` over it',
            'Do **not** uninstall your current working build. Deploy `.639` over it',
            'Do **not** uninstall your current working build. Deploy `.640` over it',
            'Do **not** uninstall your current working build. Deploy `.641` over it',
            'Do **not** uninstall your current working build. Deploy `.642` over it',
            'Do **not** uninstall your current working build. Deploy `.643` over it',
            'Do **not** uninstall your current working build. Deploy `.644` over it',
            'Do **not** uninstall your current working build. Deploy `.645` over it',
            'Do **not** uninstall your current working build. Deploy `.646` over it',
            'Do **not** uninstall your current working build. Deploy `.647` over it',
            'Do **not** uninstall your current working build. Deploy `.648` over it',
            'Do **not** uninstall your current working build. Deploy `.649` over it'
          )
          foreach ($knownInstruction in $knownInstallInstructions) {
            $installGuide = $installGuide.Replace($knownInstruction, $nextInstallInstruction)
          }
          if (-not $installGuide.Contains($nextInstallInstruction)) {
            throw 'Xbox install guide could not be advanced to the .650 in-place update instructions.'
          }
          Set-Content "$env:GITHUB_WORKSPACE\INSTALL_XBOX.md" $installGuide -Encoding UTF8

          Copy-Item "$env:GITHUB_WORKSPACE\TwilightPrincessRandomizer.cer" $packageDir -Force
          Copy-Item "$env:GITHUB_WORKSPACE\INSTALL_XBOX.md" $packageDir -Force
          Copy-Item "$env:GITHUB_WORKSPACE\INSTALL_TEXTURE_ZIPS_XBOX.md" $packageDir -Force
          Copy-Item "$env:GITHUB_WORKSPACE\APP_IDENTITY.json" $packageDir -Force

          $supportDir = Join-Path $packageDir 'Support'
          $supportZip = Join-Path $packageDir 'Twilight-Princess-Randomizer-UWP-1.4.1.650-Xbox-Support.zip'
          New-Item -ItemType Directory -Force $supportDir | Out-Null
          Copy-Item @(
            (Join-Path $packageDir 'TwilightPrincessRandomizer.cer'),
            (Join-Path $packageDir 'INSTALL_XBOX.md'),
            (Join-Path $packageDir 'INSTALL_TEXTURE_ZIPS_XBOX.md'),
            (Join-Path $packageDir 'APP_IDENTITY.json')
          ) -Destination $supportDir -Force
          Get-ChildItem $packageDir -File |
            Where-Object { $_.Extension -in '.appx','.appxbundle','.msixbundle' } |
            ForEach-Object { Copy-Item $_.FullName $supportDir -Force }
          Compress-Archive -Path (Join-Path $supportDir '*') `
            -DestinationPath $supportZip -CompressionLevel Optimal -Force

          if (Test-Path "$env:GITHUB_WORKSPACE\TPR-build-signing.pfx") {
            Remove-Item "$env:GITHUB_WORKSPACE\TPR-build-signing.pfx" -Force
          }
          Get-FileHash $package -Algorithm SHA256

      - name: Release short build drive
        if: always()
        shell: powershell
        run: |
          if (Test-Path 'S:\') {
            subst S: /D
          }

      - name: Upload verified .650 test artifact
        id: artifact_handoff
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Twilight-Princess-Randomizer-UWP-1.4.1.650-Private-Test
          path: TPR-Xbox-Package/
          if-no-files-found: error
          retention-days: 14

      - name: Upload private draft test package
        id: draft_release_handoff
        continue-on-error: true
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packageDir = Join-Path $env:GITHUB_WORKSPACE 'TPR-Xbox-Package'
          $assets = @(Get-ChildItem -LiteralPath $packageDir -File | Sort-Object Name)
          if ($assets.Count -eq 0) {
            throw 'No verified package files are available for private handoff.'
          }

          $tag = "tpr-uwp-1.4.1.650-private-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $title = 'Twilight Princess Randomizer UWP 1.4.1.650 Private Test'
          $notes = @'
          PRIVATE DRAFT TEST BUILD — NOT PUBLISHED

          This .650 build adds Tools -> Export Link + Wolf Modding Assets. After the game image
          is launched, it validates and exports only the user's Kmdl.arc and Wmdl.arc, plus a
          machine-readable contract and README, into one Link-Wolf-Modding-Assets ZIP. The contract
          locks the eventual character mod to Hero's Clothes Link and Wolf Link, preserves every
          Midna resource byte-for-byte, and preserves Wolf Link's native chain on joint 17 FLEGR2.
          No replacement character model is bundled in this MSIX; the export is the owned-game
          input needed to produce the later single-toggle Hero-Wolf-Link.dusk package.

          It also fixes randomized breakable marker lifecycle behavior: a pumpkin that has already
          produced its reward regrows with its normal orange appearance, collected pumpkins stay
          orange after scene reloads, and per-draw tint state can no longer leak through shared
          pumpkin materials. Pots use the same pending/collected guard, so their category marker
          cannot return after their reward has spawned or been collected.

          Built from the verified 1.4.1.634 / working .627 runtime baseline,
          Includes the compile-tested .636 dungeon, boss-entrance, and expanded-shop set,
          plus the .637 data-driven enemy defeat-requirement catalog and shuffled-boss logic.
          Enemy Randomization is now applied deterministically while stage actors load instead
          of using a sparse coordinate list. Balanced and Full both force every eligible regular
          enemy encountered in overworlds, dungeons, caves, and grottos to change, with Balanced
          using compact movement-compatible pools and Full using wider per-placement pools.
          Bosses, minibosses, their complete encounter arenas, King Bulblin boss variants, and
          authored progression/entrance actor edits remain strictly vanilla. The setting still
          defaults to Off, and older seeds without the persisted setting also remain vanilla.
          Menu palettes generated per seed or per load scene now pass WCAG contrast checks
          against every normal, hover, and selected surface before use. Text-entry text still
          follows the menu text color, while text-entry backgrounds stay fixed and opaque.
          Rainbow selections now continuously fade through eight real hue anchors instead of
          snapping between preset entries; Xbox updates are capped at 20 per second, complete
          menu themes stay contrast-safe throughout the fade, and all nine Midna hair color
          registers interpolate together. Per-load hearts now cycle through eight canonical,
          deliberately separated base color families before any fixed family repeats; Rainbow
          may appear between them but can never occur twice consecutively.
          The Input Viewer now uses a permanently transparent Ship-style presentation: no blue
          panel, controller-name strip, opaque window body, or randomized window border.
          Seed generation now registers every logic macro name before parsing requirements,
          while hiding the macro currently being parsed so same-name items such as Lantern,
          Slingshot, and Spinner cannot become recursive macro calls. This fixes the .640 macro
          crash while retaining forward `Sword` references for future enemy logic. Pot, pumpkin,
          and expanded-shop checks now reject logical-only item IDs above `0xFE` before filling,
          preventing Twilight Tears (`0x103`-`0x105`) from invalidating completed seed data while
          keeping those items available to ordinary checks. Shop coverage is now an explicit control:
          its first forward choice is All Shelves (32), covering 24 logical checks across all 32 safe
          physical shelves, including Milk, Bee Larva, and Lantern Oil as three separate Sera/Ordon
          slots. Generation now rejects an incomplete All Shelves result instead of quietly shipping it.
          Rainbow All Colors applies the continuously fading Rainbow mode to every supported target.
          Per-seed and per-load random color modes can also select Rainbow (one candidate in eight),
          while all four menu roles move together as one contrast-safe palette and text-box backgrounds
          remain fixed and opaque. The Pure Item Tracker is a separate automatic icon-only overlay
          arranged in Ship of Harkinian's compact six-column style: the window, title, tile panels,
          and borders are fully transparent; owned icons remain fully lit; unowned icons retain
          their color at low opacity; and positive progressive or quantity counts appear as plain
          outlined text beneath the icons. The whole grid can be moved and resized independently;
          Xbox settings expose UI scale, icon size, column count, layout lock, and reset. It remains
          available to existing randomized saves; generating a new seed is not required. A new
          transparent death counter reads the save's native saturating death count. A separate
          transparent IGT overlay displays HH:MM:SS.hh, persists with each randomizer save, and
          advances only during live simulation—not while paused, loading, or on a game-over screen.
          Both run overlays have independent toggles, scale, position lock, and layout reset controls.
          The check tracker now labels accessible, remaining, checked, and total progression checks
          separately, excludes collected checks in accessible-only mode, and makes each area header's
          filtered count explicit.
          New seed files now use a more compact Zstandard v2 payload before their transactional
          write, then decode and byte-verify both before and after the atomic rename. Existing
          miniz v1 and plain-YAML seed files remain readable, so .645/.646 saves are preserved.
          This directly addresses the measured 41,466-byte expanded seed that missed Xbox's
          reported 40,960-byte free space by only 506 bytes, while retaining exact diagnostics for
          any genuine future storage exhaustion.
          Pot, pumpkin, and expanded-shop runtime metadata are now serialized into yaml-cpp as wide
          numeric scalars rather than uint8_t character scalars. This removes the `bad conversion`
          failure reached when any of those new check groups was enabled. Every decoded field is also
          range-checked and any future malformed record names its feature, location, and exact field.
          Expanded-shop item labels now use the seed-local text table only when the key exists,
          otherwise falling back to the normal localized item table and finally the raw item name.
          This removes the `invalid unordered_map<K, T> key` generation stop without reducing the
          24 logical / 32 physical shelf coverage. Randomized, uncollected pumpkins now use a muted
          green marker after the environment-light pass so they remain clear without glowing neon.
          Optional item-category colors now identify major, minor, dungeon, trap, and junk rewards
          across chests, freestanding items, pots, pumpkins, and both shop actor families. Checks that
          have entered view persist as seed-and-save-slot-scoped seen state, with status/type filters,
          customizable tracker colors, current-region focus, Xbox shortcuts, and five-icon seed
          fingerprints at the seed and tracker surfaces. The entrance tracker is now a persistent,
          spoiler-safe discovered graph: unseen destinations remain hidden as `???` until traversed.
          Seed-Aware Junk deterministically replaces only unusable ammo after final item placement,
          while preserving multiworld item ownership and running before playthrough, hints, and logs.
          Seed Audit validates pots, all 43 story-only pumpkins, 32 physical shop shelves, and enabled
          dungeon, boss, cave, and grotto entrance tables before accepting the seed. Octosanity adds
          the synchronized x8 damage option, and Safe Full enables only the proven shuffle families.
          This is an unpublished test candidate, not a public release.
          '@

          $draftUrl = gh release create $tag `
            --repo "$env:GITHUB_REPOSITORY" `
            --draft `
            --target "$env:GITHUB_SHA" `
            --title $title `
            --notes $notes
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not create the private draft test release.'
          }

          foreach ($asset in $assets) {
            gh release upload $tag $asset.FullName --repo "$env:GITHUB_REPOSITORY"
            if ($LASTEXITCODE -ne 0) {
              throw "Could not upload private test asset $($asset.Name)."
            }
          }

          Write-Host "TPR_PRIVATE_DRAFT_URL=$draftUrl"
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" `
            --json url,name,isDraft,tagName

      - name: Verify package handoff
        if: always()
        shell: powershell
        run: |
          $artifactOutcome = '${{ steps.artifact_handoff.outcome }}'
          $releaseOutcome = '${{ steps.draft_release_handoff.outcome }}'
          if ($artifactOutcome -ne 'success' -and $releaseOutcome -ne 'success') {
            throw "Both package handoffs failed (artifact=$artifactOutcome, release=$releaseOutcome)."
          }
          Write-Host "Package handoff complete (artifact=$artifactOutcome, release=$releaseOutcome)."
