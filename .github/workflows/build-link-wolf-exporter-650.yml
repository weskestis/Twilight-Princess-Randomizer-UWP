            $relative = $match.Groups[2].Value
            $path = Join-Path $env:TPR_SRC $relative
            if (Test-Path -LiteralPath $path -PathType Leaf) {
              $text = [IO.File]::ReadAllText($path)
              [IO.File]::WriteAllText($path, $text.Replace("`r`n", "`n"), $utf8NoBom)
            }
          }

          Push-Location "$env:TPR_SRC"
          try {
            git apply --check $patch
            if ($LASTEXITCODE -ne 0) {
              throw 'Link + Wolf exporter patch does not match the verified .649 source.'
            }
            git apply $patch
            if ($LASTEXITCODE -ne 0) {
              throw 'Link + Wolf exporter patch could not be applied.'
            }
          }
          finally {
            Pop-Location
          }

      - name: Advance private package identity to .650
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = "$env:TPR_SRC\platforms\uwp\Package.appxmanifest"
          $manifest = [IO.File]::ReadAllText($manifestPath)
          if ($manifest -notmatch 'Version="1[.]4[.]1[.]636"') {
            throw 'Verified .636 package identity was not present before the .650 version advance.'
          }
          $manifest = $manifest.Replace('Version="1.4.1.636"', 'Version="1.4.1.650"')
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::WriteAllText($manifestPath, $manifest, $utf8NoBom)

      - name: Emit patch mismatch diagnostics
        if: failure()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostics = Join-Path $env:GITHUB_WORKSPACE 'TPR-Patch-Diagnostics'
          Get-ChildItem -LiteralPath $diagnostics -File | Sort-Object Name | ForEach-Object {
            Write-Host "TPR_DIAG_BEGIN:$($_.Name)"
            $encoded = [Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName))
            for ($offset = 0; $offset -lt $encoded.Length; $offset += 12000) {
              $length = [Math]::Min(12000, $encoded.Length - $offset)
              Write-Host $encoded.Substring($offset, $length)
            }
            Write-Host "TPR_DIAG_END:$($_.Name)"
          }

      - name: Run the complete .650 regression and feature-contract suite
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          if ($LASTEXITCODE -ne 0) { throw 'Could not install the pinned PyYAML test dependency.' }
          Push-Location "$env:TPR_SRC"
          try {
            python -m unittest discover -s 'tools\tests' -v
            if ($LASTEXITCODE -ne 0) { throw 'The complete .650 regression suite failed.' }
          }
          finally {
            Pop-Location
          }

