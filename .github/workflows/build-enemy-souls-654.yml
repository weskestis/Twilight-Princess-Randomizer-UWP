      - name: Compile and run the real Enemy Souls seed smoke test
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Keep this desktop logic-test build isolated from the already-configured
          # UWP feed. Reusing TPR_FEED leaves Aurora's cached providers pinned to
          # uwp-dep, whose intentionally narrow headers do not include
          # dawn/native/DawnNative.h for a desktop build.
          cmake -S "$env:TPR_SRC" -B "$env:TPR_SMOKE" -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL `
            -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON `
            -DCMAKE_OBJECT_PATH_MAX=180 `
            -DDUSK_UWP=OFF `
            -DRANDOMIZER_ONLY=1 `
            -DLOGIC_TESTS=ON `
            -DDUSK_MOVIE_SUPPORT=OFF `
            -DDUSK_ENABLE_UPDATE_CHECKER=OFF `
            -DDUSK_ENABLE_DISCORD=OFF `
            -DDUSK_ENABLE_SENTRY_NATIVE=OFF `
            -DDUSK_ENABLE_CODE_MODS=OFF `
            -DDUSK_VERSION_OVERRIDE=v1.4.1-627-tpr-logic-smoke-658
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not configure the compiled Enemy Souls seed smoke test.'
          }

          cmake --build "$env:TPR_SMOKE" --config RelWithDebInfo `
            --target dusklight --parallel 2
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not compile the Enemy Souls seed smoke test.'
          }

          $testExecutable = Join-Path $env:TPR_SMOKE 'dusklight.exe'
          if (-not (Test-Path -LiteralPath $testExecutable -PathType Leaf)) {
            throw "Compiled logic-test executable is missing: $testExecutable"
          }

          $seedSmokeFilters = @(
            'enemy souls and first defeats',
            'enemy souls cleared twilights',
            'enemy souls max entrance rando'
          )
          try {
            foreach ($seedSmokeFilter in $seedSmokeFilters) {
              $env:RANDO_LOGIC_TEST_FILTER = $seedSmokeFilter
              Write-Host "Running compiled seed smoke: $seedSmokeFilter"
              $process = Start-Process -FilePath $testExecutable `
                -WorkingDirectory $env:TPR_SRC -NoNewWindow -Wait -PassThru
              if ($process.ExitCode -ne 0) {
                throw "Compiled seed smoke '$seedSmokeFilter' failed with exit code $($process.ExitCode)."
              }
            }
          }
          finally {
            Remove-Item Env:RANDO_LOGIC_TEST_FILTER -ErrorAction SilentlyContinue
          }

