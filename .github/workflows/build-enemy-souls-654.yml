          }

          Push-Location "$env:TPR_SRC"
          try {
            git apply --check $patch
            if ($LASTEXITCODE -ne 0) {
              throw 'Shop stability hotfix does not match the verified .656 source.'
            }
            git apply $patch
            if ($LASTEXITCODE -ne 0) {
              throw 'Shop stability hotfix could not be applied.'
            }
          }
          finally {
            Pop-Location
          }

      - name: Apply reviewed .658 runtime-load and shop hotfix
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = @(Get-ChildItem `
            "$env:GITHUB_WORKSPACE\_control\patches\shop-runtime-load-stability-658.patch.gz.b64.part*" `
            -File | Sort-Object Name)
          if ($parts.Count -ne 1) {
            throw "Expected one .658 patch chunk; found $($parts.Count)."
          }

          $encoded = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $gzipPath = Join-Path $env:RUNNER_TEMP 'shop-runtime-load-stability-658.patch.gz'
          [IO.File]::WriteAllBytes($gzipPath, [Convert]::FromBase64String($encoded))
          $gzipHash = (Get-FileHash -LiteralPath $gzipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($gzipHash -ne '1f02e861aac5a44bc5ff0be1e868daaa2901b4e7247a806909efa4109530c981') {
            throw "Compressed .658 patch SHA-256 mismatch: $gzipHash"
          }

          $patch = Join-Path $env:RUNNER_TEMP 'shop-runtime-load-stability-658.patch'
          $gzip = [IO.File]::OpenRead($gzipPath)
          try {
            $decoder = [IO.Compression.GZipStream]::new(
              $gzip, [IO.Compression.CompressionMode]::Decompress)
            try {
              $output = [IO.File]::Create($patch)
              try { $decoder.CopyTo($output) }
              finally { $output.Dispose() }
            }
            finally { $decoder.Dispose() }
          }
          finally { $gzip.Dispose() }

          $patchHash = (Get-FileHash -LiteralPath $patch -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($patchHash -ne 'b569cc7d0a399d15513b62bd155aa52bf70706abaf45cce4d78ca15bfc444c12') {
            throw "Decoded .658 patch SHA-256 mismatch: $patchHash"
          }

          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $patchText = [IO.File]::ReadAllText($patch).Replace("`r`n", "`n")
          [IO.File]::WriteAllText($patch, $patchText, $utf8NoBom)

          $pathMatches = [regex]::Matches($patchText, '(?m)^diff --git a/(.+?) b/(.+?)$')
          foreach ($match in $pathMatches) {
            $relative = $match.Groups[2].Value
            $path = Join-Path $env:TPR_SRC $relative
            if (Test-Path -LiteralPath $path -PathType Leaf) {
              $text = [IO.File]::ReadAllText($path)
              [IO.File]::WriteAllText($path, $text.Replace("`r`n", "`n"), $utf8NoBom)
            }
          }

          Push-Location "$env:TPR_SRC"
          try {
            git apply --check $patch
            if ($LASTEXITCODE -ne 0) {
              throw 'Runtime-load and shop hotfix does not match the verified .657 source.'
            }
            git apply $patch
            if ($LASTEXITCODE -ne 0) {
              throw 'Runtime-load and shop hotfix could not be applied.'
            }
          }
          finally {
            Pop-Location
          }

      - name: Advance private package identity to .658
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = "$env:TPR_SRC\platforms\uwp\Package.appxmanifest"
          $manifest = [IO.File]::ReadAllText($manifestPath)
          if ($manifest -notmatch 'Version="1[.]4[.]1[.]636"') {
            throw 'Verified .636 package identity was not present before the .658 version advance.'
          }
          $manifest = $manifest.Replace('Version="1.4.1.636"', 'Version="1.4.1.658"')
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::WriteAllText($manifestPath, $manifest, $utf8NoBom)

      - name: Assign Legacy 658 side-by-side UWP identity
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = "$env:TPR_SRC\platforms\uwp\Package.appxmanifest"
          [xml]$manifestXml = Get-Content -LiteralPath $manifestPath -Raw

          $ns = New-Object System.Xml.XmlNamespaceManager($manifestXml.NameTable)
          $ns.AddNamespace('d', 'http://schemas.microsoft.com/appx/manifest/foundation/windows10')
          $ns.AddNamespace('mp', 'http://schemas.microsoft.com/appx/2014/phone/manifest')
          $ns.AddNamespace('uap', 'http://schemas.microsoft.com/appx/manifest/uap/windows10')

          $identity = $manifestXml.SelectSingleNode('/d:Package/d:Identity', $ns)
          $displayName = $manifestXml.SelectSingleNode('/d:Package/d:Properties/d:DisplayName', $ns)
          $phoneIdentity = $manifestXml.SelectSingleNode('/d:Package/mp:PhoneIdentity', $ns)
          $visual = $manifestXml.SelectSingleNode('/d:Package/d:Applications/d:Application/uap:VisualElements', $ns)

          if (-not $identity -or -not $displayName -or -not $phoneIdentity -or -not $visual) {
            throw 'Legacy 658 conversion could not locate required manifest nodes.'
          }
          if ($identity.GetAttribute('Name') -ne 'TwilightPrincessRandomizer' -or
              $identity.GetAttribute('Version') -ne '1.4.1.658' -or
              $identity.GetAttribute('Publisher') -ne 'CN=TwilightPrincessRandomizer') {
            throw "Unexpected pre-Legacy identity: Name=$($identity.GetAttribute('Name')) Publisher=$($identity.GetAttribute('Publisher')) Version=$($identity.GetAttribute('Version'))"
          }

          $identity.SetAttribute('Name', 'TwilightPrincessRandomizerLegacy658')
          $displayName.InnerText = 'Twilight Princess Randomizer Legacy 658'
          $phoneIdentity.SetAttribute('PhoneProductId', '65865865-8658-4658-8658-658658658658')
          $visual.SetAttribute('DisplayName', 'Twilight Princess Randomizer Legacy 658')
          $visual.SetAttribute('Description', 'Twilight Princess Randomizer Legacy 658 for Xbox/UWP')

          $settings = New-Object System.Xml.XmlWriterSettings
          $settings.Encoding = New-Object System.Text.UTF8Encoding($false)
          $settings.Indent = $true
          $writer = [System.Xml.XmlWriter]::Create($manifestPath, $settings)
          try { $manifestXml.Save($writer) }
          finally { $writer.Dispose() }

          [xml]$verified = Get-Content -LiteralPath $manifestPath -Raw
          $verifyNs = New-Object System.Xml.XmlNamespaceManager($verified.NameTable)
          $verifyNs.AddNamespace('d', 'http://schemas.microsoft.com/appx/manifest/foundation/windows10')
          $verifyNs.AddNamespace('mp', 'http://schemas.microsoft.com/appx/2014/phone/manifest')
          $verifyNs.AddNamespace('uap', 'http://schemas.microsoft.com/appx/manifest/uap/windows10')
          $verifyIdentity = $verified.SelectSingleNode('/d:Package/d:Identity', $verifyNs)
          $verifyDisplay = $verified.SelectSingleNode('/d:Package/d:Properties/d:DisplayName', $verifyNs)
          $verifyPhone = $verified.SelectSingleNode('/d:Package/mp:PhoneIdentity', $verifyNs)
          $verifyVisual = $verified.SelectSingleNode('/d:Package/d:Applications/d:Application/uap:VisualElements', $verifyNs)
          if ($verifyIdentity.GetAttribute('Name') -ne 'TwilightPrincessRandomizerLegacy658' -or
              $verifyDisplay.InnerText -ne 'Twilight Princess Randomizer Legacy 658' -or
              $verifyPhone.GetAttribute('PhoneProductId') -ne '65865865-8658-4658-8658-658658658658' -or
              $verifyVisual.GetAttribute('DisplayName') -ne 'Twilight Princess Randomizer Legacy 658') {
            throw 'Legacy 658 manifest verification failed after XML rewrite.'
          }

      - name: Backport direct Xbox save and DevelopmentFiles storage for Legacy 658
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          # Pre-2.0 Legacy 658 has one play path, not separate vanilla/randomizer modes.
          # On Xbox, bypass emulated CARD for that single path and persist the three quest-log
          # buffers directly beside the selected ISO under DevelopmentFiles/Legacy658Data.
          $memCardPath = "$env:TPR_SRC\src\m_Do\m_Do_MemCard.cpp"
          $memCard = [IO.File]::ReadAllText($memCardPath).Replace("`r`n", "`n")

          $includeAnchor = '#include "dusk/version.hpp"'
          $includeReplacement = @(
            '#include "dusk/version.hpp"',
            '',
            '#if defined(_UWP)',
            '#include <array>',
            '#include <cstdint>',
            '#include <filesystem>',
            '#include <fstream>',
            '#endif'
          ) -join "`n"
          if (-not $memCard.Contains($includeAnchor)) {
            throw 'Legacy 658 direct-save include anchor changed.'
          }
          $memCard = $memCard.Replace($includeAnchor, $includeReplacement)

          $helperAnchor = @(
            '#define CHECKSPACE_RESULT_ERROR    3',
            '',
            '#if PLATFORM_WII'
          ) -join "`n"
          $helperReplacement = @(
            '#define CHECKSPACE_RESULT_ERROR    3',
            '',
            '#if defined(_UWP)',
            'namespace {',
            'constexpr std::array<char, 8> kLegacy658SaveMagic = {''T'',''P'',''L'',''6'',''5'',''8'',''S'',''1''};',
            'constexpr uint32_t kLegacy658SaveFormatVersion = 1;',
            '',
            'struct Legacy658SaveHeader {',
            '    std::array<char, 8> magic;',
            '    uint32_t formatVersion;',
            '    uint32_t dataVersion;',
            '    uint32_t dataSize;',
            '    uint32_t checksum;',
            '};',
            '',
            'enum class Legacy658SaveStatus { Missing, Valid, Invalid };',
            '',
            'std::filesystem::path legacy658DataRoot() {',
            '    const std::string isoPathText = dusk::getSettings().backend.isoPath.getValue();',
            '    if (!isoPathText.empty()) {',
            '        const std::filesystem::path isoPath{isoPathText};',
            '        const auto parent = isoPath.parent_path();',
            '        if (!parent.empty()) {',
            '            return parent / "Legacy658Data";',
            '        }',
            '    }',
            '    return dusk::ConfigPath / "Legacy658Data";',
            '}',
            '',
            'std::filesystem::path legacy658SavePath() {',
            '    return legacy658DataRoot() / "legacy658-xbox.sav";',
            '}',
            '',
            'uint32_t legacy658Checksum(const u8* data, size_t size) {',
            '    uint32_t hash = 2166136261u;',
            '    for (size_t i = 0; i < size; ++i) {',
            '        hash ^= data[i];',
            '        hash *= 16777619u;',
            '    }',
            '    return hash;',
            '}',
            '',
            'Legacy658SaveStatus inspectLegacy658SaveAt(const std::filesystem::path& path) {',
            '    std::error_code ec;',
            '    if (!std::filesystem::exists(path, ec)) {',
            '        return ec ? Legacy658SaveStatus::Invalid : Legacy658SaveStatus::Missing;',
            '    }',
            '    std::ifstream in(path, std::ios::binary);',
            '    Legacy658SaveHeader header{};',
            '    if (!in.read(reinterpret_cast<char*>(&header), sizeof(header))) {',
            '        return Legacy658SaveStatus::Invalid;',
            '    }',
            '    if (header.magic != kLegacy658SaveMagic ||',
            '        header.formatVersion != kLegacy658SaveFormatVersion ||',
            '        header.dataVersion != SAVEDATA_VERSION ||',
            '        header.dataSize != SAVEFILE_SIZE) {',
            '        return Legacy658SaveStatus::Invalid;',
            '    }',
            '    std::array<u8, SAVEFILE_SIZE> data{};',
            '    if (!in.read(reinterpret_cast<char*>(data.data()), data.size())) {',
            '        return Legacy658SaveStatus::Invalid;',
            '    }',
            '    return legacy658Checksum(data.data(), data.size()) == header.checksum ?',
            '        Legacy658SaveStatus::Valid : Legacy658SaveStatus::Invalid;',
            '}',
            '',
            'Legacy658SaveStatus inspectLegacy658Save() {',
            '    const auto path = legacy658SavePath();',
            '    auto status = inspectLegacy658SaveAt(path);',
            '    if (status == Legacy658SaveStatus::Invalid) {',
            '        auto backup = path;',
            '        backup += ".bak";',
            '        if (inspectLegacy658SaveAt(backup) == Legacy658SaveStatus::Valid) {',
            '            std::error_code ec;',
            '            std::filesystem::remove(path, ec);',
            '            ec.clear();',
            '            std::filesystem::rename(backup, path, ec);',
            '            if (!ec) {',
            '                status = Legacy658SaveStatus::Valid;',
            '            }',
            '        }',
            '    }',
            '    return status;',
            '}',
            '',
            'bool readLegacy658Save(u8* outData) {',
            '    const auto path = legacy658SavePath();',
            '    if (inspectLegacy658Save() != Legacy658SaveStatus::Valid) {',
            '        return false;',
            '    }',
            '    std::ifstream in(path, std::ios::binary);',
            '    Legacy658SaveHeader header{};',
            '    if (!in.read(reinterpret_cast<char*>(&header), sizeof(header))) {',
            '        return false;',
            '    }',
            '    std::array<u8, SAVEFILE_SIZE> data{};',
            '    if (!in.read(reinterpret_cast<char*>(data.data()), data.size()) ||',
            '        legacy658Checksum(data.data(), data.size()) != header.checksum) {',
            '        return false;',
            '    }',
            '    std::memcpy(outData, data.data(), data.size());',
            '    return true;',
            '}',
            '',
            'bool writeLegacy658Save(const u8* data) {',
            '    const auto path = legacy658SavePath();',
            '    auto tempPath = path;',
            '    tempPath += ".tmp";',
            '    auto backupPath = path;',
            '    backupPath += ".bak";',
            '    std::error_code ec;',
            '    std::filesystem::create_directories(path.parent_path(), ec);',
            '    if (ec) {',
            '        OS_REPORT("Legacy658 direct-save directory error: %s\\n", ec.message().c_str());',
            '        return false;',
            '    }',
            '    Legacy658SaveHeader header{',
            '        kLegacy658SaveMagic,',
            '        kLegacy658SaveFormatVersion,',
            '        SAVEDATA_VERSION,',
            '        SAVEFILE_SIZE,',
            '        legacy658Checksum(data, SAVEFILE_SIZE),',
            '    };',
            '    {',
            '        std::ofstream out(tempPath, std::ios::binary | std::ios::trunc);',
            '        if (!out.write(reinterpret_cast<const char*>(&header), sizeof(header)) ||',
            '            !out.write(reinterpret_cast<const char*>(data), SAVEFILE_SIZE)) {',
            '            return false;',
            '        }',
            '        out.flush();',
            '        if (!out.good()) {',
            '            return false;',
            '        }',
            '    }',
            '    if (inspectLegacy658SaveAt(tempPath) != Legacy658SaveStatus::Valid) {',
            '        std::filesystem::remove(tempPath, ec);',
            '        return false;',
            '    }',
            '    std::filesystem::remove(backupPath, ec);',
            '    ec.clear();',
            '    if (std::filesystem::exists(path, ec) && !ec) {',
            '        std::filesystem::rename(path, backupPath, ec);',
            '        if (ec) {',
            '            std::filesystem::remove(tempPath);',
            '            return false;',
            '        }',
            '    }',
            '    ec.clear();',
            '    std::filesystem::rename(tempPath, path, ec);',
            '    if (ec) {',
            '        std::error_code restoreEc;',
            '        if (std::filesystem::exists(backupPath, restoreEc) && !restoreEc) {',
            '            std::filesystem::rename(backupPath, path, restoreEc);',
            '        }',
            '        return false;',
            '    }',
            '    if (inspectLegacy658SaveAt(path) != Legacy658SaveStatus::Valid) {',
            '        return false;',
            '    }',
            '    std::filesystem::remove(backupPath, ec);',
            '    return true;',
            '}',
            '}  // namespace',
            '#endif',
            '',
            '#if PLATFORM_WII'
          ) -join "`n"
          if (-not $memCard.Contains($helperAnchor)) {
            throw 'Legacy 658 direct-save helper anchor changed.'
          }
          $memCard = $memCard.Replace($helperAnchor, $helperReplacement)

          $threadInitOld = @(
            '    #if !PLATFORM_SHIELD',
            '    CARDSetLoadType((CARDFileType)dusk::getSettings().backend.cardFileType.getValue());',
            '',
            '    char version[5] = {};',
            '    char maker[3] = {};',
            '    std::memcpy(version, dusk::version::getDiskID().gameName, 4);',
            '    std::memcpy(maker, dusk::version::getDiskID().company, 2);',
            '    CARDInit(version, maker);',
            '    #endif'
          ) -join "`n"
          $threadInitNew = @(
            '    #if defined(_UWP)',
            '    // Pre-2.0 Xbox Legacy build: CARD init is bypassed; direct-save state is',
            '    // assigned after the common controller fields are initialized below.',
            '    #elif !PLATFORM_SHIELD',
            '    CARDSetLoadType((CARDFileType)dusk::getSettings().backend.cardFileType.getValue());',
            '',
            '    char version[5] = {};',
            '    char maker[3] = {};',
            '    std::memcpy(version, dusk::version::getDiskID().gameName, 4);',
            '    std::memcpy(maker, dusk::version::getDiskID().company, 2);',
            '    CARDInit(version, maker);',
            '    #endif'
          ) -join "`n"
          if (-not $memCard.Contains($threadInitOld)) {
            throw 'Legacy 658 direct-save ThdInit anchor changed.'
          }
          $memCard = $memCard.Replace($threadInitOld, $threadInitNew)

          $stateInitOld = @(
            '    mCopyToPos = 0;',
            '    mProbeStat = 2;',
            '    mCardState = CARD_STATE_NO_CARD_e;'
          ) -join "`n"
          $stateInitNew = @(
            '    mCopyToPos = 0;',
            '    mProbeStat = 2;',
            '#if defined(_UWP)',
            '    const auto directStatus = inspectLegacy658Save();',
            '    mCardState = directStatus == Legacy658SaveStatus::Valid ? CARD_STATE_READY_e :',
            '        directStatus == Legacy658SaveStatus::Missing ? CARD_STATE_NO_FILE_e : CARD_STATE_FATAL_ERROR_e;',
            '    field_0x1fc8 = 1;',
            '#else',
            '    mCardState = CARD_STATE_NO_CARD_e;',
            '#endif'
          ) -join "`n"
          if (-not $memCard.Contains($stateInitOld)) {
            throw 'Legacy 658 direct-save state-init anchor changed.'
          }
          $memCard = $memCard.Replace($stateInitOld, $stateInitNew)

          $commandOld = @(
            '#if TARGET_PC',
            '    mCardCommand = COMM_ATTACH_e;',
            '#else',
            '    mCardCommand = COMM_NONE_e;',
            '#endif'
          ) -join "`n"
          $commandNew = @(
            '#if defined(_UWP)',
            '    mCardCommand = COMM_NONE_e;',
            '#elif TARGET_PC',
            '    mCardCommand = COMM_ATTACH_e;',
            '#else',
            '    mCardCommand = COMM_NONE_e;',
            '#endif'
          ) -join "`n"
          if (-not $memCard.Contains($commandOld)) {
            throw 'Legacy 658 direct-save command initialization anchor changed.'
          }
          $memCard = $memCard.Replace($commandOld, $commandNew)

          $updateOld = 'void mDoMemCd_Ctrl_c::update() {'
          $updateNew = @(
            'void mDoMemCd_Ctrl_c::update() {',
            '#if defined(_UWP)',
            '    return;',
            '#endif'
          ) -join "`n"
          if (-not $memCard.Contains($updateOld)) {
            throw 'Legacy 658 direct-save update anchor changed.'
          }
          $memCard = $memCard.Replace($updateOld, $updateNew)

          $loadOld = @(
            'void mDoMemCd_Ctrl_c::load() {',
            '    if (OSTryLockMutex(&mMutex)) {',
            '        field_0x1fc8 = 0;',
            '        mCardCommand = COMM_RESTORE_e;',
            '        OSUnlockMutex(&mMutex);',
            '        OSSignalCond(&mCond);',
            '    }',
            '}'
          ) -join "`n"
          $loadNew = @(
            'void mDoMemCd_Ctrl_c::load() {',
            '#if defined(_UWP)',
            '    if (OSTryLockMutex(&mMutex)) {',
            '        field_0x1fc8 = 0;',
            '        if (readLegacy658Save(mData)) {',
            '            mDataVersion = SAVEDATA_VERSION;',
            '            mCardState = CARD_STATE_READ_e;',
            '        } else {',
            '            const auto directStatus = inspectLegacy658Save();',
            '            mCardState = directStatus == Legacy658SaveStatus::Missing ?',
            '                CARD_STATE_NO_FILE_e : CARD_STATE_FATAL_ERROR_e;',
            '        }',
            '        field_0x1fc8 = 1;',
            '        OSUnlockMutex(&mMutex);',
            '    }',
            '    return;',
            '#endif',
            '    if (OSTryLockMutex(&mMutex)) {',
            '        field_0x1fc8 = 0;',
            '        mCardCommand = COMM_RESTORE_e;',
            '        OSUnlockMutex(&mMutex);',
            '        OSSignalCond(&mCond);',
            '    }',
            '}'
          ) -join "`n"
          if (-not $memCard.Contains($loadOld)) {
            throw 'Legacy 658 direct-save load anchor changed.'
          }
          $memCard = $memCard.Replace($loadOld, $loadNew)

          $saveOld = @(
            'void mDoMemCd_Ctrl_c::save(void* i_buffer, u32 i_size, u32 i_position) {',
            '    if (OSTryLockMutex(&mMutex)) {',
            '        memcpy(&mData[i_position], i_buffer, i_size);',
            '        field_0x1fc8 = 0;',
            '        mCardCommand = COMM_STORE_e;',
            '        OSUnlockMutex(&mMutex);',
            '        OSSignalCond(&mCond);',
            '    }',
            '}'
          ) -join "`n"
          $saveNew = @(
            'void mDoMemCd_Ctrl_c::save(void* i_buffer, u32 i_size, u32 i_position) {',
            '#if defined(_UWP)',
            '    if (OSTryLockMutex(&mMutex)) {',
            '        memcpy(&mData[i_position], i_buffer, i_size);',
            '        field_0x1fc8 = 0;',
            '        mCardState = writeLegacy658Save(mData) ? CARD_STATE_WRITE_e : CARD_STATE_FATAL_ERROR_e;',
            '        field_0x1fc8 = 1;',
            '        OSUnlockMutex(&mMutex);',
            '    }',
            '    return;',
            '#endif',
            '    if (OSTryLockMutex(&mMutex)) {',
            '        memcpy(&mData[i_position], i_buffer, i_size);',
            '        field_0x1fc8 = 0;',
            '        mCardCommand = COMM_STORE_e;',
            '        OSUnlockMutex(&mMutex);',
            '        OSSignalCond(&mCond);',
            '    }',
            '}'
          ) -join "`n"
          if (-not $memCard.Contains($saveOld)) {
            throw 'Legacy 658 direct-save write anchor changed.'
          }
          $memCard = $memCard.Replace($saveOld, $saveNew)

          $formatOld = @(
            'void mDoMemCd_Ctrl_c::command_format() {',
            '    if (OSTryLockMutex(&mMutex)) {',
            '        mCardCommand = COMM_FORMAT_e;',
            '        OSUnlockMutex(&mMutex);',
            '        OSSignalCond(&mCond);',
            '    }',
            '}'
          ) -join "`n"
          $formatNew = @(
            'void mDoMemCd_Ctrl_c::command_format() {',
            '#if defined(_UWP)',
            '    if (OSTryLockMutex(&mMutex)) {',
            '        std::error_code ec;',
            '        std::filesystem::remove(legacy658SavePath(), ec);',
            '        auto backup = legacy658SavePath();',
            '        backup += ".bak";',
            '        std::filesystem::remove(backup, ec);',
            '        mCardState = CARD_STATE_FORMAT_e;',
            '        field_0x1fc8 = 1;',
            '        OSUnlockMutex(&mMutex);',
            '    }',
            '    return;',
            '#endif',
            '    if (OSTryLockMutex(&mMutex)) {',
            '        mCardCommand = COMM_FORMAT_e;',
            '        OSUnlockMutex(&mMutex);',
            '        OSSignalCond(&mCond);',
            '    }',
            '}'
          ) -join "`n"
          if (-not $memCard.Contains($formatOld)) {
            throw 'Legacy 658 direct-save format anchor changed.'
          }
          $memCard = $memCard.Replace($formatOld, $formatNew)

          [IO.File]::WriteAllText($memCardPath, $memCard, [Text.UTF8Encoding]::new($false))

          # Put all Randomizer config/presets/seeds beside the selected DevelopmentFiles ISO.
          $randoConfigPath = "$env:TPR_SRC\src\dusk\ui\rando_config.cpp"
          $randoConfig = [IO.File]::ReadAllText($randoConfigPath).Replace("`r`n", "`n")
          if (-not $randoConfig.Contains('#include "dusk/logging.h"')) {
            throw 'Legacy 658 randomizer storage include anchor changed.'
          }
          if (-not $randoConfig.Contains('#include "dusk/settings.h"')) {
            $randoConfig = $randoConfig.Replace(
              '#include "dusk/logging.h"',
              ('#include "dusk/logging.h"' + "`n" + '#include "dusk/settings.h"'))
          }

          $randoPathOld = @(
            'std::filesystem::path GetRandomizerPath() {',
            '    return data::configured_data_path() / "randomizer";',
            '}'
          ) -join "`n"
          $randoPathNew = @(
            'std::filesystem::path GetRandomizerPath() {',
            '#if defined(_UWP)',
            '    const std::string isoPathText = getSettings().backend.isoPath.getValue();',
            '    if (!isoPathText.empty()) {',
            '        const std::filesystem::path isoPath{isoPathText};',
            '        const auto parent = isoPath.parent_path();',
            '        if (!parent.empty()) {',
            '            const auto root = parent / "Legacy658Data" / "randomizer";',
            '            std::error_code ec;',
            '            std::filesystem::create_directories(root, ec);',
            '            if (!ec) {',
            '                return root;',
            '            }',
            '            DuskLog.error("Could not create Legacy658 DevelopmentFiles randomizer root: {}", ec.message());',
            '        }',
            '    }',
            '#endif',
            '    return data::configured_data_path() / "randomizer";',
            '}'
          ) -join "`n"
          if (-not $randoConfig.Contains($randoPathOld)) {
            throw 'Legacy 658 randomizer data-root anchor changed.'
          }
          $randoConfig = $randoConfig.Replace($randoPathOld, $randoPathNew)
          [IO.File]::WriteAllText($randoConfigPath, $randoConfig, [Text.UTF8Encoding]::new($false))

          # Restore the original pre-2.0 blank-file Play Type flow on Xbox/UWP.
          # Upstream keeps this flow behind TARGET_PC; the UWP build needs only these exact
          # old file-select pieces enabled, not any Dusklight 2.0 launcher/menu behavior.
          $fileSelectHeaderPath = "$env:TPR_SRC\include\d\d_file_select.h"
          $fileSelectSourcePath = "$env:TPR_SRC\src\d\d_file_select.cpp"
          $fileSelectHeader = [IO.File]::ReadAllText($fileSelectHeaderPath).Replace("`r`n", "`n")
          $fileSelectSource = [IO.File]::ReadAllText($fileSelectSourcePath).Replace("`r`n", "`n")

          $headerReplacements = @(
            @(
              "#if TARGET_PC`n        DATASELPROC_SELECT_DATA_PLAY_MOVE, // Select between vanilla or randomizer play",
              "#if TARGET_PC || defined(_UWP)`n        DATASELPROC_SELECT_DATA_PLAY_MOVE, // Select between vanilla or randomizer play"
            ),
            @(
              "#if TARGET_PC`n    void selectDataPlayTypeMove();",
              "#if TARGET_PC || defined(_UWP)`n    void selectDataPlayTypeMove();"
            ),
            @(
              "#if TARGET_PC`n        MEMCARDCHECKPROC_AUTO_MAKE_GAMEFILE,",
              "#if TARGET_PC || defined(_UWP)`n        MEMCARDCHECKPROC_AUTO_MAKE_GAMEFILE,"
            ),
            @(
              "#if TARGET_PC`n    void MemCardAutoMakeGameFile();",
              "#if TARGET_PC || defined(_UWP)`n    void MemCardAutoMakeGameFile();"
            ),
            @(
              "#ifdef TARGET_PC`n    struct mDusk {",
              "#if defined(TARGET_PC) || defined(_UWP)`n    struct mDusk {"
            ),
            @(
              "#ifdef TARGET_PC`nSTATIC_ASSERT(sizeof(dFile_select_c) == 0x237C + sizeof(dFile_select_c::mDusk));",
              "#if defined(TARGET_PC) || defined(_UWP)`nSTATIC_ASSERT(sizeof(dFile_select_c) == 0x237C + sizeof(dFile_select_c::mDusk));"
            )
          )
          foreach ($pair in $headerReplacements) {
            if (-not $fileSelectHeader.Contains($pair[0])) {
              throw "Legacy 658 Play Type header anchor changed: $($pair[0])"
            }
            $fileSelectHeader = $fileSelectHeader.Replace($pair[0], $pair[1])
          }

          $sourceReplacements = @(
            @(
              "#if TARGET_PC`n#include ""dusk/config.hpp""",
              "#if TARGET_PC || defined(_UWP)`n#include ""dusk/config.hpp"""
            ),
            @(
              "#if TARGET_PC`n    &dFile_select_c::selectDataPlayTypeMove,",
              "#if TARGET_PC || defined(_UWP)`n    &dFile_select_c::selectDataPlayTypeMove,"
            ),
            @(
              "#if TARGET_PC`n// Custom Proc to allow the player to select the play type and a randomizer seed",
              "#if TARGET_PC || defined(_UWP)`n// Custom Proc to allow the player to select the play type and a randomizer seed"
            ),
            @(
              "#if TARGET_PC`n        mDataSelProc = DATASELPROC_SELECT_DATA_PLAY_MOVE;",
              "#if TARGET_PC || defined(_UWP)`n        mDataSelProc = DATASELPROC_SELECT_DATA_PLAY_MOVE;"
            ),
            @(
              "#if TARGET_PC`n        // Load the randomizer seed if one is tied to this file",
              "#if TARGET_PC || defined(_UWP)`n        // Load the randomizer seed if one is tied to this file"
            ),
            @(
              "#if TARGET_PC`n    // Delay this animation to make for a smoother transition from the Rmlui menus",
              "#if TARGET_PC || defined(_UWP)`n    // Delay this animation to make for a smoother transition from the Rmlui menus"
            ),
            @(
              "#if TARGET_PC`n        // Create a randomizer save if one is selected",
              "#if TARGET_PC || defined(_UWP)`n        // Create a randomizer save if one is selected"
            ),
            @(
              "#if TARGET_PC`n    &dFile_select_c::MemCardAutoMakeGameFile,",
              "#if TARGET_PC || defined(_UWP)`n    &dFile_select_c::MemCardAutoMakeGameFile,"
            ),
            @(
              "#if TARGET_PC`n    case 1: { // no save file",
              "#if TARGET_PC || defined(_UWP)`n    case 1: { // no save file"
            ),
            @(
              "#if TARGET_PC`nvoid dFile_select_c::MemCardAutoMakeGameFile() {",
              "#if TARGET_PC || defined(_UWP)`nvoid dFile_select_c::MemCardAutoMakeGameFile() {"
            )
          )
          foreach ($pair in $sourceReplacements) {
            if (-not $fileSelectSource.Contains($pair[0])) {
              throw "Legacy 658 Play Type source anchor changed: $($pair[0])"
            }
            $fileSelectSource = $fileSelectSource.Replace($pair[0], $pair[1])
          }

          [IO.File]::WriteAllText(
            $fileSelectHeaderPath, $fileSelectHeader, [Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllText(
            $fileSelectSourcePath, $fileSelectSource, [Text.UTF8Encoding]::new($false))

          foreach ($marker in @(
            'legacy658-xbox.sav',
            'Legacy658Data',
            'writeLegacy658Save(mData)',
            'readLegacy658Save(mData)',
            'mCardCommand = COMM_NONE_e;',
            'const auto root = parent / "Legacy658Data" / "randomizer";',
            'DATASELPROC_SELECT_DATA_PLAY_MOVE',
            '.title = "Play Type"',
            '.label = "Vanilla"',
            '.label = "Randomizer"',
            'MEMCARDCHECKPROC_AUTO_MAKE_GAMEFILE')) {
            if (-not ($memCard.Contains($marker) -or $randoConfig.Contains($marker))) {
              throw "Legacy 658 direct-save/storage marker missing: $marker"
            }
          }

          git -C "$env:TPR_SRC" diff --check
          if ($LASTEXITCODE -ne 0) {
            throw 'Legacy 658 direct-save/storage backport introduced a source formatting error.'
          }

      - name: Emit patch mismatch diagnostics
        if: failure()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostics = Join-Path $env:GITHUB_WORKSPACE 'TPR-Patch-Diagnostics'
          Get-ChildItem -LiteralPath $diagnostics -File | Sort-Object Name | ForEach-Object {
            Write-Host "TPR_DIAG_BEGIN:$($_.Name)"
            $encoded = [Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName))
            for ($offset = 0; $offset -lt $encoded.Length; $offset += 12000) {
              $length = [Math]::Min(12000, $encoded.Length - $offset)
              Write-Host $encoded.Substring($offset, $length)
            }
            Write-Host "TPR_DIAG_END:$($_.Name)"
          }

      - name: Run the complete .658 regression and feature-contract suite
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          if ($LASTEXITCODE -ne 0) { throw 'Could not install the pinned PyYAML test dependency.' }
          Push-Location "$env:TPR_SRC"
          try {
            python -m unittest discover -s 'tools\tests' -v
            if ($LASTEXITCODE -ne 0) { throw 'The complete .658 regression suite failed.' }
          }
          finally {
            Pop-Location
          }

