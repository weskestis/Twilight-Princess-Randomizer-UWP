name: Build Dusklight 2.0.1 Xbox 668

on:
  push:
    branches:
      - codex/dusklight2-xbox-660-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xbox-uwp-x64:
    name: Xbox UWP x64 package
    runs-on: windows-2022
    timeout-minutes: 240

    steps:
      - name: Check out build controls
        uses: actions/checkout@v4
        with:
          path: _control

      - name: Enable MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare short build paths
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config --global core.longpaths true
          git config --global core.autocrlf false
          if (Test-Path 'S:\') { subst S: /D | Out-Null }
          subst S: "$env:GITHUB_WORKSPACE"
          New-Item -ItemType Directory -Force S:\tmp,S:\b | Out-Null
          "TPR_CONTROL=S:\_control" >> $env:GITHUB_ENV
          "TPR_SRC=S:\s" >> $env:GITHUB_ENV
          "TPR_UWP_DEP=S:\u" >> $env:GITHUB_ENV
          "TPR_FEED=S:\b\feed" >> $env:GITHUB_ENV
          "TPR_PKG=S:\b\package" >> $env:GITHUB_ENV
          "TPR_MOD_INSPECT=S:\b\mod-inspect" >> $env:GITHUB_ENV
          "TPR_MSIX_INSPECT=S:\b\msix-inspect" >> $env:GITHUB_ENV
          "TMP=S:\tmp" >> $env:GITHUB_ENV
          "TEMP=S:\tmp" >> $env:GITHUB_ENV
          choco install ninja -y --no-progress
          cmake --version
          ninja --version
          Get-Command cl | Select-Object -ExpandProperty Source

      - name: Fetch exact source and UWP dependency revisions
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git init "$env:TPR_SRC"
          git -C "$env:TPR_SRC" remote add origin https://github.com/TwilitRealm/dusklight.git
          git -C "$env:TPR_SRC" fetch --depth 1 origin 422d7bb1b6c8d973cccf8b3d0b226a57ac3cc8c7
          git -C "$env:TPR_SRC" checkout --detach FETCH_HEAD
          git -C "$env:TPR_SRC" submodule update --init --recursive --depth 1
          git -C "$env:TPR_SRC\mods\randomizer" fetch --depth 1 origin d0ceae8f18bbef4a40287a72a2791a3c06c9aca5
          git -C "$env:TPR_SRC\mods\randomizer" checkout --detach FETCH_HEAD

          git init "$env:TPR_UWP_DEP"
          git -C "$env:TPR_UWP_DEP" remote add origin https://github.com/SternXD/uwp-dep.git
          git -C "$env:TPR_UWP_DEP" fetch --depth 1 origin 810cdcb672383045a8b03d1d55bb535352d7d46f
          git -C "$env:TPR_UWP_DEP" checkout --detach FETCH_HEAD

          $pins = @{
            "$env:TPR_SRC" = '422d7bb1b6c8d973cccf8b3d0b226a57ac3cc8c7'
            "$env:TPR_SRC\extern\aurora" = 'd0933b745abe0eb9815bedcea8047575da18698d'
            "$env:TPR_SRC\extern\borealis" = '0bdba6c50a46409c4862474c72b4a3a631fbe0ec'
            "$env:TPR_SRC\mods\randomizer" = 'd0ceae8f18bbef4a40287a72a2791a3c06c9aca5'
            "$env:TPR_SRC\mods\cosmetics" = 'fd93491089fa95441789244f2b2fd22a451ecbcc'
            "$env:TPR_UWP_DEP" = '810cdcb672383045a8b03d1d55bb535352d7d46f'
          }
          foreach ($entry in $pins.GetEnumerator()) {
            $actual = (git -C $entry.Key rev-parse HEAD).Trim()
            if ($actual -ne $entry.Value) {
              throw "Revision mismatch for $($entry.Key): expected $($entry.Value), got $actual"
            }
          }

          # Pin the current Dusklight UWP dependency set. This pairs Aurora's
          # expected Dawn revision with an SDL build that uses the Store CRT.
          $sdl = "$env:TPR_UWP_DEP\x64\bin\SDL3.dll"
          $dawn = "$env:TPR_UWP_DEP\x64\bin\webgpu_dawn.dll"
          $expectedSdlHash = 'f288fd682ea19fa82bf9bbbfefab4132853555ad6dfe37cbe9f9c55acff4bf06'
          $expectedDawnHash = 'd1126d70c0eee87d69b802d10527d3dc301fce7514a206112ed4056cbf5b6910'
          $actualSdlHash = (Get-FileHash $sdl -Algorithm SHA256).Hash.ToLowerInvariant()
          $actualDawnHash = (Get-FileHash $dawn -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSdlHash -ne $expectedSdlHash) {
            throw "Pinned UWP SDL3 hash mismatch: $actualSdlHash"
          }
          if ($actualDawnHash -ne $expectedDawnHash) {
            throw "Pinned UWP Dawn hash mismatch: $actualDawnHash"
          }
          $expectedImportHashes = @{
            'SDL3.lib' = '474423aa48a7760a236b8394b82559cfa37c5e33c430029c328a09496c0e4f7b'
            'webgpu_dawn.lib' = '051ce8d5ee93e7de14c482da735be0dd41dddf51fc8acb14221c468a14d49a99'
          }
          foreach ($entry in $expectedImportHashes.GetEnumerator()) {
            $actual = (Get-FileHash "$env:TPR_UWP_DEP\x64\lib\$($entry.Key)" `
              -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $entry.Value) {
              throw "Pinned UWP import library hash mismatch for $($entry.Key): $actual"
            }
          }
          $sdlBytes = [IO.File]::ReadAllBytes($sdl)
          $peOffset = [BitConverter]::ToInt32($sdlBytes, 0x3c)
          if ([BitConverter]::ToUInt32($sdlBytes, $peOffset) -ne 0x00004550) {
            throw 'Pinned SDL3.dll has no valid PE signature.'
          }
          $sdlImports = & dumpbin /nologo /imports $sdl | Out-String
          foreach ($desktopCrt in @('MSVCP140.dll','VCRUNTIME140.dll','VCRUNTIME140_1.dll','vccorlib140.dll')) {
            if ($sdlImports -match "(?im)^\s*$([regex]::Escape($desktopCrt))\s*$") {
              throw "Pinned SDL3.dll imports unavailable desktop CRT: $desktopCrt"
            }
          }
          foreach ($appCrt in @('MSVCP140_APP.dll','VCRUNTIME140_APP.dll','VCRUNTIME140_1_APP.dll','vccorlib140_app.dll')) {
            if ($sdlImports -notmatch "(?im)^\s*$([regex]::Escape($appCrt))\s*$") {
              throw "Pinned SDL3.dll is missing UWP CRT import: $appCrt"
            }
          }

      - name: Apply reviewed source layers and advance 668 identity
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          function Expand-ControlPatch {
            param(
              [string]$Stem,
              [string]$EncodedHash,
              [string]$GzipHash,
              [string]$PatchHash
            )
            $parts = @(Get-ChildItem "$env:TPR_CONTROL\patches\$Stem.patch.gz.b64.part*" -File |
              Sort-Object Name)
            if ($parts.Count -lt 1) { throw "No encoded parts found for $Stem" }
            if ($parts.Count -eq 1) {
              $normalizedEncoded = (Get-Content $parts[0].FullName -Raw) -replace "`r`n", "`n"
              $hasher = [Security.Cryptography.SHA256]::Create()
              try {
                $digest = $hasher.ComputeHash([Text.Encoding]::UTF8.GetBytes($normalizedEncoded))
                $actualEncodedHash = ([BitConverter]::ToString($digest) -replace '-', '').ToLowerInvariant()
              }
              finally { $hasher.Dispose() }
              if ($actualEncodedHash -ne $EncodedHash) {
                throw "$Stem encoded SHA-256 mismatch: $actualEncodedHash"
              }
            }
            $encoded = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
            $gzipPath = Join-Path $env:RUNNER_TEMP "$Stem.patch.gz"
            [IO.File]::WriteAllBytes($gzipPath, [Convert]::FromBase64String($encoded))
            $actualGzipHash = (Get-FileHash $gzipPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualGzipHash -ne $GzipHash) {
              throw "$Stem gzip SHA-256 mismatch: $actualGzipHash"
            }
            $patchPath = Join-Path $env:RUNNER_TEMP "$Stem.patch"
            $input = [IO.File]::OpenRead($gzipPath)
            try {
              $decoder = [IO.Compression.GZipStream]::new(
                $input, [IO.Compression.CompressionMode]::Decompress)
              try {
                $output = [IO.File]::Create($patchPath)
                try { $decoder.CopyTo($output) }
                finally { $output.Dispose() }
              }
              finally { $decoder.Dispose() }
            }
            finally { $input.Dispose() }
            $actualPatchHash = (Get-FileHash $patchPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualPatchHash -ne $PatchHash) {
              throw "$Stem decoded SHA-256 mismatch: $actualPatchHash"
            }
            return $patchPath
          }

          $duskPatch = Expand-ControlPatch `
            'dusklight201-uwp-662' `
            '82302f5d940161c1458950a3352bc71048f379a2a39b884d2eddbce227c415bc' `
            '095f123e3469f636f7491f6e6b092e8a0bf097a926a9b34ae736382e159fc123' `
            '7ea1bb82f45f54c333f682639250986930628cab71d2353d58cf9688b243f393'
          $auroraPatch = Expand-ControlPatch `
            'aurora-uwp-662' `
            '99424654b2a37f8f3ec5f1d6b878864d5a20f09786e440beaecf187a623626c2' `
            '2edc6756bde2af85832970d9b5223b4918eb1d2f9387d653a86e9ba43292fc31' `
            '24173d1d5328aed26ec73756d644e670420d271269dc0553ca57b90a643e22dc'
          $randomizerPatch = Expand-ControlPatch `
            'randomizer-662-checkpoint' `
            '1d89f69d1cc7cb04e2f1b0efed2e06749b4704d82d790920cafdb69992e22198' `
            '6d269e542e5472021eb413131cb5e150739a856a4843b18c9fade4a7ddbd06cf' `
            'a7d7986b7c33cbf025e3290fd75074dc5d59ab1cf014aea952d3ecf439b6c4cc'
          $moduleUwpPatchSource = "$env:TPR_CONTROL\patches\xbox-appcontainer-module-663.patch"
          $moduleUwpPatchText = [IO.File]::ReadAllText($moduleUwpPatchSource).Replace("`r`n", "`n")
          $hasher = [Security.Cryptography.SHA256]::Create()
          try {
            $moduleUwpPatchDigest = $hasher.ComputeHash(
              [Text.Encoding]::UTF8.GetBytes($moduleUwpPatchText))
            $moduleUwpPatchHash = ([BitConverter]::ToString($moduleUwpPatchDigest) -replace '-', '').ToLowerInvariant()
          }
          finally { $hasher.Dispose() }
          if ($moduleUwpPatchHash -ne '835512c284d2ff687fc352afb7b7d1236b2c57dcbed39583217ee70f27c892c7') {
            throw "Xbox AppContainer module patch SHA-256 mismatch: $moduleUwpPatchHash"
          }
          $moduleUwpPatch = Join-Path $env:RUNNER_TEMP 'xbox-appcontainer-module-663.patch'
          [IO.File]::WriteAllText(
            $moduleUwpPatch, $moduleUwpPatchText, [Text.UTF8Encoding]::new($false))

          $packagedModPatchSource = "$env:TPR_CONTROL\patches\xbox-packaged-randomizer-664.patch"
          $packagedModPatchText = [IO.File]::ReadAllText($packagedModPatchSource).Replace("`r`n", "`n")
          $hasher = [Security.Cryptography.SHA256]::Create()
          try {
            $packagedModPatchDigest = $hasher.ComputeHash(
              [Text.Encoding]::UTF8.GetBytes($packagedModPatchText))
            $packagedModPatchHash = ([BitConverter]::ToString($packagedModPatchDigest) -replace '-', '').ToLowerInvariant()
          }
          finally { $hasher.Dispose() }
          if ($packagedModPatchHash -ne '4869f13d36b8e2fe2c335ed477f7381ef4fbd483474434d1b3cc60ee078198cc') {
            throw "Xbox packaged Randomizer patch SHA-256 mismatch: $packagedModPatchHash"
          }
          $packagedModPatch = Join-Path $env:RUNNER_TEMP 'xbox-packaged-randomizer-664.patch'
          [IO.File]::WriteAllText(
            $packagedModPatch, $packagedModPatchText, [Text.UTF8Encoding]::new($false))

          $startupGuardPatchSource = "$env:TPR_CONTROL\patches\xbox-startup-guard-665.patch"
          $startupGuardPatchText = [IO.File]::ReadAllText($startupGuardPatchSource).Replace("`r`n", "`n")
          $hasher = [Security.Cryptography.SHA256]::Create()
          try {
            $startupGuardPatchDigest = $hasher.ComputeHash(
              [Text.Encoding]::UTF8.GetBytes($startupGuardPatchText))
            $startupGuardPatchHash = ([BitConverter]::ToString($startupGuardPatchDigest) -replace '-', '').ToLowerInvariant()
          }
          finally { $hasher.Dispose() }
          if ($startupGuardPatchHash -ne 'd1e1603a607c007244f5a35285d507ebf1d5ec8476cc5cd040be9c24e7c84713') {
            throw "Xbox startup guard patch SHA-256 mismatch: $startupGuardPatchHash"
          }
          $startupGuardPatch = Join-Path $env:RUNNER_TEMP 'xbox-startup-guard-665.patch'
          [IO.File]::WriteAllText(
            $startupGuardPatch, $startupGuardPatchText, [Text.UTF8Encoding]::new($false))

          $threadAffinityPatchSource = "$env:TPR_CONTROL\patches\xbox-uwp-thread-affinity-666.patch"
          $threadAffinityPatchText = [IO.File]::ReadAllText($threadAffinityPatchSource).Replace("`r`n", "`n")
          $hasher = [Security.Cryptography.SHA256]::Create()
          try {
            $threadAffinityPatchDigest = $hasher.ComputeHash(
              [Text.Encoding]::UTF8.GetBytes($threadAffinityPatchText))
            $threadAffinityPatchHash = ([BitConverter]::ToString($threadAffinityPatchDigest) -replace '-', '').ToLowerInvariant()
          }
          finally { $hasher.Dispose() }
          if ($threadAffinityPatchHash -ne '9b864a38ab17d1b3e6563c1c29a292966784639781239e48791482c64db7531f') {
            throw "Xbox UWP thread-affinity patch SHA-256 mismatch: $threadAffinityPatchHash"
          }
          $threadAffinityPatch = Join-Path $env:RUNNER_TEMP 'xbox-uwp-thread-affinity-666.patch'
          [IO.File]::WriteAllText(
            $threadAffinityPatch, $threadAffinityPatchText, [Text.UTF8Encoding]::new($false))

          $dawnCacheApiPatchSource = "$env:TPR_CONTROL\patches\aurora-dawn-cache-api-668.patch"
          $dawnCacheApiPatchText = [IO.File]::ReadAllText($dawnCacheApiPatchSource).Replace("`r`n", "`n")
          $hasher = [Security.Cryptography.SHA256]::Create()
          try {
            $dawnCacheApiPatchDigest = $hasher.ComputeHash(
              [Text.Encoding]::UTF8.GetBytes($dawnCacheApiPatchText))
            $dawnCacheApiPatchHash = ([BitConverter]::ToString(
              $dawnCacheApiPatchDigest) -replace '-', '').ToLowerInvariant()
          }
          finally { $hasher.Dispose() }
          if ($dawnCacheApiPatchHash -ne '6b7ad75131e815f3e5e1ea54c89c40cc853f4ab1ed0ec22ae7386994fb357e7f') {
            throw "Aurora Dawn cache API patch SHA-256 mismatch: $dawnCacheApiPatchHash"
          }
          $dawnCacheApiPatch = Join-Path $env:RUNNER_TEMP 'aurora-dawn-cache-api-668.patch'
          [IO.File]::WriteAllText(
            $dawnCacheApiPatch, $dawnCacheApiPatchText, [Text.UTF8Encoding]::new($false))

          $funchookModuleBasePatchSource = "$env:TPR_CONTROL\patches\xbox-uwp-funchook-module-base-667.patch"
          $funchookModuleBasePatchText = [IO.File]::ReadAllText($funchookModuleBasePatchSource).Replace("`r`n", "`n")
          $hasher = [Security.Cryptography.SHA256]::Create()
          try {
            $funchookModuleBasePatchDigest = $hasher.ComputeHash(
              [Text.Encoding]::UTF8.GetBytes($funchookModuleBasePatchText))
            $funchookModuleBasePatchHash = ([BitConverter]::ToString($funchookModuleBasePatchDigest) -replace '-', '').ToLowerInvariant()
          }
          finally { $hasher.Dispose() }
          if ($funchookModuleBasePatchHash -ne 'f61ee177fedaaced7024d21c481a5b35c3fb3ea1b08f7dd9b40c47ab796cea5e') {
            throw "Xbox UWP Funchook module-base patch SHA-256 mismatch: $funchookModuleBasePatchHash"
          }
          $funchookModuleBasePatch = Join-Path $env:RUNNER_TEMP 'xbox-uwp-funchook-module-base-667.patch'
          [IO.File]::WriteAllText(
            $funchookModuleBasePatch,
            $funchookModuleBasePatchText,
            [Text.UTF8Encoding]::new($false))

          $staticRandomizerPatchSource = "$env:TPR_CONTROL\patches\xbox-static-randomizer-668.patch"
          $staticRandomizerPatchText = [IO.File]::ReadAllText(
            $staticRandomizerPatchSource).Replace("`r`n", "`n")
          $hasher = [Security.Cryptography.SHA256]::Create()
          try {
            $staticRandomizerPatchDigest = $hasher.ComputeHash(
              [Text.Encoding]::UTF8.GetBytes($staticRandomizerPatchText))
            $staticRandomizerPatchHash = ([BitConverter]::ToString(
              $staticRandomizerPatchDigest) -replace '-', '').ToLowerInvariant()
          }
          finally { $hasher.Dispose() }
          if ($staticRandomizerPatchHash -ne '0de7287ba0cc922ce076a81224d1a3d9c101974fcd1312cb3c4f94e7f6735566') {
            throw "Xbox static Randomizer patch SHA-256 mismatch: $staticRandomizerPatchHash"
          }
          $staticRandomizerPatch = Join-Path $env:RUNNER_TEMP 'xbox-static-randomizer-668.patch'
          [IO.File]::WriteAllText(
            $staticRandomizerPatch,
            $staticRandomizerPatchText,
            [Text.UTF8Encoding]::new($false))

          $sdlMainHandledPatchSource = "$env:TPR_CONTROL\patches\uwp-sdl-main-handled-668.patch"
          $sdlMainHandledPatchText = [IO.File]::ReadAllText(
            $sdlMainHandledPatchSource).Replace("`r`n", "`n")
          $hasher = [Security.Cryptography.SHA256]::Create()
          try {
            $sdlMainHandledPatchDigest = $hasher.ComputeHash(
              [Text.Encoding]::UTF8.GetBytes($sdlMainHandledPatchText))
            $sdlMainHandledPatchHash = ([BitConverter]::ToString(
              $sdlMainHandledPatchDigest) -replace '-', '').ToLowerInvariant()
          }
          finally { $hasher.Dispose() }
          if ($sdlMainHandledPatchHash -ne '90877b6c7e6fcbff29375b73d86c5da5f31669379f5284a41dcb154b7f4aa2a2') {
            throw "UWP SDL entry-point patch SHA-256 mismatch: $sdlMainHandledPatchHash"
          }
          $sdlMainHandledPatch = Join-Path $env:RUNNER_TEMP 'uwp-sdl-main-handled-668.patch'
          [IO.File]::WriteAllText(
            $sdlMainHandledPatch,
            $sdlMainHandledPatchText,
            [Text.UTF8Encoding]::new($false))

          git -C "$env:TPR_SRC" apply --check $duskPatch
          git -C "$env:TPR_SRC" apply $duskPatch
          git -C "$env:TPR_SRC" apply --check $moduleUwpPatch
          git -C "$env:TPR_SRC" apply $moduleUwpPatch
          git -C "$env:TPR_SRC" apply --check $packagedModPatch
          git -C "$env:TPR_SRC" apply $packagedModPatch
          git -C "$env:TPR_SRC" apply --check $startupGuardPatch
          git -C "$env:TPR_SRC" apply $startupGuardPatch
          git -C "$env:TPR_SRC" apply --check $funchookModuleBasePatch
          git -C "$env:TPR_SRC" apply $funchookModuleBasePatch
          git -C "$env:TPR_SRC" apply --check $staticRandomizerPatch
          git -C "$env:TPR_SRC" apply $staticRandomizerPatch
          git -C "$env:TPR_SRC" apply --check $sdlMainHandledPatch
          git -C "$env:TPR_SRC" apply $sdlMainHandledPatch
          $uwpBootstrapSource = [IO.File]::ReadAllText(
            "$env:TPR_SRC\platforms\uwp\main.cpp")
          foreach ($entryPointMarker in @(
            '#define SDL_MAIN_HANDLED',
            'int CALLBACK WinMain(',
            'SDL_RunApp(0, nullptr, bootstrap, nullptr)')) {
            if (-not $uwpBootstrapSource.Contains($entryPointMarker)) {
              throw "UWP bootstrap entry-point patch is missing: $entryPointMarker"
            }
          }
          $modSdkCmake = [IO.File]::ReadAllText("$env:TPR_SRC\cmake\ModSDK.cmake")
          if ($modSdkCmake.Contains(
              'target_compile_definitions(${target_name} PRIVATE DUSK_BUILDING_GAME=1)')) {
            throw 'Built-in Randomizer must retain mod SDK compile semantics.'
          }
          git -C "$env:TPR_SRC\extern\aurora" apply --check $auroraPatch
          git -C "$env:TPR_SRC\extern\aurora" apply $auroraPatch
          git -C "$env:TPR_SRC\extern\aurora" apply --check $threadAffinityPatch
          git -C "$env:TPR_SRC\extern\aurora" apply $threadAffinityPatch
          git -C "$env:TPR_SRC\extern\aurora" apply --check $dawnCacheApiPatch
          git -C "$env:TPR_SRC\extern\aurora" apply $dawnCacheApiPatch
          $gpuSource = [IO.File]::ReadAllText(
            "$env:TPR_SRC\extern\aurora\lib\webgpu\gpu.cpp")
          if ($gpuSource.Contains('cacheDescriptor.loadDataFunction') -or
              $gpuSource.Contains('cacheDescriptor.storeDataFunction') -or
              -not $gpuSource.Contains('cacheDescriptor.SetDawnLoadCacheDataCallback') -or
              -not $gpuSource.Contains('cacheDescriptor.SetDawnStoreCacheDataCallback')) {
            throw 'Aurora Dawn cache callbacks do not match the pinned UWP headers.'
          }
          git -C "$env:TPR_SRC\mods\randomizer" apply --check $randomizerPatch
          git -C "$env:TPR_SRC\mods\randomizer" apply $randomizerPatch

          git -C "$env:TPR_SRC" diff --check
          git -C "$env:TPR_SRC\extern\aurora" diff --check
          git -C "$env:TPR_SRC\mods\randomizer" diff --check

          $manifestPath = "$env:TPR_SRC\platforms\uwp\Package.appxmanifest"
          $manifest = [IO.File]::ReadAllText($manifestPath)
          if (-not $manifest.Contains('Version="1.4.1.662"')) {
            throw 'Reviewed source layer did not produce the expected 1.4.1.662 package identity.'
          }
          $manifest = $manifest.Replace('Version="1.4.1.662"', 'Version="1.4.1.668"')
          [IO.File]::WriteAllText($manifestPath, $manifest, [Text.UTF8Encoding]::new($false))
          git -C "$env:TPR_SRC" diff --check

      - name: Restore verified UWP artwork and pipeline cache
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archiveName = 'TwilightPrincessRandomizer_1.4.1.634_x64.msix'
          $archiveHash = 'ef24ae571b9ca6f647a63edbe4d6d81cf259b30eecfb203c2924001958bf917d'
          $downloadDir = Join-Path $env:RUNNER_TEMP 'uwp-assets-download'
          $extractDir = Join-Path $env:RUNNER_TEMP 'uwp-assets-extract'
          New-Item -ItemType Directory -Force $downloadDir,$extractDir | Out-Null
          gh release download tpr-cp20-source --repo "$env:GITHUB_REPOSITORY" `
            --pattern $archiveName --dir $downloadDir
          $archive = Join-Path $downloadDir $archiveName
          $actualHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $archiveHash) { throw "UWP asset archive hash mismatch: $actualHash" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory($archive, $extractDir)
          $assetDirectory = Get-Item (Join-Path $extractDir 'Assets')
          $pipelineCache = Get-Item (Join-Path $extractDir 'res\initial_pipeline_cache.db')
          New-Item -ItemType Directory -Force "$env:TPR_SRC\platforms\uwp\Assets" | Out-Null
          Copy-Item "$($assetDirectory.FullName)\*" `
            "$env:TPR_SRC\platforms\uwp\Assets" -Force
          Copy-Item $pipelineCache.FullName `
            "$env:TPR_SRC\res\initial_pipeline_cache.db" -Force

          $expected = @{
            'res\initial_pipeline_cache.db' = 'a7a7407fffc8eb1ec9474085434c92aa8871baab6dc5f65c22df1d2bc16522d6'
            'platforms\uwp\Assets\SplashScreen.scale-200.png' = 'cdf88cad0155e4043b0ad5ab320a89b869c92d85c4e041cf7515e558e52aa7c6'
            'platforms\uwp\Assets\Square310x310Logo.scale-200.png' = 'aad3032e897a1bf7e38b3ddc2350ca3d7d31bde71a20b0f66f70447c2004c66c'
          }
          foreach ($entry in $expected.GetEnumerator()) {
            $path = Join-Path $env:TPR_SRC $entry.Key
            $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $entry.Value) { throw "Restored UWP asset hash mismatch for $($entry.Key): $hash" }
          }

      - name: Verify Enemy Souls runtime integration
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $hooks = Get-Content "$env:TPR_SRC\mods\randomizer\src\hooks.cpp" -Raw
          $settings = Get-Content "$env:TPR_SRC\mods\randomizer\generator\data\settings_list.yaml" -Raw
          $session = Get-Content "$env:TPR_SRC\mods\randomizer\src\session.cpp" -Raw
          $requiredHookMarkers = @(
            'fpcMtd_Create_EnemySouls',
            'fopAc_Execute_EnemySouls',
            'fpcMtd_Delete_EnemySouls',
            'hookPreDarknutEnding',
            'hookPreKingBulblinEnding',
            'hookPreDeathSwordDeath',
            'hookPreNpcDamage',
            'shops::begin_purchase',
            'breakables::spawn_shuffled_item'
          )
          foreach ($marker in $requiredHookMarkers) {
            if (-not $hooks.Contains($marker)) { throw "Runtime hook marker is missing: $marker" }
          }
          if (-not $settings.Contains('Name: Enemy Souls')) { throw 'Enemy Souls setting was removed.' }
          if (-not $session.Contains('mStartingEnemySouls')) { throw 'Starting Enemy Souls grant is missing.' }
          if (-not $session.Contains('enemy_souls::clear_scene_actors')) { throw 'Enemy Souls scene teardown is missing.' }
          $conflicts = Get-ChildItem "$env:TPR_SRC" -Recurse -File `
            -Include *.c,*.cc,*.cpp,*.h,*.hpp,*.cmake,*.json,*.txt,*.yaml,*.yml |
            Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' } |
            Select-String -Pattern '^(<<<<<<<|=======|>>>>>>>)' -List
          if ($conflicts) { throw "Unresolved conflict markers remain: $($conflicts.Path -join ', ')" }

      - name: Configure Dusklight 2 UWP feed
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $storeLibDirs = @(
            Get-ChildItem (Join-Path $env:VCToolsInstallDir 'lib') -Recurse -File -Filter 'msvcprt.lib' |
              Where-Object {
                $libraryText = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($_.FullName))
                $libraryText.IndexOf(
                  'MSVCP140_APP.dll', [StringComparison]::OrdinalIgnoreCase) -ge 0
              } |
              ForEach-Object { $_.Directory.FullName } |
              Sort-Object -Unique
          )
          if ($storeLibDirs.Count -lt 1) {
            throw "Could not locate MSVC's UWP/Store C++ import libraries under $env:VCToolsInstallDir"
          }
          $storeLib = $storeLibDirs |
            Sort-Object { $_.Length } |
            Select-Object -First 1
          foreach ($requiredStoreLibrary in @('msvcprt.lib','msvcrt.lib','vcruntime.lib')) {
            if (-not (Test-Path (Join-Path $storeLib $requiredStoreLibrary) -PathType Leaf)) {
              throw "MSVC UWP/Store library directory is missing $requiredStoreLibrary`: $storeLib"
            }
          }
          Write-Host "Using MSVC UWP/Store import libraries: $storeLib"
          cmake -S "$env:TPR_SRC" -B "$env:TPR_FEED" -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL `
            -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON `
            -DCMAKE_OBJECT_PATH_MAX=180 `
            -DDUSK_UWP=ON `
            -DDUSK_ENABLE_CODE_MODS=ON `
            -DDUSK_ENABLE_OPUS=OFF `
            -DBOREALIS_BUILD_TESTS=OFF `
            -DBOREALIS_ENABLE_DISCORD=OFF `
            -DBOREALIS_ENABLE_SENTRY=OFF `
            -DBOREALIS_HTTP_BACKEND=none `
            -DAURORA_ENABLE_TESTS=OFF `
            -DAURORA_UWP_DEP_SOURCE_DIR="$env:TPR_UWP_DEP" `
            -DDUSK_UWP_STORE_LIB_DIR="$storeLib" `
            -DTRACY_ENABLE=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Dusklight 2 UWP feed configuration failed.' }

      - name: Compile core, built-in Randomizer, and package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build "$env:TPR_FEED" --target dusklight --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Dusklight 2 static UWP feed failed to build.' }
          foreach ($file in @('dusklight.lib')) {
            if (-not (Test-Path "$env:TPR_FEED\$file" -PathType Leaf)) {
              throw "Required core feed output is missing: $file"
            }
          }
          cmake --build "$env:TPR_FEED" --target randomizer_package --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Built-in Randomizer/package failed to build.' }
          if (-not (Test-Path "$env:TPR_FEED\bundled_mods\randomizer.dusk" -PathType Leaf)) {
            throw 'Bundled randomizer.dusk was not produced.'
          }
          if (-not (Test-Path "$env:TPR_FEED\mods\randomizer\randomizer.lib" -PathType Leaf)) {
            throw 'Built-in randomizer.lib was not produced.'
          }

      - name: Run all Randomizer generator scenarios
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build "$env:TPR_FEED" --target randomizer_generator_tests --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Randomizer generator tests failed to compile.' }
          $test = Get-ChildItem "$env:TPR_FEED" -Recurse -File -Filter 'randomizer_generator_tests.exe' |
            Select-Object -First 1
          if (-not $test) { throw 'randomizer_generator_tests.exe is missing.' }
          & $test.FullName
          if ($LASTEXITCODE -ne 0) { throw "Randomizer generator scenarios failed: $LASTEXITCODE" }

      - name: Inspect built-in Randomizer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force "$env:TPR_MOD_INSPECT" | Out-Null
          7z x "$env:TPR_FEED\bundled_mods\randomizer.dusk" `
            "-o$env:TPR_MOD_INSPECT" -y | Out-Host
          if (-not (Test-Path "$env:TPR_MOD_INSPECT\mod.json" -PathType Leaf)) {
            throw 'randomizer.dusk has no mod.json.'
          }
          $bundledNativeCode = @(Get-ChildItem "$env:TPR_MOD_INSPECT" -Recurse -File |
            Where-Object { $_.Extension -in '.dll','.exe' })
          if ($bundledNativeCode.Count -ne 0) {
            throw "randomizer.dusk still contains separately loaded native code: $($bundledNativeCode.FullName -join ', ')"
          }

          $archive = Get-Item "$env:TPR_FEED\mods\randomizer\randomizer.lib"
          $archiveBytes = [IO.File]::ReadAllBytes($archive.FullName)
          $archiveText = [Text.Encoding]::ASCII.GetString($archiveBytes)
          foreach ($marker in @(
            'Enemy Souls',
            'Torch Slug Soul',
            'Darknut Soul',
            'King Bulblin Castle Soul',
            'src/f_op/f_op_actor.cpp#fopAc_Create',
            'Fail-closed Enemy Soul gate blocked')) {
            if (-not $archiveText.Contains($marker)) {
              throw "Built-in Randomizer archive is missing runtime marker: $marker"
            }
          }

      - name: Configure final Windows Store package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S "$env:TPR_SRC\platforms\uwp" -B "$env:TPR_PKG" `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_SYSTEM_NAME=WindowsStore `
            -DCMAKE_SYSTEM_VERSION=10.0 `
            -DCMAKE_OBJECT_PATH_MAX=180 `
            -DDUSK_DIR="$env:TPR_FEED" `
            -DDUSK_SOURCE_DIR="$env:TPR_SRC" `
            -DUWP_DEP_SOURCE_DIR="$env:TPR_UWP_DEP"
          if ($LASTEXITCODE -ne 0) { throw 'Final UWP package configuration failed.' }

      - name: Create sideload signing certificate
        id: cert
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $password = [Guid]::NewGuid().ToString('N')
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject 'CN=TwilightPrincessRandomizer' `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -KeyExportPolicy Exportable `
            -KeyUsage DigitalSignature `
            -FriendlyName 'Twilight Princess Randomizer 668 Sideload Signing' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3','2.5.29.19={text}')
          Export-PfxCertificate -Cert $cert `
            -FilePath "$env:GITHUB_WORKSPACE\TPR-build-signing.pfx" `
            -Password $securePassword | Out-Null
          Export-Certificate -Cert $cert `
            -FilePath "$env:GITHUB_WORKSPACE\TwilightPrincessRandomizer.cer" | Out-Null
          Import-Certificate `
            -FilePath "$env:GITHUB_WORKSPACE\TwilightPrincessRandomizer.cer" `
            -CertStoreLocation 'Cert:\CurrentUser\TrustedPeople' | Out-Null
          "password=$password" >> $env:GITHUB_OUTPUT

      - name: Build signed Xbox/UWP package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build "$env:TPR_PKG" --config RelWithDebInfo --parallel 2 -- `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile="$env:GITHUB_WORKSPACE\TPR-build-signing.pfx" `
            /p:PackageCertificatePassword="${{ steps.cert.outputs.password }}" `
            '/p:PackageCertificateThumbprint=' `
            /p:AppxBundle=Never `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:GenerateAppxPackageOnBuild=true
          if ($LASTEXITCODE -ne 0) { throw 'Signed Xbox/UWP package build failed.' }

      - name: Verify and collect full 668 package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "$env:GITHUB_WORKSPACE\TPR-Xbox-Package-668"
          New-Item -ItemType Directory -Force $out | Out-Null
          $sourcePackage = Get-ChildItem "$env:TPR_PKG" -Recurse -File -Filter '*.msix' |
            Where-Object { $_.FullName -notmatch '[\\/]Dependencies[\\/]' } |
            Sort-Object Length -Descending | Select-Object -First 1
          if (-not $sourcePackage) { throw 'The UWP build produced no MSIX.' }
          $package = Join-Path $out 'TwilightPrincessRandomizer_1.4.1.668_x64.msix'
          Copy-Item $sourcePackage.FullName $package -Force

          New-Item -ItemType Directory -Force "$env:TPR_MSIX_INSPECT" | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory($package, "$env:TPR_MSIX_INSPECT")
          $manifestPath = "$env:TPR_MSIX_INSPECT\AppxManifest.xml"
          if (-not (Test-Path $manifestPath)) { throw 'MSIX has no AppxManifest.xml.' }
          $manifest = Get-Content $manifestPath -Raw
          foreach ($identity in @(
            'Name="TwilightPrincessRandomizer"',
            'Publisher="CN=TwilightPrincessRandomizer"',
            'Version="1.4.1.668"',
            'Name="codeGeneration"')) {
            if (-not $manifest.Contains($identity)) { throw "MSIX manifest is missing: $identity" }
          }
          $exe = "$env:TPR_MSIX_INSPECT\TwilightPrincessRandomizer.exe"
          $packagedModRoot = "$env:TPR_MSIX_INSPECT\mods\randomizer"
          foreach ($required in @(
            $exe,
            "$packagedModRoot\mod.json",
            "$packagedModRoot\res\models\boss_souls\boss_soul_argorok.bmd",
            "$packagedModRoot\res\models\boss_souls\boss_soul_zant.bmd",
            "$env:TPR_MSIX_INSPECT\SDL3.dll",
            "$env:TPR_MSIX_INSPECT\webgpu_dawn.dll",
            "$env:TPR_MSIX_INSPECT\libuwp.dll",
            "$env:TPR_MSIX_INSPECT\AppxSignature.p7x",
            "$env:TPR_MSIX_INSPECT\res\initial_pipeline_cache.db")) {
            if (-not (Test-Path $required -PathType Leaf)) { throw "MSIX payload is missing: $required" }
          }
          if (Test-Path "$env:TPR_MSIX_INSPECT\mods\randomizer.dusk") {
            throw 'MSIX still contains the LocalState-extracted Randomizer bundle.'
          }
          $separateModCode = @(Get-ChildItem $packagedModRoot -Recurse -File |
            Where-Object { $_.Extension -in '.dll','.exe' })
          if ($separateModCode.Count -ne 0 -or (Test-Path "$packagedModRoot\lib")) {
            throw 'MSIX still contains a separately loaded Randomizer native image.'
          }

          $feedModuleDir = Join-Path $env:RUNNER_TEMP 'tpr-668-feed-module'
          New-Item -ItemType Directory -Force $feedModuleDir | Out-Null
          7z x "$env:TPR_FEED\bundled_mods\randomizer.dusk" "-o$feedModuleDir" -y | Out-Null
          $packagedHashes = @{}
          Get-ChildItem $packagedModRoot -Recurse -File | ForEach-Object {
            $relative = $_.FullName.Substring($packagedModRoot.Length + 1).Replace('\','/')
            $packagedHashes[$relative] = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
          }
          $feedHashes = @{}
          Get-ChildItem $feedModuleDir -Recurse -File | ForEach-Object {
            $relative = $_.FullName.Substring($feedModuleDir.Length + 1).Replace('\','/')
            $feedHashes[$relative] = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
          }
          if ($packagedHashes.Count -ne $feedHashes.Count) {
            throw "Expanded Randomizer file count differs from feed bundle: $($packagedHashes.Count) vs $($feedHashes.Count)"
          }
          foreach ($relative in $feedHashes.Keys) {
            if (-not $packagedHashes.ContainsKey($relative) -or
                $packagedHashes[$relative] -ne $feedHashes[$relative]) {
              throw "Expanded Randomizer payload differs from feed bundle: $relative"
            }
          }

          $expectedRuntimeHashes = @{
            'SDL3.dll' = 'f288fd682ea19fa82bf9bbbfefab4132853555ad6dfe37cbe9f9c55acff4bf06'
            'webgpu_dawn.dll' = 'd1126d70c0eee87d69b802d10527d3dc301fce7514a206112ed4056cbf5b6910'
          }
          foreach ($entry in $expectedRuntimeHashes.GetEnumerator()) {
            $runtimePath = Join-Path $env:TPR_MSIX_INSPECT $entry.Key
            $actual = (Get-FileHash $runtimePath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $entry.Value) {
              throw "Packaged UWP runtime hash mismatch for $($entry.Key): $actual"
            }
          }
          $sdlImports = & dumpbin /nologo /imports "$env:TPR_MSIX_INSPECT\SDL3.dll" | Out-String
          foreach ($appCrt in @(
            'MSVCP140_APP.dll',
            'VCRUNTIME140_APP.dll',
            'VCRUNTIME140_1_APP.dll',
            'vccorlib140_app.dll')) {
            if ($sdlImports -notmatch "(?im)^\s*$([regex]::Escape($appCrt))\s*$") {
              throw "Packaged SDL3.dll is missing UWP CRT import: $appCrt"
            }
          }

          $startupBinaries = @(Get-ChildItem "$env:TPR_MSIX_INSPECT" -Recurse -File |
            Where-Object { $_.Extension -in '.exe','.dll' })
          foreach ($startupBinary in $startupBinaries) {
            $startupImports = & dumpbin /nologo /imports $startupBinary.FullName | Out-String
            foreach ($desktopCrt in @(
              'MSVCP140.dll',
              'MSVCP140_CODECVT_IDS.dll',
              'VCRUNTIME140.dll',
              'VCRUNTIME140_1.dll',
              'vccorlib140.dll')) {
              if ($startupImports -match "(?im)^\s*$([regex]::Escape($desktopCrt))\s*$") {
                throw "$($startupBinary.Name) imports unavailable desktop CRT: $desktopCrt"
              }
            }
            if ($startupBinary.Extension -eq '.dll' -and
                $startupImports -match '(?i)TwilightPrincessRandomizer[.]exe') {
              throw "$($startupBinary.Name) still imports the game executable; the second-image module architecture remains."
            }
          }

          $exeHeaders = & dumpbin /nologo /headers $exe | Out-String
          if ($exeHeaders -notmatch '(?i)machine [(]x64[)]') { throw 'Packaged executable is not x64.' }
          if ($exeHeaders -notmatch '(?i)\bmodmeta\b') {
            throw 'Packaged executable has no built-in Randomizer metadata section.'
          }
          $exeImports = & dumpbin /nologo /imports $exe | Out-String
          if ($exeImports -match '(?im)^\s*DLL Name:\s*PSAPI[.]DLL\s*$' -or
              $exeImports -match '(?i)GetMappedFileNameA') {
            throw 'Packaged executable retains the desktop-only PSAPI mapped-file diagnostic import.'
          }
          if ($exeImports -match '(?i)LoadLibraryExW') {
            throw 'Packaged executable retains the writable-path native module loader.'
          }
          foreach ($forbiddenXboxImport in @(
            'GetCurrentProcessorNumberEx',
            'GetLogicalProcessorInformationEx',
            'GetThreadGroupAffinity',
            'SetThreadGroupAffinity',
            'GetModuleHandleExA',
            'GetModuleHandleExW')) {
            if ($exeImports -match "(?i)\b$([regex]::Escape($forbiddenXboxImport))\b") {
              throw "Packaged executable retains an unproven Xbox loader import: $forbiddenXboxImport"
            }
          }
          foreach ($requiredHookImport in @('VirtualQuery','VirtualProtect','FlushInstructionCache')) {
            if ($exeImports -notmatch "(?i)\b$([regex]::Escape($requiredHookImport))\b") {
              throw "Packaged executable lost required runtime-hook import: $requiredHookImport"
            }
          }
          $exeText = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
          foreach ($startupMarker in @(
            'xbox-startup-stage.txt',
            'Xbox Startup Recovery',
            'native.ready:dev.twilitrealm.randomizer:built-in',
            'mod.initialize:',
            'hook.prepare:',
            'hook.commit:',
            'Enemy Souls',
            'Darknut Soul',
            'Torch Slug Soul',
            'src/f_op/f_op_actor.cpp#fopAc_Create',
            'Fail-closed Enemy Soul gate blocked')) {
            if (-not $exeText.Contains($startupMarker)) {
              throw "Packaged executable is missing built-in runtime marker: $startupMarker"
            }
          }
          python "$env:TPR_CONTROL\scripts\verify_pe_symdb.py" $exe
          if ($LASTEXITCODE -ne 0) { throw 'Packaged executable has no usable hook symbol manifest.' }
          $exportsPath = Join-Path $env:RUNNER_TEMP 'tpr-668-exports.txt'
          & dumpbin /nologo /exports $exe | Set-Content $exportsPath -Encoding ASCII
          $exports = Get-Content $exportsPath -Raw
          foreach ($builtInExport in @(
            'mod_ctx',
            'mod_meta',
            'mod_initialize',
            'mod_update',
            'mod_shutdown')) {
            if ($exports -notmatch "(?m)\b$([regex]::Escape($builtInExport))\s*$") {
              throw "Packaged executable is missing built-in Randomizer export: $builtInExport"
            }
          }
          $exportRows = ([regex]::Matches($exports, '(?m)^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+')).Count
          if ($exportRows -lt 5 -or $exportRows -gt 64) {
            throw "Built-in Randomizer export surface is outside the expected range: $exportRows"
          }

          if ((Get-Item $package).Length -gt 250MB) { throw 'MSIX exceeds the 250 MiB package guard.' }

          $signtoolOut = Join-Path $env:RUNNER_TEMP 'tpr-668-signtool.out'
          $signtoolErr = Join-Path $env:RUNNER_TEMP 'tpr-668-signtool.err'
          $signtoolExe = (Get-Command signtool).Source
          $verify = Start-Process -FilePath $signtoolExe `
            -ArgumentList @('verify','/pa','/v',$package) `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput $signtoolOut `
            -RedirectStandardError $signtoolErr
          $signatureOutput = ((Get-Content $signtoolOut -Raw) + "`n" +
            (Get-Content $signtoolErr -Raw)).Trim()
          $signatureOutput | Out-Host
          if ($verify.ExitCode -ne 0) {
            $errorCount = ([regex]::Matches($signatureOutput, 'SignTool Error:')).Count
            $expectedSelfSignedTrust = $signatureOutput -match `
              '(?s)SignTool Error: A certificate chain processed, but terminated in a root\s+certificate which is not trusted by the trust provider[.]'
            foreach ($signatureMarker in @(
              'Signature Index: 0 (Primary Signature)',
              'Hash of file (sha256):',
              'Issued to: TwilightPrincessRandomizer',
              'Issued by: TwilightPrincessRandomizer')) {
              if (-not $signatureOutput.Contains($signatureMarker)) {
                throw "MSIX signature report is missing: $signatureMarker"
              }
            }
            if (-not $expectedSelfSignedTrust -or $errorCount -ne 1) {
              throw "MSIX signature verification failed with an unexpected result: $($verify.ExitCode)"
            }
            Write-Host 'MSIX signature is intact; its exported sideload certificate is intentionally self-signed.'
          }

          $dependencies = @(Get-ChildItem "$env:TPR_PKG" -Recurse -File |
            Where-Object {
              $_.Extension -in '.appx','.msix' -and
              $_.FullName -match '[\\/]Dependencies[\\/]' -and
              $_.Name -match '(?i)x64'
            })
          if ($dependencies.Count -lt 1) { throw 'No x64 Microsoft VCLibs dependency was produced.' }
          python "$env:TPR_CONTROL\scripts\verify_vclibs_imports.py" `
            "$env:TPR_MSIX_INSPECT" $dependencies[0].FullName
          if ($LASTEXITCODE -ne 0) {
            throw 'Packaged binaries request symbols absent from the shipped UWP VCLibs framework.'
          }
          Copy-Item $dependencies[0].FullName $out -Force
          Copy-Item "$env:GITHUB_WORKSPACE\TwilightPrincessRandomizer.cer" $out -Force
          Copy-Item "$env:TPR_CONTROL\INSTALL_XBOX-668.md" $out -Force
          Copy-Item "$env:TPR_CONTROL\APP_IDENTITY-668.json" $out -Force

          $sourceManifest = [ordered]@{
            package = 'Twilight Princess Randomizer Xbox/UWP 1.4.1.668'
            upstreamRelease = 'Dusklight v2.0.1'
            dusklight = '422d7bb1b6c8d973cccf8b3d0b226a57ac3cc8c7'
            aurora = 'd0933b745abe0eb9815bedcea8047575da18698d + reviewed UWP and Xbox affinity patches'
            borealis = '0bdba6c50a46409c4862474c72b4a3a631fbe0ec'
            randomizer = 'd0ceae8f18bbef4a40287a72a2791a3c06c9aca5 + 662 runtime patch + 668 built-in static integration'
            xboxLoaderHotfix = 'Randomizer linked into the signed executable; optional processor-group affinity disabled; Funchook module bases resolved through VirtualQuery on UWP'
            threadAffinityPatchSha256 = '9b864a38ab17d1b3e6563c1c29a292966784639781239e48791482c64db7531f'
            dawnCacheApiPatchSha256 = '6b7ad75131e815f3e5e1ea54c89c40cc853f4ab1ed0ec22ae7386994fb357e7f'
            funchookModuleBasePatchSha256 = 'f61ee177fedaaced7024d21c481a5b35c3fb3ea1b08f7dd9b40c47ab796cea5e'
            staticRandomizerPatchSha256 = '0de7287ba0cc922ce076a81224d1a3d9c101974fcd1312cb3c4f94e7f6735566'
            sdlMainHandledPatchSha256 = '90877b6c7e6fcbff29375b73d86c5da5f31669379f5284a41dcb154b7f4aa2a2'
            xboxStartupGuard = 'Persistent phase journal and automatic safe recovery launcher; exact built-in mod-init and hook-stage reporting'
            nativeModuleDeployment = 'Single signed native executable; packaged mods/randomizer contains data only and no DLL'
            uwpDependency = '810cdcb672383045a8b03d1d55bb535352d7d46f'
            sdl3Sha256 = 'f288fd682ea19fa82bf9bbbfefab4132853555ad6dfe37cbe9f9c55acff4bf06'
            dawnSha256 = 'd1126d70c0eee87d69b802d10527d3dc301fce7514a206112ed4056cbf5b6910'
            singleNativeImage = $true
            enemySouls = $true
            generatorScenarios = 58
            workflowRun = $env:GITHUB_RUN_ID
            sourceRevision = $env:GITHUB_SHA
          }
          $sourceManifest | ConvertTo-Json | Set-Content `
            (Join-Path $out 'SOURCE-MANIFEST-668.json') -Encoding UTF8
          Get-ChildItem $out -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Sort-Object | Set-Content (Join-Path $out 'SHA256SUMS.txt') -Encoding ASCII

          $supportZip = Join-Path $out 'Twilight-Princess-Randomizer-UWP-1.4.1.668-Xbox-Support.zip'
          $supportFiles = Get-ChildItem $out -File | Where-Object { $_.Name -ne (Split-Path $supportZip -Leaf) }
          Compress-Archive -Path $supportFiles.FullName -DestinationPath $supportZip -CompressionLevel Optimal
          Remove-Item "$env:GITHUB_WORKSPACE\TPR-build-signing.pfx" -Force
          Get-Content (Join-Path $out 'SHA256SUMS.txt') | Out-Host

