            '    }',
            '    if (s_xboxOverlapCleanupPending) {',
            '        ++s_xboxOverlapCleanupAttempts;',
            '        const int cleanupResult = clearXboxTransitionFades();',
            '        const bool overlapGone = !fopOvlpM_IsPeek() && !fopOvlpM_IsDoingReq();',
